    // its OWN frames — from local text at the root, or text obtained from

    // opaque origins (where a blob minted by one document cannot be

    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS

    // contexts such as a sandboxed preview iframe) — location.origin is

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

        console.error('Failed to decode asset ' + uuid + ':', err);

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

iv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;latar&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;seigaiha&quot;,&quot;kertas&quot;,&quot;polos&quot;],&quot;default&quot;:&quot;seigaiha&quot;,&quot;tsType&quot;:&quot;'seigaiha'|'kertas'|'polos'&quot;}}\">\n// ===== ISI KONTEN =====\n// Format teks Jepang: {kanji|furigana} atau {kanji|furigana|kunciIstilah} (istilah bisa diketuk)\nconst TERMS = {\n  s7_shakaihosho: {\"kanji\":\"社会保障\",\"read\":\"しゃかいほしょう\",\"romaji\":\"\",\"arti\":\"Jaminan sosial\",\"desc\":\"Sistem yang menopang hidup warga, terbagi 4 tingkat: 自助・互助・共助・公助.\"},\n  s7_jijo: {\"kanji\":\"自助\",\"read\":\"じじょ\",\"romaji\":\"\",\"arti\":\"Bantuan diri sendiri\",\"desc\":\"Mengatasi masalah hidup dengan usaha sendiri atau keluarga.\"},\n  s7_gojo: {\"kanji\":\"互助\",\"read\":\"ごじょ\",\"romaji\":\"\",\"arti\":\"Saling bantu (informal)\",\"desc\":\"Warga sekitar atau relawan saling membantu; tidak dilembagakan.\"},\n  s7_kyojo: {\"kanji\":\"共助\",\"read\":\"きょうじょ\",\"romaji\":\"\",\"arti\":\"Bantuan bersama (asuransi sosial)\",\"desc\":\"Sistem yang dilembagakan untuk berbagi risiko antaranggota, seperti asuransi sosial.\"},\n  s7_kojo: {\"kanji\":\"公助\",\"read\":\"こうじょ\",\"romaji\":\"\",\"arti\":\"Bantuan publik\",\"desc\":\"Bantuan lembaga publik dengan dana pajak, seperti bantuan hidup (生活保護).\"},\n  s7_hoken: {\"kanji\":\"社会保険\",\"read\":\"しゃかいほけん\",\"romaji\":\"\",\"arti\":\"Asuransi sosial\",\"desc\":\"Bayar iuran, menerima manfaat saat risiko terjadi (dekat dengan 共助). 5 jenis: medis, pensiun, kaigo, ketenagakerjaan, kecelakaan kerja.\"},\n  s7_fujo: {\"kanji\":\"社会扶助\",\"read\":\"しゃかいふじょ\",\"romaji\":\"\",\"arti\":\"Bantuan sosial\",\"desc\":\"Dibiayai pajak, diberikan kepada yang membutuhkan (dekat dengan 公助). Contoh: 生活保護, 児童手当.\"},\n  s7_shotoku: {\"kanji\":\"所得保障\",\"read\":\"しょとくほしょう\",\"romaji\":\"\",\"arti\":\"Jaminan pendapatan\",\"desc\":\"Fungsi utama asuransi pensiun, ketenagakerjaan (失業給付), dan kecelakaan kerja.\"},\n  s7_iryohosho: {\"kanji\":\"医療保障\",\"read\":\"いりょうほしょう\",\"romaji\":\"\",\"arti\":\"Jaminan medis\",\"desc\":\"Fungsi utama asuransi medis dan asuransi kecelakaan kerja.\"},\n  s7_shobyo: {\"kanji\":\"傷病手当金\",\"read\":\"しょうびょうてあてきん\",\"romaji\":\"\",\"arti\":\"Tunjangan sakit/cedera\",\"desc\":\"Manfaat asuransi medis untuk pendapatan yang hilang karena sakit.\"},\n  s7_hokensha: {\"kanji\":\"保険者\",\"read\":\"ほけんしゃ\",\"romaji\":\"\",\"arti\":\"Penyelenggara asuransi\",\"desc\":\"Pensiun, ketenagakerjaan, kecelakaan kerja = negara. Kaigo = kota dan 特別区.\"},\n  s7_hihokensha: {\"kanji\":\"被保険者\",\"read\":\"ひほけんしゃ\",\"romaji\":\"\",\"arti\":\"Peserta (tertanggung)\",\"desc\":\"Pensiun: semua warga 20+. Kaigo: warga 40+. Kecelakaan kerja: pekerja (pemberi kerja yang ikut).\"},\n  s7_jiko: {\"kanji\":\"保険事故\",\"read\":\"ほけんじこ\",\"romaji\":\"\",\"arti\":\"Risiko yang ditanggung\",\"desc\":\"Medis: sakit, cedera, melahirkan, meninggal. Pensiun: usia tua, disabilitas, meninggal.\"},\n  s7_kyufu: {\"kanji\":\"保険給付\",\"read\":\"ほけんきゅうふ\",\"romaji\":\"\",\"arti\":\"Manfaat asuransi\",\"desc\":\"Contoh: 療養の給付, pensiun hari tua, layanan kaigo, tunjangan pengangguran.\"},\n  s7_nenkinkiko: {\"kanji\":\"日本年金機構\",\"read\":\"にほんねんきんきこう\",\"romaji\":\"\",\"arti\":\"Japan Pension Service\",\"desc\":\"Lembaga yang menjalankan asuransi pensiun atas nama negara.\"},\n  s7_rorei: {\"kanji\":\"老齢年金\",\"read\":\"ろうれいねんきん\",\"romaji\":\"\",\"arti\":\"Pensiun hari tua\",\"desc\":\"Manfaat pensiun untuk risiko usia tua.\"},\n  s7_izoku: {\"kanji\":\"遺族年金\",\"read\":\"いぞくねんきん\",\"romaji\":\"\",\"arti\":\"Pensiun keluarga yang ditinggalkan\",\"desc\":\"Manfaat pensiun saat peserta meninggal.\"},\n  s7_ikuji: {\"kanji\":\"育児休業給付\",\"read\":\"いくじきゅうぎょうきゅうふ\",\"romaji\":\"\",\"arti\":\"Tunjangan cuti mengasuh anak\",\"desc\":\"Salah satu manfaat asuransi ketenagakerjaan.\"},\n  s7_hosho: {\"kanji\":\"療養補償\",\"read\":\"りょうようほしょう\",\"romaji\":\"\",\"arti\":\"Kompensasi pengobatan\",\"desc\":\"Manfaat asuransi kecelakaan kerja (juga 休業補償, 遺族補償).\"},\n  s7_minkan: {\"kanji\":\"民間保険\",\"read\":\"みんかんほけん\",\"romaji\":\"\",\"arti\":\"Asuransi swasta\",\"desc\":\"Pelengkap asuransi sosial. Bidang 1: jiwa, 2: kerugian, 3: medis/kanker/kaigo.\"},\n  s7_songa: {\"kanji\":\"損害保険\",\"read\":\"そんがいほけん\",\"romaji\":\"\",\"arti\":\"Asuransi kerugian\",\"desc\":\"Bidang kedua asuransi swasta: kebakaran, kendaraan, dll.\"},\n  s7_sanpo: {\"kanji\":\"福祉三法\",\"read\":\"ふくしさんぽう\",\"romaji\":\"\",\"arti\":\"3 UU kesejahteraan\",\"desc\":\"Setelah perang: 生活保護法・児童福祉法・身体障害者福祉法.\"},\n  s7_roppo: {\"kanji\":\"福祉六法\",\"read\":\"ふくしろっぽう\",\"romaji\":\"\",\"arti\":\"6 UU kesejahteraan\",\"desc\":\"3 UU + 精神薄弱者福祉法 (kini 知的障害者福祉法), 老人福祉法, 母子福祉法 (kini 母子及び父子並びに寡婦福祉法).\"},\n  s7_shakaifukushiho: {\"kanji\":\"社会福祉法\",\"read\":\"しゃかいふくしほう\",\"romaji\":\"\",\"arti\":\"UU Kesejahteraan Sosial\",\"desc\":\"Dasar bersama usaha kesejahteraan sosial. Dari 社会福祉事業法 (1951), diubah tahun 2000.\"},\n  s7_chiteki: {\"kanji\":\"知的障害者福祉法\",\"read\":\"ちてきしょうがいしゃふくしほう\",\"romaji\":\"\",\"arti\":\"UU Kesejahteraan Disabilitas Intelektual\",\"desc\":\"Dulu 精神薄弱者福祉法 (1960), diganti nama tahun 1998.\"},\n  s7_boshi: {\"kanji\":\"母子及び父子並びに寡婦福祉法\",\"read\":\"ぼしおよびふしならびにかふふくしほう\",\"romaji\":\"\",\"arti\":\"UU Kesejahteraan Ibu/Ayah Tunggal & Janda\",\"desc\":\"Dulu 母子福祉法 (1964).\"},\n  s7_kihon: {\"kanji\":\"障害者基本法\",\"read\":\"しょうがいしゃきほんほう\",\"romaji\":\"\",\"arti\":\"UU Dasar Penyandang Disabilitas\",\"desc\":\"Dulu 心身障害者対策基本法 (1970), diganti nama tahun 1993.\"},\n  s7_sogo: {\"kanji\":\"障害者総合支援法\",\"read\":\"しょうがいしゃそうごうしえんほう\",\"romaji\":\"\",\"arti\":\"UU Dukungan Menyeluruh Disabilitas\",\"desc\":\"Dari 障害者自立支援法 (2005), diganti nama 2012 (berlaku 2013); menambahkan pasien penyakit langka.\"},\n  s7_sochi: {\"kanji\":\"措置制度\",\"read\":\"そちせいど\",\"romaji\":\"\",\"arti\":\"Sistem penetapan oleh pemerintah\",\"desc\":\"Pemerintah (措置権者) menentukan jenis dan penyedia layanan; pengguna tidak bisa memilih.\"},\n  s7_keiyaku: {\"kanji\":\"利用契約制度\",\"read\":\"りようけいやくせいど\",\"romaji\":\"\",\"arti\":\"Sistem kontrak penggunaan\",\"desc\":\"Pengguna memilih penyedia dan membuat kontrak setara; pemerintah memberi dukungan dana.\"},\n  s7_kiso: {\"kanji\":\"社会福祉基礎構造改革\",\"read\":\"しゃかいふくしきそこうぞうかいかく\",\"romaji\":\"\",\"arti\":\"Reformasi struktur dasar kesejahteraan sosial\",\"desc\":\"Tahun 2000: dari 措置制度 ke 利用契約制度; membuat 地域福祉権利擁護事業 dan sistem penyelesaian keluhan.\"},\n  s7_oeki: {\"kanji\":\"応益負担\",\"read\":\"おうえきふたん\",\"romaji\":\"\",\"arti\":\"Beban sesuai manfaat\",\"desc\":\"Membayar sesuai jumlah layanan yang diterima. Contoh unsur ini: biaya sendiri kaigo prinsipnya 10%.\"},\n  s7_ono: {\"kanji\":\"応能負担\",\"read\":\"おうのうふたん\",\"romaji\":\"\",\"arti\":\"Beban sesuai kemampuan\",\"desc\":\"Membayar sesuai pendapatan/kemampuan. Dasar sebagian besar layanan kesejahteraan saat ini.\"},\n  s7_kyufuhi: {\"kanji\":\"社会保障給付費\",\"read\":\"しゃかいほしょうきゅうふひ\",\"romaji\":\"\",\"arti\":\"Biaya manfaat jaminan sosial\",\"desc\":\"Sekitar 134 triliun yen (2021), terus naik. Per bidang: pensiun 40,2% > medis 32,4% > kesejahteraan lain 27,4%. Per fungsi terbesar: lansia.\"},\n  s7_zaigen: {\"kanji\":\"財源\",\"read\":\"ざいげん\",\"romaji\":\"\",\"arti\":\"Sumber dana\",\"desc\":\"Jaminan sosial dibiayai terutama oleh 社会保険料 (terbesar) dan 公費 (pajak).\"},\n  s7_hokenryo: {\"kanji\":\"社会保険料\",\"read\":\"しゃかいほけんりょう\",\"romaji\":\"\",\"arti\":\"Iuran asuransi sosial\",\"desc\":\"Ditanggung peserta dan pemberi kerja; porsi sumber dana terbesar.\"},\n  s7_kohi: {\"kanji\":\"公費\",\"read\":\"こうひ\",\"romaji\":\"\",\"arti\":\"Dana publik (pajak)\",\"desc\":\"Beban negara dan daerah dari pajak.\"},\n  s7_ippan: {\"kanji\":\"一般会計\",\"read\":\"いっぱんかいけい\",\"romaji\":\"\",\"arti\":\"Anggaran umum negara\",\"desc\":\"Biaya jaminan sosial adalah pos pengeluaran terbesar (lebih dari 30%), di atas 国債費 dan 地方交付税.\"},\n  s7_futanritsu: {\"kanji\":\"国民負担率\",\"read\":\"こくみんふたんりつ\",\"romaji\":\"\",\"arti\":\"Rasio beban nasional\",\"desc\":\"Pajak + iuran sosial dibagi pendapatan nasional. Jepang: menengah; Prancis tinggi, AS rendah.\"},\n  s7_rojinfukushi: {\"kanji\":\"老人福祉法\",\"read\":\"ろうじんふくしほう\",\"romaji\":\"\",\"arti\":\"UU Kesejahteraan Lansia\",\"desc\":\"1963: menetapkan prinsip kesejahteraan lansia dan mendirikan 特別養護老人ホーム.\"},\n  s7_muryo: {\"kanji\":\"老人医療費支給制度\",\"read\":\"ろうじんいりょうひしきゅうせいど\",\"romaji\":\"\",\"arti\":\"Sistem biaya medis lansia (gratis)\",\"desc\":\"1973: biaya medis lansia 70+ digratiskan.\"},\n  s7_rojinhoken: {\"kanji\":\"老人保健法\",\"read\":\"ろうじんほけんほう\",\"romaji\":\"\",\"arti\":\"UU Kesehatan Lansia\",\"desc\":\"1982: meninjau ulang pengobatan gratis dan memperkenalkan biaya sendiri sebagian.\"},\n  s7_gold: {\"kanji\":\"ゴールドプラン\",\"read\":\"ゴールドプラン\",\"romaji\":\"\",\"arti\":\"Gold Plan\",\"desc\":\"1989: strategi 10 tahun kesehatan & kesejahteraan lansia. 1994 新ゴールドプラン, 1999 ゴールドプラン21.\"},\n  s7_hachiho: {\"kanji\":\"福祉関係八法改正\",\"read\":\"ふくしかんけいはっぽうかいせい\",\"romaji\":\"\",\"arti\":\"Revisi 8 UU kesejahteraan\",\"desc\":\"1990: layanan di rumah dilegalkan dan kewenangan disatukan ke kota.\"},\n  s7_kaigohoken: {\"kanji\":\"介護保険法\",\"read\":\"かいごほけんほう\",\"romaji\":\"\",\"arti\":\"UU Asuransi Kaigo\",\"desc\":\"Dibuat 1997, berlaku 2000. Revisi 2005: pencegahan, 地域包括支援センター. 2011: 定期巡回. 2017: 介護医療院, 共生型.\"},\n  s7_sokakuho: {\"kanji\":\"医療介護総合確保推進法\",\"read\":\"いりょうかいごそうごうかくほすいしんほう\",\"romaji\":\"\",\"arti\":\"UU Promosi Integrasi Medis & Kaigo\",\"desc\":\"2014: mendorong 地域医療構想 dan 地域包括ケアシステム.\"},\n  s7_juso: {\"kanji\":\"重層的支援体制整備事業\",\"read\":\"じゅうそうてきしえんたいせいせいびじぎょう\",\"romaji\":\"\",\"arti\":\"Program sistem dukungan berlapis\",\"desc\":\"Dibuat lewat revisi UU Kesejahteraan Sosial 2020 untuk 地域共生社会.\"},\n  s7_kyoseishakai: {\"kanji\":\"共生社会\",\"read\":\"きょうせいしゃかい\",\"romaji\":\"\",\"arti\":\"Masyarakat inklusif\",\"desc\":\"Konsep 障害者基本計画 (2003–2027). Perubahan filosofi: perlindung UU asuransi sosial pertama, untuk pekerja buruh.\"},\n  s7_kokuho: {\"kanji\":\"国民健康保険法\",\"read\":\"こくみんけんこうほけんほう\",\"romaji\":\"\",\"arti\":\"UU Asuransi Kesehatan Nasional\",\"desc\":\"1938: pendirian dan kepesertaan sukarela. Revisi 1958 → 国民皆保険 sejak 1961.\"},\n  s7_kaihoken: {\"kanji\":\"国民皆保険・皆年金\",\"read\":\"こくみんかいほけん・かいねんきん\",\"romaji\":\"\",\"arti\":\"Asuransi & pensiun untuk semua warga\",\"desc\":\"Terwujud tahun 1961.\"},\n  s7_koyo: {\"kanji\":\"雇用保険法\",\"read\":\"こようほけんほう\",\"romaji\":\"\",\"arti\":\"UU Asuransi Ketenagakerjaan\",\"desc\":\"1974: menggantikan 失業保険法 (1947).\"},\n  s7_kisonenkin: {\"kanji\":\"基礎年金制度\",\"read\":\"きそねんきんせいど\",\"romaji\":\"\",\"arti\":\"Sistem pensiun dasar\",\"desc\":\"Diperkenalkan lewat revisi pensiun 1985 (termasuk 障害基礎年金).\"},\n  s7_shikaku: {\"kanji\":\"社会福祉士及び介護福祉士法\",\"read\":\"しゃかいふくししおよびかいごふくししほう\",\"romaji\":\"\",\"arti\":\"UU Pekerja Sosial & Care Worker\",\"desc\":\"1987: lahir kualifikasi nasional 社会福祉士 dan 介護福祉士. Direvisi 2007.\"},\n  s7_koki: {\"kanji\":\"後期高齢者医療制度\",\"read\":\"こうきこうれいしゃいりょうせいど\",\"romaji\":\"\",\"arti\":\"Sistem medis lansia tahap akhir\",\"desc\":\"Dibuat lewat revisi UU Asuransi Kesehatan 2006 (usia 75+).\"},\n  s7_barrier: {\"kanji\":\"バリアフリー法\",\"read\":\"バリアフリーほう\",\"romaji\":\"\",\"arti\":\"UU Barrier-Free\",\"desc\":\"2006: menggabungkan ハートビル法 dan 交通バリアフリー法.\"},\n  s7_ittai: {\"kanji\":\"社会保障・税一体改革大綱\",\"read\":\"しゃかいほしょう・ぜいいったいかいかくたいこう\",\"romaji\":\"\",\"arti\":\"Garis besar reformasi terpadu jaminan sosial & pajak\",\"desc\":\"Diputuskan kabinet Feb 2012; 8 RUU terkait disahkan.\"},\n  p5_shisetsu: {\"kanji\":\"養介護施設従事者等\",\"read\":\"ようかいごしせつじゅうじしゃとう\",\"romaji\":\"\",\"arti\":\"Staf fasilitas/usaha perawatan\",\"desc\":\"Salah satu dari 2 jenis pelaku dalam UU lansia. Jika menemukan kekerasan oleh staf, wajib lapor ke kota tanpa melihat tingkat bahaya.\"},\n  p5_minashi: {\"kanji\":\"みなし高齢者\",\"read\":\"みなしこうれいしゃ\",\"romaji\":\"\",\"arti\":\"Dianggap lansia\",\"desc\":\"Penyand 立支援事業\",\"read\":\"にちじょうせいかつじりつしえんじぎょう\",\"romaji\":\"nichijō seikatsu jiritsu shien jigyō\",\"arti\":\"Program dukungan kemandirian hidup sehari-hari\",\"desc\":\"Dilaksanakan dewan kesejahteraan sosial (社協) berdasarkan UU Kesejahteraan Sosial. Membantu pengelolaan uang harian dan penggunaan layanan, lewat kontrak.\"},\n  p4_hotei: {\"kanji\":\"法定後見制度\",\"read\":\"ほうていこうけんせいど\",\"romaji\":\"hōtei kōken seido\",\"arti\":\"Perwalian hukum\",\"desc\":\"Untuk orang yang kemampuan menilainya sudah kurang. Pengadilan keluarga menunjuk wali. 3 jenis: 後見・保佐・補助.\"},\n  p4_koken: {\"kanji\":\"後見\",\"read\":\"こうけん\",\"romaji\":\"kōken\",\"arti\":\"Perwalian penuh\",\"desc\":\"Untuk orang yang selalu tidak mampu menilai. Wali (成年後見人) punya hak mewakili semua tindakan hukum terkait harta. Tidak perlu persetujuan pengguna.\"},\n  p4_hosa: {\"kanji\":\"保佐\",\"read\":\"ほさ\",\"romaji\":\"hosa\",\"arti\":\"Pendampingan (curatorship)\",\"desc\":\"Untuk orang yang kemampuan menilainya sangat kurang. Pendamping disebut 保佐人.\"},\n  p4_hojo: {\"kanji\":\"補助\",\"read\":\"ほじょ\",\"romaji\":\"hojo\",\"arti\":\"Bantuan hukum (assistance)\",\"desc\":\"Untuk orang yang kemampuan menilainya kurang. Perlu persetujuan pengguna saat mengajukan.\"},\n  p4_ninni: {\"kanji\":\"任意後見制度\",\"read\":\"にんいこうけんせいど\",\"romaji\":\"nin'i kōken seido\",\"arti\":\"Perwalian sukarela\",\"desc\":\"Saat masih mampu, memilih wali dan isi tugasnya lewat kontrak akta notaris (公正証書). Berlaku setelah pengadilan menunjuk pengawas wali (任意後見監督人).\"},\n  p4_shinjo: {\"kanji\":\"身上監護\",\"read\":\"しんじょうかんご\",\"romaji\":\"shinjō kango\",\"arti\":\"Perlindungan diri (urusan pribadi)\",\"desc\":\"Tugas wali mewakili kontrak perawatan, masuk RS, atau fasilitas. Tindakan perawatan langsung tidak termasuk.\"},\n  p4_torikeshi: {\"kanji\":\"取消し\",\"read\":\"とりけし\",\"romaji\":\"torikeshi\",\"arti\":\"Pembatalan\",\"desc\":\"Tindakan hukum oleh orang di bawah perwalian bisa dibatalkan, kecuali pembelian kebutuhan sehari-hari.\"},\n  p4_koseishosho: {\"kanji\":\"公正証書\",\"read\":\"こうせいしょうしょ\",\"romaji\":\"kōsei shōsho\",\"arti\":\"Akta notaris\",\"desc\":\"Kontrak perwalian sukarela dibuat di kantor notaris (公証役場) dalam bentuk akta notaris, lalu didaftarkan ke kantor hukum (法務局).\"},\n  p4_senmonin: {\"kanji\":\"専門員\",\"read\":\"せんもんいん\",\"romaji\":\"senmon'in\",\"arti\":\"Tenaga ahli (program kemandirian)\",\"desc\":\"Dalam 日常生活自立支援事業, membuat rencana dukungan dan menandatangani kontrak. Biasanya pekerja sosial.\"},\n  p4_seikatsushienin: {\"kanji\":\"生活支援員\",\"read\":\"せいかつしえんいん\",\"romaji\":\"seikatsu shien'in\",\"arti\":\"Pendamping hidup\",\"desc\":\"Memberikan bantuan nyata sesuai rencana dan instruksi 専門員.\"},\n  p4_shinsaseikyu: {\"kanji\":\"審査請求\",\"read\":\"しんさせいきゅう\",\"romaji\":\"shinsa seikyū\",\"arti\":\"Banding administratif\",\"desc\":\"Diajukan jika tidak puas dengan keputusan pemerintah, dalam 3 bulan sejak hari berikutnya setelah mengetahui keputusan.\"},\n  p4_unei: {\"kanji\":\"運営適正化委員会\",\"read\":\"うんえいてきせいかいいんかい\",\"romaji\":\"un'ei tekiseika iinkai\",\"arti\":\"Komite kelayakan operasional\",\"desc\":\"Ditempatkan di dewan kesejahteraan sosial prefektur. Menerima keluhan tentang layanan kesejahteraan.\"},\n  p4_kujo: {\"kanji\":\"苦情解決責任者\",\"read\":\"くじょうかいけつせきにんしゃ\",\"romaji\":\"kujō kaiketsu sekininsha\",\"arti\":\"Penanggung jawab penyelesaian keluhan\",\"desc\":\"Ditempatkan di setiap tempat layanan untuk menangani keluhan pengguna.\"},\n  p5_gyakutai: {\"kanji\":\"虐待\",\"read\":\"ぎゃくたい\",\"romaji\":\"gyakutai\",\"arti\":\"Penganiayaan, kekerasan\",\"desc\":\"Perlakuan yang melukai fisik, mental, seksual, ekonomi, atau penelantaran.\"},\n  p5_yogosha: {\"kanji\":\"養護者\",\"read\":\"ようごしゃ\",\"romaji\":\"yōgosha\",\"arti\":\"Pengasuh (keluarga)\",\"desc\":\"Orang yang merawat lansia/penyandang disabilitas di rumah, misalnya keluarga. Bukan staf fasilitas.\"},\n  p5_shintai: {\"kanji\":\"身体的虐待\",\"read\":\"しんたいてきぎゃくたい\",\"romaji\":\"shintaiteki gyakutai\",\"arti\":\"Kekerasan fisik\",\"desc\":\"Kekerasan yang menyebabkan atau bisa menyebabkan luka. Jenis terbanyak pada lansia dan disabilitas.\"},\n  p5_shinri: {\"kanji\":\"心理的虐待\",\"read\":\"しんりてきぎゃくたい\",\"romaji\":\"shinriteki gyakutai\",\"arti\":\"Kekerasan psikologis\",\"desc\":\"Kata-kata sangat kasar, sikap menolak, dan perilaku yang melukai hati.\"},\n  p5_neglect: {\"kanji\":\"介護等放棄\",\"read\":\"かいごとうほうき\",\"romaji\":\"kaigo-tō hōki\",\"arti\":\"Penelantaran (neglect)\",\"desc\":\"Sangat mengabaikan perawatan: mengurangi makan secara ekstrem, membiarkan lama, dll.\"},\n  p5_keizai: {\"kanji\":\"経済的虐待\",\"read\":\"けいざいてきぎゃくたい\",\"romaji\":\"keizaiteki gyakutai\",\"arti\":\"Kekerasan ekonomi\",\"desc\":\"Menggunakan atau mengambil harta lansia secara tidak sah.\"},\n  p5_seiteki: {\"kanji\":\"性的虐待\",\"read\":\"せいてきぎゃくたい\",\"romaji\":\"seiteki gyakutai\",\"arti\":\"Kekerasan seksual\",\"desc\":\"Melakukan atau memaksa tindakan asusila.\"},\n  p5_tsuho: {\"kanji\":\"通報義務\",\"read\":\"つうほうぎむ\",\"romaji\":\"tsūhō gimu\",\"arti\":\"Kewajiban melapor\",\"desc\":\"Yang menemukan dugaan kekerasan wajib melapor ke kota (市町村). Melapor tidak melanggar kewajiban kerahasiaan.\"},\n  p5_menseki: {\"kanji\":\"守秘義務違反\",\"read\":\"しゅひぎむいはん\",\"romaji\":\"shuhi gimu ihan\",\"arti\":\"Pelanggaran kewajiban kerahasiaan\",\"desc\":\"Melaporkan kekerasan tidak dianggap pelanggaran kerahasiaan, dan pelapor tidak boleh dipecat karenanya.\"},\n  p5_tachiiri: {\"kanji\":\"立入調査\",\"read\":\"たちいりちょうさ\",\"romaji\":\"tachiiri chōsa\",\"arti\":\"Pemeriksaan di tempat\",\"desc\":\"Kota bisa memasuki rumah untuk memastikan keselamatan. Jika ada bahaya serius, bisa minta bantuan kepala kepolisian.\"},\n  p5_shiyosha: {\"kanji\":\"使用者\",\"read\":\"しようしゃ\",\"romaji\":\"shiyōsha\",\"arti\":\"Pemberi kerja\",\"desc\":\"Salah satu dari 3 jenis pelaku dalam UU Pencegahan Kekerasan terhadap Penyandang Disabilitas. Laporan bisa ke kota atau prefektur.\"},\n  p5_kenrisenter: {\"kanji\":\"都道府県障害者権利擁護センター\",\"read\":\"とどうふけんしょうがいしゃけんりようごセンター\",\"romaji\":\"todōfuken shōgaisha kenri yōgo sentā\",\"arti\":\"Pusat advokasi hak disabilitas prefektur\",\"desc\":\"Lembaga prefektur dalam UU pencegahan kekerasan disabilitas. Di kota: 市町村障害者虐待防止センター.\"},\n  p1_koreika: { kanji: '高齢化率', read: 'こうれいかりつ', romaji: 'kōreika ritsu', arti: 'Tingkat penuaan penduduk', desc: 'Persentase penduduk usia 65+ dari total penduduk. Jepang sekitar 29,3%.' },\n  p1_tfr: { kanji: '合計特殊出生率', read: 'ごうけいとくしゅしゅっしょうりつ', romaji: 'gōkei tokushu shusshō ritsu', arti: 'Angka kelahiran total (TFR)', desc: 'Rata-rata jumlah anak yang dilahirkan seorang wanita seumur hidup. Jepang 2023: 1,20.' },\n  p1_shoshi: { kanji: '少子高齢化', read: 'しょうしこうれいか', romaji: 'shōshi kōreika', arti: 'Kelahiran menurun & penuaan penduduk', desc: 'Anak makin sedikit dan lansia makin banyak. Sejak 1997 jumlah lansia melampaui jumlah anak.' },\n  p1_course: { kanji: 'ライフコース', read: 'ライフコース', romaji: 'raifu kōsu', arti: 'Jalur hidup (life course)', desc: 'Pandangan bahwa setiap individu memilih jalur hidupnya sendiri, bukan hanya mengikuti tahapan umum.' },\n  p1_kattou: { kanji: '役割葛藤', read: 'やくわりかっとう', romaji: 'yakuwari kattō', arti: 'Konflik peran', desc: 'Pertentangan antara beberapa peran yang dimiliki seseorang, misalnya peran sebagai pekerja dan sebagai pengasuh orang tua.' },\n  p1_bias: { kanji: 'ジェンダー・バイアス', read: 'ジェンダー・バイアス', romaji: 'jendā baiasu', arti: 'Bias gender', desc: 'Prasangka atau stereotip tetap tentang peran laki-laki dan perempuan di masyarakat.' },\n  p1_mcurve: { kanji: 'M字カーブ', read: 'エムじカーブ', romaji: 'emu-ji kābu', arti: 'Kurva M', desc: 'Pola tingkat kerja wanita: naik saat mulai bekerja, turun saat menikah/melahirkan, naik lagi setelah anak besar.' },\n  p1_fuyo: { kanji: '扶養義務', read: 'ふようぎむ', romaji: 'fuyō gimu', arti: 'Kewajiban menafkahi', desc: 'Menurut KUH Perdata, kerabat garis lurus dan saudara kandung wajib saling menafkahi.' },\n  p1_inzoku: { kanji: '姻族', read: 'いんぞく', romaji: 'inzoku', arti: 'Kerabat karena perkawinan', desc: 'Kerabat dari pihak pasangan. Termasuk 親族 sampai derajat 3.' },\n  p1_kaku: { kanji: '核家族世帯', read: 'かくかぞくせたい', romaji: 'kaku kazoku setai', arti: 'Rumah tangga keluarga inti', desc: 'Suami-istri saja, suami-istri dengan anak belum menikah, atau orang tua tunggal dengan anak belum menikah.' },\n  p2_gemein: { kanji: 'ゲマインシャフト', read: 'ゲマインシャフト', romaji: 'gemainshafuto', arti: 'Gemeinschaft (masyarakat paguyuban)', desc: 'Konsep Tönnies: kelompok alami berdasarkan ikatan batin, misalnya keluarga dan desa.' },\n  p2_gesell: { kanji: 'ゲゼルシャフト', read: 'ゲゼルシャフト', romaji: 'gezerushafuto', arti: 'Gesellschaft (masyarakat patembayan)', desc: 'Konsep Tönnies: kelompok buatan berdasarkan pilihan dan kepentingan, misalnya kota besar.' },\n  p2_settle: { kanji: 'セツルメント', read: 'セツルメント', romaji: 'setsurumento', arti: 'Gerakan settlement', desc: 'Orang berpendidikan tinggal di kawasan miskin untuk meneliti dan membantu warga. Pertama: Toynbee Hall (1884, Inggris).' },\n  p2_genkai: { kanji: '限界集落', read: 'げんかいしゅうらく', romaji: 'genkai shūraku', arti: 'Desa ambang batas', desc: 'Desa yang penduduk usia 65+ lebih dari 50%, sehingga fungsi komunitas sulit dipertahankan.' },\n  p2_kaso: { kanji: '過疎地域', read: 'かそちいき', romaji: 'kaso chiiki', arti: 'Daerah jarang penduduk', desc: 'Daerah yang ditetapkan hukum karena penurunan penduduk yang tinggi. Mencakup sekitar 51,5% kota/desa.' },\n  p2_minsei: { kanji: '民生委員', read: 'みんせいいいん', romaji: 'minsei iin', arti: 'Relawan kesejahteraan warga', desc: 'Diangkat Menteri Kesehatan atas rekomendasi gubernur. Masa jabatan 3 tahun, tidak digaji, sekaligus menjadi 児童委員.' },\n  p2_fukushi: { kanji: '福祉事務所', read: 'ふくしじむしょ', romaji: 'fukushi jimusho', arti: 'Kantor urusan kesejahteraan', desc: 'Wajib didirikan prefektur dan kota, opsional untuk 町村. Prefektur menangani 3 UU, kota menangani 6 UU kesejahteraan.' },\n  p2_jido: { kanji: '児童相談所', read: 'じどうそうだんじょ', romaji: 'jidō sōdanjo', arti: 'Pusat konsultasi anak', desc: 'Wajib di prefektur dan kota besar tertentu. Bisa melakukan perlindungan sementara anak (lebih dari 2 bulan perlu izin pengadilan keluarga).' },\n  p2_kosei: { kanji: '身体障害者更生相談所', read: 'しんたいしょうがいしゃこうせいそうだんじょ', romaji: 'shintai shōgaisha kōsei sōdanjo', arti: 'Pusat konsultasi rehabilitasi disabilitas fisik', desc: 'Wajib didirikan prefektur. Menilai secara medis/psikologis dan menilai kesesuaian alat bantu (補装具).' },\n  p2_seishin: { kanji: '精神保健福祉センター', read: 'せいしんほけんふくしセンター', romaji: 'seishin hoken fukushi sentā', arti: 'Pusat kesehatan jiwa & kesejahteraan', desc: 'Wajib di prefektur dan kota besar tertentu. Menilai buku disabilitas mental dan biaya pengobatan rawat jalan jiwa.' },\n  kh_nintei: { kanji: '要介護認定', read: 'ようかいごにんてい', romaji: 'yōkaigo nintei', arti: 'Sertifikasi tingkat perlu perawatan', desc: 'Proses kota menentukan apakah seseorang perlu dukungan (要支援1–2) atau perlu perawatan (要介護1–5). Tanpa sertifikasi ini, layanan asuransi kaigo tidak bisa dipakai.' },\n  kh_ichiji: { kanji: '一次判定', read: 'いちじはんてい', romaji: 'ichiji hantei', arti: 'Penilaian tahap 1', desc: 'Penilaian oleh komputer berdasarkan hasil survei dasar 74 butir dan pendapat dokter. Hasilnya berupa perkiraan waktu perawatan (基準時間).' },\n  kh_shinsakai: { kanji: '介護認定審査会', read: 'かいごにんていしんさかい', romaji: 'kaigo nintei shinsakai', arti: 'Dewan pemeriksa sertifikasi kaigo', desc: 'Melakukan penilaian tahap 2 (二次判定). Anggotanya ahli kesehatan, medis, dan kesejahteraan yang diangkat wali kota. Masa jabatan prinsipnya 2 tahun.' },\n  kh_ikensho: { kanji: '主治医意見書', read: 'しゅじいいけんしょ', romaji: 'shujii ikensho', arti: 'Surat pendapat dokter utama', desc: 'Dokumen dari dokter yang biasa merawat, tentang penyakit dan kondisi pemohon. Dipakai di penilaian tahap 1 dan 2.' },\n  kh_tokutei: { kanji: '特定疾病', read: 'とくていしっぺい', romaji: 'tokutei shippei', arti: '16 penyakit khusus', desc: 'Penyakit yang terkait penuaan. Peserta asuransi nomor 2 (usia 40–64) hanya bisa memakai layanan kaigo jika penyebabnya salah sa rmalisasi.\"},{\"jp\":\"{発達|はったつ}の{保障|ほしょう}\",\"id\":\"Jaminan perkembangan\",\"reason\":\"Konsep 糸賀一雄.\"}],\"explain\":\"8 prinsip Nirje: ritme hari, minggu, tahun; pengalaman siklus hidup; menghormati keinginan; hubungan dengan lawan jenis; standar ekonomi; standar lingkungan.\"},{\"jp\":\"「この{子|こ}らを{世|よ}の{光|ひかり}に」と{述|の}べ、{発達保障|はったつほしょう}を{唱|とな}えた{人物|じんぶつ}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 tokoh yang menulis \\\"この子らを世の光に\\\" dan mengusulkan jaminan perkembangan.\",\"answer\":3,\"opts\":[{\"jp\":\"{石井十次|いしいじゅうじ}\",\"id\":\"Ishii Juji\",\"reason\":\"Tokoh panti asuhan.\"},{\"jp\":\"{留岡幸助|とめおかこうすけ}\",\"id\":\"Tomeoka Kosuke\",\"reason\":\"Tokoh pendidikan anak nakal.\"},{\"jp\":\"{石井亮一|いしいりょういち}\",\"id\":\"Ishii Ryoichi\",\"reason\":\"Pendiri fasilitas disabilitas intelektual pertama.\"},{\"jp\":\"{糸賀一雄|いとがかずお}\",\"id\":\"Itoga Kazuo\",\"reason\":\"Benar.\"},{\"jp\":\"{野口幽香|のぐちゆか}\",\"id\":\"Noguchi Yuka\",\"reason\":\"Tokoh TK untuk anak miskin.\"}],\"explain\":\"糸賀一雄 = \\\"この子らを世の光に\\\", jaminan perkembangan (発達保障).\"},{\"jp\":\"フランクルの3つの{価値|かち}のうち、{生命|せいめい}が{制限|せいげん}される{状況|じょうきょう}でどのような{態度|たいど}をとるかで{実現|じつげん}される{価値|かち}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 nilai Frankl yang terwujud dari sikap saat hidup dibatasi.\",\"answer\":1,\"opts\":[{\"jp\":\"{創造価値|そうぞうかち}\",\"id\":\"Nilai kreasi\",\"reason\":\"Terwujud lewat karya.\"},{\"jp\":\"{態度価値|たいどかち}\",\"id\":\"Nilai sikap\",\"reason\":\"Benar.\"},{\"jp\":\"{体験価値|たいけんかち}\",\"id\":\"Nilai pengalaman\",\"reason\":\"Terwujud lewat pengalaman.\"},{\"jp\":\"{経済価値|けいざいかち}\",\"id\":\"Nilai ekonomi\",\"reason\":\"Bukan konsep Frankl.\"},{\"jp\":\"{社会価値|しゃかいかち}\",\"id\":\"Nilai sosial\",\"reason\":\"Bukan konsep Frankl.\"}],\"explain\":\"Frankl: 創造価値, 体験価値, 態度価値.\"},{\"jp\":\"{障害者|しょうがいしゃ}の{権利|けんり}に{関|かん}する{条約|じょうやく}について、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan yang benar tentang Konvensi Hak Penyandang Disabilitas.\",\"answer\":4,\"opts\":[{\"jp\":\"1981{年|ねん}に{採択|さいたく}された。\",\"id\":\"Diadopsi tahun 1981.\",\"reason\":\"1981 = Tahun Internasional Penyandang Disabilitas. Konvensi diadopsi 2006.\"},{\"jp\":\"{日本|にほん}は2006{年|ねん}に{批准|ひじゅん}した。\",\"id\":\"Jepang meratifikasi tahun 2006.\",\"reason\":\"Jepang meratifikasi Januari 2014.\"},{\"jp\":\"テーマは「{完全参加|かんぜんさんか}と{平等|びょうどう}」である。\",\"id\":\"Temanya \\\"partisipasi penuh dan kesetaraan\\\".\",\"reason\":\"Itu tema Tahun Internasional 1981.\"},{\"jp\":\"アメリカの{国内法|こくないほう}である。\",\"id\":\"Merupakan UU dalam negeri AS.\",\"reason\":\"Itu ADA (1990).\"},{\"jp\":\"「{合理的配慮|ごうりてきはいりょ}」が{国際条約|こくさいじょうやく}で{初|はじ}めて{取|と}り{上|あ}げられた。\",\"id\":\"\\\"Akomodasi yang wajar\\\" pertama kali muncul di perjanjian internasional.\",\"reason\":\"Benar.\"}],\"explain\":\"Konvensi 2006, Jepang ratifikasi 2014, prinsip \\\"Nothing about us without us\\\", konsep 合理的配慮.\"},{\"jp\":\"{日本国憲法|にほんこくけんぽう}{第|だい}25{条|じょう}に{規定|きてい}されているものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 yang diatur dalam Pasal 25 Konstitusi Jepang.\",\"answer\":2,\"opts\":[{\"jp\":\"{法|ほう}の{下|もと}の{平等|びょうどう}\",\"id\":\"Kesetaraan di depan hukum\",\"reason\":\"Pasal 14.\"},{\"jp\":\"{思想|しそう}・{良心|りょうしん}の{自由|じゆう}\",\"id\":\"Kebebasan berpikir dan hati nurani\",\"reason\":\"Pasal 19.\"},{\"jp\":\"{生存権|せいぞんけん}\",\"id\":\"Hak hidup layak\",\"reason\":\"Benar.\"},{\"jp\":\"{幸福追求権|こうふくついきゅうけん}\",\"id\":\"Hak mengejar kebahagiaan\",\"reason\":\"Pasal 13.\"},{\"jp\":\"{両性|りょうせい}の{平等|びょうどう}\",\"id\":\"Kesetaraan suami-istri\",\"reason\":\"Pasal 24.\"}],\"explain\":\"Pasal 11 HAM, 13 penghormatan individu, 14 kesetaraan, 19 kebebasan berpikir, 24 kesetaraan dalam keluarga, 25 hak hidup layak.\"},{\"jp\":\"{生活扶助基準|せいかつふじょきじゅん}が{最低限度|さいていげんど}の{生活|せいかつ}を{維持|いじ}できるかを{争|あらそ}い、「{人間裁判|にんげんさいばん}」と{呼|よ}ばれた{訴訟|そしょう}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 gugatan yang mempersoalkan standar bantuan hidup dan disebut \\\"pengadilan manusia\\\".\",\"answer\":0,\"opts\":[{\"jp\":\"{朝日訴訟|あさひそしょう}\",\"id\":\"Kasus Asahi\",\"reason\":\"Benar.\"},{\"jp\":\"{堀木訴訟|ほりきそしょう}\",\"id\":\"Kasus Horiki\",\"reason\":\"Larangan menerima tunjangan ganda.\"},{\"jp\":\"{牧野訴訟|まきのそしょう}\",\"id\":\"Kasus Makino\",\"reason\":\"Tidak dibahas di materi ini.\"},{\"jp\":\"{宇都宮病院事件|うつのみやびょういんじけん}\",\"id\":\"Kasus RS Utsunomiya\",\"reason\":\"Pelanggaran HAM di RS jiwa.\"},{\"jp\":\"{大津事件|おおつじけん}\",\"id\":\"Kasus Otsu\",\"reason\":\"Tidak berhubungan.\"}],\"explain\":\"朝日訴訟 = standar bantuan hidup (生存権). 堀木訴訟 = larangan tunjangan ganda.\"},{\"jp\":\"{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}について、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan yang benar tentang program dukungan kemandirian hidup sehari-hari.\",\"answer\":3,\"opts\":[{\"jp\":\"{民法|みんぽう}に{基|もと}づく{制度|せいど}である。\",\"id\":\"Berdasarkan KUH Perdata.\",\"reason\":\"Berdasarkan UU Kesejahteraan Sosial.\"},{\"jp\":\"{家庭裁判所|かていさいばんしょ}に{申|もう}し{立|た}てる。\",\"id\":\"Diajukan ke pengadilan keluarga.\",\"reason\":\"Itu perwalian dewasa. Program ini ke 社協.\"},{\"jp\":\"{不動産|ふどうさん}の{売却|ばいきゃく}を{行|おこな}う。\",\"id\":\"Menjual properti.\",\"reason\":\"Itu tugas wali.\"},{\"jp\":\"{本人|ほんにん}と{社会福祉協議会|しゃかいふくしきょうぎかい}の{契約|けいやく}で{利用|りよう}する。\",\"id\":\"Dipakai lewat kontrak antara pengguna dan dewan kesejahteraan sosial.\",\"reason\":\"Benar.\"},{\"jp\":\"{判断能力|はんだんのうりょく}がまったくない{人|ひと}が{対象|たいしょう}である。\",\"id\":\"Untuk orang yang sama sekali tidak punya kemampuan menilai.\",\"reason\":\"Harus masih bisa memahami isi kontrak.\"}],\"explain\":\"Perwalian dewasa: KUH Perdata, pengadilan keluarga. Program ini: UU Kesejahteraan Sosial, 社協, kontrak, uang harian.\"}] },\n  'songen-4': { html: 'songen-4', title: '権利擁護（詳細）', titleId: 'Perlindungan hak: perwalian & keluhan (Pertemuan 4)', terms: [\"p4_hotei\",\"p4_koken\",\"p4_hosa\",\"p4_hojo\",\"p4_ninni\",\"p4_shinjo\",\"p4_torikeshi\",\"p4_koseishosho\",\"p4_senmonin\",\"p4_seikatsushienin\",\"p4_shinsaseikyu\",\"p4_unei\",\"p4_kujo\"], sections: [], quiz: [{\"jp\":\"{判断能力|はんだんのうりょく}を{欠|か}く{常況|じょうきょう}にある{人|ひと}が{対象|たいしょう}となる{類型|るいけい}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 jenis perwalian untuk orang yang selalu tidak mampu menilai.\",\"answer\":0,\"opts\":[{\ erms: ['kh_nintei', 'kh_ichiji', 'kh_shinsakai', 'kh_ikensho', 'kh_tokutei', 'kh_yobo', 'kh_chiiki', 'kh_kaishu', 'kh_shien'],\n    sections: [\n      { h: '{要介護認定|ようかいごにんてい}の{流|なが}れ', hid: 'Alur sertifikasi',\n        jp: 'まず{市町村|しちょうそん}に{申請|しんせい}します（{新規|しんき}・{更新|こうしん}・{変更|へんこう}）。{次|つぎ}に、{心身|しんしん}の{状況|じょうきょう}を{調|しら}べる{調査|ちょうさ}（{基本調査|きほんちょうさ}74{項目|こうもく}と{特記事項|とっきじこう}）と、{主治医意見書|しゅじいいけんしょ|kh_ikensho}をもとに、コンピューターで{一次判定|いちじはんてい|kh_ichiji}を{行|おこな}います。そのあと、{介護認定審査会|かいごにんていしんさかい|kh_shinsakai}が{二次判定|にじはんてい}を{行|おこな}い、{最後|さいご}に{市町村|しちょうそん}が{認定|にんてい}して{結果|けっか}を{通知|つうち}します。',\n        id: 'Pertama, ajukan permohonan ke kota (baru, perpanjangan, atau perubahan). Lalu dilakukan survei kondisi fisik dan mental (survei dasar 74 butir dan catatan khusus). Dari hasil survei dan surat pendapat dokter utama, komputer melakukan penilaian tahap 1. Setelah itu dewan pemeriksa melakukan penilaian tahap 2, dan terakhir kota menetapkan sertifikasi serta memberi tahu hasilnya.' },\n      { h: '{申請|しんせい}の{代行|だいこう}', hid: 'Siapa yang bisa mengajukan atas nama pemohon',\n        jp: '{本人|ほんにん}や{家族|かぞく}のほか、{指定居宅介護支援事業者|していきょたくかいごしえんじぎょうしゃ}、{地域密着型介護老人福祉施設|ちいきみっちゃくがたかいごろうじんふくししせつ}、{介護保険施設|かいごほけんしせつ}、{地域包括支援|ちいきほうかつしえん}センターなどが{申請|しんせい}を{代行|だいこう}できます。',\n        id: 'Selain pemohon dan keluarganya, permohonan bisa diwakilkan oleh kantor care manager yang ditunjuk, panti lansia khusus berbasis komunitas, fasilitas asuransi kaigo, dan pusat dukungan komprehensif daerah.' },\n      { h: '{介護認定審査会|かいごにんていしんさかい}', hid: 'Dewan pemeriksa',\n        jp: '{委員|いいん}は{保健|ほけん}・{医療|いりょう}・{福祉|ふくし}の{学識経験者|がくしきけいけんしゃ}から{市町村長|しちょうそんちょう}が{任命|にんめい}します。{任期|にんき}は{原則|げんそく}2{年|ねん}です（{条例|じょうれい}で3{年|ねん}まで{延長|えんちょう}できます）。{要介護度|ようかいごど}の{審査判定|しんさはんてい}と、{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい|kh_tokutei}の{判定|はんてい}を{行|おこな}います。',\n        id: 'Anggota diangkat oleh wali kota dari ahli di bidang kesehatan, medis, dan kesejahteraan. Masa jabatan prinsipnya 2 tahun (bisa diperpanjang sampai 3 tahun dengan peraturan daerah). Dewan menilai tingkat perlu perawatan dan menilai apakah peserta nomor 2 (usia 40–64) menderita penyakit khusus.' },\n      { h: '{認定|にんてい}の{有効期間|ゆうこうきかん}', hid: 'Masa berlaku sertifikasi',\n        jp: '{新規申請|しんきしんせい}と{区分変更申請|くぶんへんこうしんせい}は{原則|げんそく}6か{月|げつ}（3〜12か{月|げつ}）です。{更新申請|こうしんしんせい}は{原則|げんそく}12か{月|げつ}（3〜36か{月|げつ}）です。{直前|ちょくぜん}と{同|おな}じ{要介護度|ようかいごど}と{判定|はんてい}されたときは、48か{月|げつ}まで{延長|えんちょう}できます。',\n        id: 'Permohonan baru dan perubahan tingkat: prinsipnya 6 bulan (bisa 3–12 bulan). Perpanjangan: prinsipnya 12 bulan (bisa 3–36 bulan). Jika hasilnya sama dengan tingkat sebelumnya, bisa diperpanjang sampai 48 bulan.' },\n      { h: '{保険給付|ほけんきゅうふ}の3{種類|しゅるい}', hid: '3 jenis manfaat asuransi',\n        jp: '{要介護者|ようかいごしゃ}が{使|つか}える「{介護給付|かいごきゅうふ}」、{要支援者|ようしえんしゃ}が{使|つか}える「{予防給付|よぼうきゅうふ|kh_yobo}」、{市町村|しちょうそん}が{条例|じょうれい}で{決|き}める「{市町村特別給付|しちょうそんとくべつきゅうふ}」の3つです。{介護保険|かいごほけん}からは7〜9{割|わり}が{給付|きゅうふ}されます（{自己負担|じこふたん}は1〜3{割|わり}）。ケアプランの{作成|さくせい}（{居宅介護支援|きょたくかいごしえん|kh_shien}・{介護予防支援|かいごよぼうしえん}）は10{割|わり}{給付|きゅうふ}で、{自己負担|じこふたん}はありません。',\n        id: 'Ada 3 jenis: manfaat perawatan untuk orang 要介護, manfaat pencegahan untuk orang 要支援, dan manfaat khusus kota yang ditetapkan lewat peraturan daerah. Asuransi menanggung 70–90% (biaya sendiri 10–30%). Pembuatan care plan ditanggung 100%, jadi pengguna tidak membayar.' },\n      { h: 'だれが{指定|してい}するか', hid: 'Siapa yang menunjuk penyedia layanan',\n        jp: '{居宅|きょたく}サービスと{施設|しせつ}サービスは{都道府県知事|とどうふけんちじ}が{指定|してい}します。{地域密着型|ちいきみっちゃくがた}サービス、{居宅介護支援|きょたくかいごしえん}、{介護予防支援|かいごよぼうしえん}は{市町村長|しちょうそんちょう}が{指定|してい}します。{指定事業者|していじぎょうしゃ}は6{年|ねん}ごとに{更新|こうしん}が{必要|ひつよう}です。',\n        id: 'Layanan di rumah dan layanan fasilitas ditunjuk oleh gubernur prefektur. Layanan berbasis komunitas, dukungan perawatan di rumah, dan dukungan pencegahan ditunjuk oleh wali kota. Penyedia yang ditunjuk harus memperbarui penunjukan setiap 6 tahun.' }\n    ],\n    compare: { a: '介護給付', b: '予防給付', rows: [\n      { label: 'Untuk siapa', a: '要介護1–5', b: '要支援1–2' },\n      { label: 'Fasilitas (特養・老健・介護医療院)', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Kunjungan malam, 定期巡回, 看護小規模多機能', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Care plan', a: '居宅介護支援', b: '介護予防支援' } ] },\n    points: [\n      'Urutan: 申請 → 調査 + 主治医意見書 → 一次判定 (komputer) → 二次判定 (審査会) → 市町村が認定. Yang menetapkan sertifikasi adalah 市町村, bukan dewan.',\n      'Angka yang sering keluar: 基本調査 74 butir, masa jabatan dewan 2 tahun, berlaku baru 6 bulan, perpanjangan 12 bulan (maks. 48), 16 特定疾病, pembaruan penunjukan 6 tahun.',\n      'Batas angka layanan: 地域密着型通所介護 maks. 18 orang, 小規模多機能・地域密着型特養・地域密着型特定施設 maks. 29 orang, 特養 prinsipnya 要介護3 ke atas, pembelian alat bantu 100.000 yen/tahun, renovasi rumah 200.000 yen.',\n      'Lisensi care manager (介護支援専門員) diperbarui setiap 5 tahun. Jangan tertukar dengan penunjukan penyedia layanan (6 tahun).'\n    ],\n    quiz: [\n      { jp: '{要介護認定|ようかいごにんてい}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang sertifikasi perlu perawatan.', answer: 3,\n        opts: [\n          { jp: '{申請先|しんせいさき}は{都道府県|とどうふけん}である。', id: 'Permohonan diajukan ke prefektur.', reason: 'Permohonan diajukan ke kota (市町村).' },\n          { jp: '{一次判定|いちじはんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Penilaian tahap 1 dilakukan dewan pemeriksa.', reason: 'Tahap 1 oleh komputer. Dewan melakukan tahap 2.' },\n          { jp: '{基本調査|きほんちょうさ}は100{項目|こうもく}である。', id: 'Survei dasar terdiri dari 100 butir.', reason: 'Survei dasar 74 butir.' },\n          { jp: '{二次判定|にじはんてい}では{主治医意見書|しゅじいいけんしょ}も{使|つか}われる。', id: 'Penilaian tahap 2 juga memakai surat pendapat dokter utama.', reason: 'Benar. Dewan memakai hasil tahap 1, catatan khusus, dan surat pendapat dokter.' },\n          { jp: '{最終的|さいしゅうてき}な{認定|にんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Sertifikasi akhir ditetapkan dewan pemeriksa.', reason: 'Dewan hanya menilai. Yang menetapkan adalah kota.' } ],\n        explain: 'Dewan pemeriksa melakukan penilaian tahap 2 dengan melihat hasil komputer, catatan khusus survei, dan surat pendapat dokter utama. Keputusan resmi tetap dibuat oleh kota.' },\n      { jp: '{要介護認定|ようかいごにんてい}の{有効期間|ゆうこうきかん}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang masa berlaku sertifikasi.', answer: 1,\n        opts: [\n          { jp: '{新規申請|しんきしんせい}の{原則|げんそく}は3か{月|げつ}である。', id: 'Permohonan baru prinsipnya 3 bulan.', reason: 'Prinsipnya 6 bulan.' },\n          { jp: '{更新申請|こうしんしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perpanjangan prinsipnya 12 bulan.', reason: 'Benar.' },\n          { jp: '{区分変更申請|くぶんへんこうしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perubahan tingkat prinsipnya 12 bulan.', reason: 'Sama dengan permohonan baru: 6 bulan.' },\n          { jp: '{更新|こうしん}では、どんな{場合|ばあい}も36か{月|げつ}が{上限|じょうげん}である。', id: 'Untuk perpanjangan, batasnya selalu 36 bulan.', reason: 'Jika tingkatnya sama dengan sebelumnya, bisa sampai 48 bulan.' },\n          { jp: '{有効期間|ゆうこうきかん}は{本人|ほんにん}が{自由|じゆう}に{選|えら}べる。', id: 'Masa berlaku bebas dipilih pemohon.', reason: 'Ditentukan dalam rentang aturan oleh dewan/kota.' } ],\n        explain: 'Baru dan perubahan tingkat: 6 bulan (3–12). Perpanjangan: 12 bulan (3–36, atau 48 jika tingkat sama).' },\n      { jp: '{要支援者|ようしえんしゃ}が{利用|りよう}できないサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang tidak bisa dipakai orang 要支援.', answer: 4,\n        opts: [\n          { jp: '{介護予防福祉用具貸与|かいごよぼうふくしようぐたいよ}', id: 'Peminjaman alat bantu pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防住宅改修|かいごよぼうじゅうたくかいしゅう}', id: 'Renovasi rumah pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防短期入所生活介護|かいごよぼうたんきにゅうしょせいかつかいご}', id: 'Singgah pendek pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防小規模多機能型居宅介護|かいごよぼうしょうきぼたきのうがたきょたくかいご}', id: 'Layanan multifungsi skala kecil pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{夜間対応型訪問介護|やかんたいおうがたほうもんかいご}', id: 'Kunjungan perawatan malam', reason: 'Benar. Hanya untuk 要介護.' } ],\n        explain: 'Tidak ada versi 予防給付 untuk: 定期巡回・随時対応型, 夜間対応型訪問介護, 看護小規模多機能, 地域密着型通所介護, 地域密着型特定施設, 地域密着型特養, dan 3 fasilitas (特養・老健・介護医療院).' },\n      { jp: '{市町村長|しちょうそんちょう}が{指定|してい}するサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang ditunjuk oleh wali kota.', answer: 2,\n        opts: [\n          { jp: '{訪問介護|ほうもんかいご}', id: 'Kunjungan perawatan', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{介護老人保健施設|かいごろうじんほけんしせつ}', id: 'Fasilitas kesehatan lansia (老健)', reason: 'Fasilitas: gubernur (izin).' },\n          { jp: '{認知症対応型共同生活介護|にんちしょうたいおうがたきょうどうせいかつかいご}', id: 'Group home demensia', reason: 'Benar. Layanan berbasis komunitas: wali kota.' },\n          { jp: '{通所|つうしょ}リハビリテーション', id: 'Rehabilitasi harian', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{特定施設入居者生活介護|とくていしせつにゅうきょしゃせいかつかいご}', id: 'Perawatan penghuni fasilitas tertentu', reason: 'Layanan di rumah: gubernur (versi 地域密着型 oleh wali kota).' } ],\n        explain: 'Wali kota menunjuk: layanan berbasis komunitas (group home demensia, 小規模多機能, dll.), 居宅介護支援, dan 介護予防支援. Sisanya oleh gubernur.' },\n      { jp: '{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい}に{含|ふく}まれるものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk penyakit khusus untuk peserta nomor 2.', answer: 0,\n        opts: [\n          { jp: '{初老期|しょろうき}における{認知症|にんちしょう}', id: 'Demensia usia pra-lansia', reason: 'Benar. Termasuk 16 penyakit khusus.' },\n          { jp: '{高血圧症|こうけつあつしょう}', id: 'Hipertensi', reason: 'Tidak termasuk.' },\n          { jp: '{統合失調症|とうごうしっちょうしょう}', id: 'Skizofrenia', reason: 'Tidak termasuk.' },\n          { jp: '{胃|い}がん（{末期|まっき}ではない）', id: 'Kanker lambung (bukan stadium akhir)', reason: 'Yang termasuk hanya kanker stadium akhir (がん末期).' },\n          { jp: '{骨折|こっせつ}を{伴|ともな}わない{骨粗鬆症|こつそしょうしょう}', id: 'Osteoporosis tanpa patah tulang', reason: 'Yang termasuk adalah osteoporosis disertai patah tulang.' } ],\n        explain: 'Contoh 16 特定疾病: がん末期, リウマチ, ALS, パーキンソン病関連, 初老期の認知症, 脳血管疾患, 骨折を伴う骨粗鬆症, COPD, 糖尿病の合併症, 変形性関節症 (kedua lutut/panggul), dll.' }\n    ]\n  },\n  'ninchi-1': {\n    title: '中核症状とBPSD', titleId: 'Gejala inti dan gejala perilaku-psikologis',\n    terms: ['chukaku', 'kioku', 'kentoshiki', 'jikko', 'bpsd', 'haikai', 'moso', 'yokuutsu'],\n    sections: [\n      { h: '{中核症状|ちゅうかくしょうじょう}', hid: 'Gejala inti',\n        jp: '{脳|のう}の{神経細胞|しんけいさいぼう}が{壊|こわ}れることで、{直接|ちょくせつ}{起|お}こる{症状|しょうじょう}です。{認知症|にんちしょう}の{人|ひと}には、だれにでも{現|あらわ}れます。{記憶障害|きおくしょうがい|kioku}、{見当識障害|けんとうしきしょうがい|kentoshiki}、{実行機能障害|じっこうきのうしょうがい|jikko}などがあります。',\n        id: 'Gejala yang muncul langsung karena sel saraf otak rusak. Gejala ini muncul pada semua penderita demensia. Contohnya gangguan memori, gangguan orientasi, dan gangguan fungsi eksekutif.' },\n      { h: '{行動|こうどう}・{心理症状|しんりしょうじょう}（BPSD）', hid: 'Gejala perilaku & psikologis',\n        jp: '{中核症状|ちゅうかくしょうじょう|chukaku}に、{本人|ほんにん}の{性格|せいかく}や{環境|かんきょう}、{体調|たいちょう}などが{影響|えいきょう}して{起|お}こる{症状|しょうじょう}です。{徘徊|はいかい|haikai}、{妄想|もうそう|moso}、{暴言|ぼうげん}・{暴力|ぼうりょく}、{抑うつ|よくうつ|yokuutsu}などがあります。{全|すべ}ての{人|ひと}に{現|あらわ}れるわけではありません。',\n        id: 'Gejala yang muncul karena gejala inti dipengaruhi kepribadian, lingkungan, dan kondisi fisik orang tersebut. Contohnya berkeliaran tanpa tujuan, delusi, kata-kata kasar dan kekerasan, serta depresi. Tidak semua penderita mengalaminya.' }\n    ],\n    compare: { a: '中核症状', b: 'BPSD', rows: [\n      { label: 'Siapa', a: 'Semua penderita', b: 'Tidak semua' },\n      { label: 'Penyebab', a: 'Kerusakan sel otak', b: 'Gejala inti + lingkungan, kepribadian' },\n      { label: 'Dengan perawatan', a: 'Sulit membaik', b: 'Bisa berkurang' } ] },\n    points: [\n      'Soal sering meminta memilih mana yang termasuk 中核症状. Ingat kata kuncinya: 記憶・見当識・判断・実行機能.',\n      '徘徊・妄想・暴言 adalah BPSD, bukan gejala inti. Ini pengecoh yang paling sering muncul.'\n    ],\n    quiz: [\n      { jp: '{認知症|にんちしょう}の{中核症状|ちゅうかくしょうじょう}として、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk gejala inti demensia.', answer: 2,\n        opts: [\n          { jp: '{徘徊|はいかい}', i
