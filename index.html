p\":\"{近隣集団|きんりんしゅうだん}\",\"id\":\"Kelompok tetangga\",\"reason\":\"コミュニティ.\"},{\"jp\":\"{国民社会|こくみんしゃかい}\",\"id\":\"Masyarakat nasional\",\"reason\":\"ゲゼルシャフト (Tönnies).\"}],\"explain\":\"MacIver: アソシエーション = keluarga, gereja (tujuan tertentu). コミュニティ = tetangga, desa, kota.\"},{\"jp\":\"{介護保険事業計画|かいごほけんじぎょうけいかく}の{期間|きかん}として、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 periode 介護保険事業計画 yang benar.\",\"answer\":0,\"opts\":[{\"jp\":\"3{年|ねん}を1{期|き}\",\"id\":\"3 tahun per periode\",\"reason\":\"Benar.\"},{\"jp\":\"5{年|ねん}を1{期|き}\",\"id\":\"5 tahun\",\"reason\":\"Rencana anak.\"},{\"jp\":\"6{年|ねん}を1{期|き}\",\"id\":\"6 tahun\",\"reason\":\"Rencana medis.\"},{\"jp\":\"10{年|ねん}を1{期|き}\",\"id\":\"10 tahun\",\"reason\":\"Salah.\"},{\"jp\":\"{期間|きかん}の{定|さだ}めはない\",\"id\":\"Tanpa periode\",\"reason\":\"Salah.\"}],\"explain\":\"3 tahun: kaigo, 障害福祉, 障害児福祉 · 5 tahun: anak · 6 tahun: medis.\"},{\"jp\":\"{民生委員|みんせいいいん}について、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan benar tentang 民生委員.\",\"answer\":3,\"opts\":[{\"jp\":\"{市町村長|しちょうそんちょう}が{委嘱|いしょく}する\",\"id\":\"Diangkat wali kota\",\"reason\":\"Diangkat Menteri Kesehatan.\"},{\"jp\":\"{給与|きゅうよ}が{支給|しきゅう}される\",\"id\":\"Menerima gaji\",\"reason\":\"Tanpa gaji.\"},{\"jp\":\"{任期|にんき}は2{年|ねん}\",\"id\":\"Masa jabatan 2 tahun\",\"reason\":\"3 tahun.\"},{\"jp\":\"{児童委員|じどういいん}を{兼|か}ねる\",\"id\":\"Merangkap 児童委員\",\"reason\":\"Benar.\"},{\"jp\":\"{常勤|じょうきん}の{国家公務員|こっかこうむいん}\",\"id\":\"Pegawai negeri tetap\",\"reason\":\"Pegawai daerah paruh waktu.\"}],\"explain\":\"民生委員: rekomendasi gubernur → Menteri mengangkat, tanpa gaji, 3 tahun, merangkap 児童委員.\"},{\"jp\":\"{児童相談所|じどうそうだんじょ}が2か{月|げつ}を{超|こ}えて{一時保護|いちじほご}を{行|おこな}う{場合|ばあい}に{必要|ひつよう}なものを1つ{選|えら}びなさい。\",\"id\":\"Apa yang diperlukan jika 児童相談所 melakukan perlindungan sementara lebih dari 2 bulan? Pilih 1.\",\"answer\":4,\"opts\":[{\"jp\":\"{保護者|ほごしゃ}の{同意|どうい}\",\"id\":\"Persetujuan wali\",\"reason\":\"Bukan syarat ini.\"},{\"jp\":\"{市町村長|しちょうそんちょう}の{許可|きょか}\",\"id\":\"Izin wali kota\",\"reason\":\"Bukan.\"},{\"jp\":\"{警察署長|けいさつしょちょう}の{許可|きょか}\",\"id\":\"Izin kepala polisi\",\"reason\":\"Bukan.\"},{\"jp\":\"{厚生労働大臣|こうせいろうどうだいじん}の{承認|しょうにん}\",\"id\":\"Persetujuan Menteri\",\"reason\":\"Bukan.\"},{\"jp\":\"{家庭裁判所|かていさいばんしょ}の{承認|しょうにん}\",\"id\":\"Persetujuan pengadilan keluarga\",\"reason\":\"Benar.\"}],\"explain\":\"一時保護 lebih dari 2 bulan → persetujuan 家庭裁判所.\"}] },\n  'shakai-8': { title: '医療保険', titleId: 'Asuransi medis (Pertemuan 8)', terms: [\"s8_kaihoken\",\"s8_hiyosha\",\"s8_kyokai\",\"s8_kumiai\",\"s8_hiyatoi\",\"s8_senin\",\"s8_kyosai\",\"s8_kokuho\",\"s8_kokuhokumiai\",\"s8_koki\",\"s8_koiki\",\"s8_iryofujo\",\"s8_hifuyo\",\"s8_chokkei\",\"s8_sanshinto\",\"s8_ryoyo\",\"s8_shokuji\",\"s8_seikatsu\",\"s8_heiyo\",\"s8_homonkango\",\"s8_ryoyohi\",\"s8_shokan\",\"s8_tokubetsu\",\"s8_shussan\",\"s8_shobyo\",\"s8_shussanteate\",\"s8_iso\",\"s8_maiso\",\"s8_kogaku\",\"s8_gassan\",\"s8_kokuiryohi\",\"s8_iryoho\",\"s8_byoin\",\"s8_shinryojo\",\"s8_byosho\",\"s8_tokutei\",\"s8_chiiki\",\"s8_zaitaku\",\"s8_iryoken\",\"s8_yakkyoku\",\"s8_nanbyo\",\"s8_shitei\",\"s8_tokuteiiryohi\",\"s8_joken\",\"s8_nanbyocenter\",\"s8_parkinson\",\"s8_kaiyo\",\"s8_als\",\"s8_futan\",\"s8_genekinami\",\"s8_hyojun\",\"s8_shikakusho\",\"s8_tainou\",\"s8_ryoyobyosho\",\"s8_kogakugassan\",\"s8_hokenyusen\",\"s8_iryoteikyo\",\"s8_ichiji\",\"s8_niji\",\"s8_sanji\",\"s8_kaiin\"], sections: [{\"h\":\"★{頻出|ひんしゅつ} {国民皆保険|こくみんかいほけん}\",\"hid\":\"Asuransi untuk semua warga\",\"jp\":\"{医療保険制度|いりょうほけんせいど}は、1961（{昭和|しょうわ}36）{年|ねん}から{国民皆保険|こくみんかいほけん}{制度|せいど}が{整備|せいび}され、{日本|にほん}に{住所|じゅうしょ}がある{人|ひと}は、みんな{何|なん}らかの{医療|いりょう}の{給付|きゅうふ}を{受|う}けることができます。{加入者|かにゅうしゃ}の{合計|ごうけい}は{約|やく}1{億|おく}2400{万人|まんにん}で、{日本|にほん}の{人口|じんこう}と{一致|いっち}します。\",\"id\":\"Sejak 1961 (Showa 36) berlaku asuransi kesehatan untuk semua warga (国民皆保険). Setiap orang yang punya alamat di Jepang pasti ikut salah satu asuransi medis. Total peserta ±124 juta orang = sama dengan jumlah penduduk Jepang.\\n\\nIngat: tahun 1961 adalah tahun 国民皆保険 dan juga 国民皆年金.\"},{\"h\":\"{医療保険|いりょうほけん}の{全体図|ぜんたいず}（{年齢|ねんれい}で{分|わ}ける）\",\"hid\":\"Peta lengkap asuransi medis (dibagi usia)\",\"jp\":\"75{歳|さい}{未満|みまん}：{被用者保険|ひようしゃほけん}（{健康保険|けんこうほけん}・{船員保険|せんいんほけん}・{共済組合|きょうさいくみあい}）と{国民健康保険|こくみんけんこうほけん}（{市町村国保|しちょうそんこくほ}・{国保組合|こくほくみあい}）。75{歳|さい}{以上|いじょう}：{後期高齢者医療制度|こうきこうれいしゃいりょうせいど}。{参考|さんこう}：{生活保護|せいかつほご}の{人|ひと}は{医療扶助|いりょうふじょ}。\",\"id\":\"Pembagian utama berdasarkan USIA:\\n・Di bawah 75 tahun → (A) 被用者保険 (asuransi karyawan): 健康保険, 船員保険, 共済組合; atau (B) 国民健康保険: 市町村国保, 国保組合.\\n・75 tahun ke atas → 後期高齢者医療制度.\\n・Catatan: penerima 生活保護 memakai 医療扶助.\\n\\nJumlah peserta (Maret 2023): 協会けんぽ ±39,44 juta · 組合健保 ±28,2 juta · 日雇特例 ±16 ribu · 船員保険 ±110 ribu · 共済組合 ±9,83 juta · 市町村国保 ±24,13 juta · 国保組合 ±2,64 juta · 後期高齢者 ±19,14 juta · 医療扶助 ±1,71 juta.\"},{\"h\":\"★{頻出|ひんしゅつ} {健康保険|けんこうほけん}（{協会|きょうかい}けんぽ・{組合健保|くみあいけんぽ}・{日雇特例|ひやといとくれい}）\",\"hid\":\"健康保険: Kyōkai Kenpo, Kumiai Kenpo, pekerja harian\",\"jp\":\"{協会|きょうかい}けんぽ（{全国健康保険協会|ぜんこくけんこうほけんきょうかい}）：{中小企業等|ちゅうしょうきぎょうとう}のサラリーマンとその{家族|かぞく}が{加入|かにゅう}。{都道府県|とどうふけん}ごとに{保険料|ほけんりょう}が{異|こと}なる。{組合健保|くみあいけんぽ}：{大企業等|だいきぎょうとう}の{健康保険組合|けんこうほけんくみあい}が{保険者|ほけんしゃ}。{健康保険組合|けんこうほけんくみあい}ごとに{保険料|ほけんりょう}が{異|こと}なる。{日雇特例被保険者|ひやといとくれいひほけんしゃ}：{日々雇|ひびやと}い{入|い}れられる{人|ひと}や2か{月|げつ}{以内|いない}の{期間|きかん}を{定|さだ}めて{使用|しよう}される{人|ひと}。\",\"id\":\"・協会けんぽ: karyawan perusahaan KECIL-MENENGAH + keluarga. Iuran berbeda per PREFEKTUR.\\n・組合健保: perusahaan BESAR; penyelenggaranya 健康保険組合. Iuran berbeda per SERIKAT.\\n・日雇特例被保険者: pekerja harian atau kontrak ≤2 bulan.\\n\\nJebakan ujian: \\\"per prefektur\\\" = 協会けんぽ, \\\"per serikat\\\" = 組合健保.\"},{\"h\":\"{船員保険|せんいんほけん}・{共済組合|きょうさいくみあい}\",\"hid\":\"Asuransi pelaut & koperasi pegawai\",\"jp\":\"{船員保険|せんいんほけん}：{船舶所有者|せんぱくしょゆうしゃ}に{使用|しよう}される{者|もの}とその{家族|かぞく}が{対象|たいしょう}。{共済組合|きょうさいくみあい}：{国家公務員|こっかこうむいん}（20{共済組合|きょうさいくみあい}）、{地方公務員等|ちほうこうむいんとう}（64{共済組合|きょうさいくみあい}）、{私学教職員|しがくきょうしょくいん}（1{事業団|じぎょうだん}）。\",\"id\":\"・船員保険: orang yang dipekerjakan pemilik kapal + keluarganya.\\n・共済組合: pegawai negeri pusat (20 koperasi), pegawai daerah (64 koperasi), guru/staf sekolah swasta (1 badan).\"},{\"h\":\"{国民健康保険|こくみんけんこうほけん}\",\"hid\":\"Asuransi kesehatan nasional\",\"jp\":\"{市町村国民健康保険|しちょうそんこくみんけんこうほけん}：{都道府県|とどうふけん}および{市町村|しちょうそん}が{保険者|ほけんしゃ}。{被用者保険等|ひようしゃほけんとう}に{加入|かにゅう}していない{人|ひと}が{住所|じゅうしょ}を{有|ゆう}する{都道府県|とどうふけん}で{加入|かにゅう}する。{国民健康保険組合|こくみんけんこうほけんくみあい}：{医師|いし}、{弁護士|べんごし}など{同種|どうしゅ}の{事業|じぎょう}または{業務|ぎょうむ}に{従事|じゅうじ}する{人|ひと}で{組織|そしき}される。\",\"id\":\"・市町村国保: penyelenggara PREFEKTUR + KOTA (keduanya). Untuk orang yang tidak ikut asuransi karyawan (wiraswasta, petani, tidak bekerja, dll.); ikut di prefektur tempat tinggal.\\n・国保組合: dibentuk orang dengan pekerjaan sejenis, misalnya dokter dan pengacara.\"},{\"h\":\"★{頻出|ひんしゅつ} {後期高齢者医療制度|こうきこうれいしゃいりょうせいど}\",\"hid\":\"Sistem medis lansia tahap akhir\",\"jp\":\"{都道府県|とどうふけん}{単位|たんい}の{後期高齢者医療広域連合|こうきこうれいしゃいりょうこういきれんごう}が{運営主体|うんえいしゅたい}。75{歳|さい}{以上|いじょう}の{人|ひと}、65{歳|さい}{以上|いじょう}75{歳|さい}{未満|みまん}の{一定|いってい}の{障害認定|しょうがいにんてい}を{受|う}けた{人|ひと}が{加入|かにゅう}。\",\"id\":\"・Pelaksana: 後期高齢者医療広域連合 (gabungan wilayah per PREFEKTUR) — bukan kota, bukan negara.\\n・Peserta: usia 75+, ATAU usia 65–74 yang mendapat sertifikasi disabilitas tertentu.\\n・Tidak ada sistem tanggungan (被扶養者) — setiap orang menjadi peserta sendiri.\"},{\"h\":\"{生活保護|せいかつほご}と{医療|いりょう}（{医療扶助|いりょうふじょ}）\",\"hid\":\"Bantuan hidup & pengobatan\",\"jp\":\"{生活保護受給者|せいかつほごじゅきゅうしゃ}は、{国民健康保険|こくみんけんこうほけん}と{後期高齢者医療制度|こうきこうれいしゃいりょうせいど}への{加入|かにゅう}が{免除|めんじょ}される（{医療扶助|いりょうふじょ}で{医療|いりょう}を{受|う}けることができる）。\",\"id\":\"Penerima 生活保護 DIBEBASKAN dari 国保 dan 後期高齢者医療. Mereka berobat lewat 医療扶助 (salah satu jenis bantuan dalam 生活保護). Jumlah ±1,71 juta (rata-rata per bulan 2023).\"},{\"h\":\"★{頻出|ひんしゅつ} {被扶養者|ひふようしゃ}になれる{人|ひと}\",\"hid\":\"Siapa yang bisa jadi tanggungan\",\"jp\":\"{被用者保険|ひようしゃほけん}は、{被扶養者|ひふようしゃ}についても{保険給付|ほけんきゅうふ}の{対象|たいしょう}とする（{一定|いってい}の{要件|ようけん}あり）。{主|しゅ}として{被保険者|ひほけんしゃ}の{収入|しゅうにゅう}により{生計|せいけい}を{維持|いじ}されている、{原則|げんそく}{日本国内|にほんこくない}に{住所|じゅうしょ}がある{人|ひと}。{別居|べっきょ}でもよい：{直系尊属|ちょっけいそんぞく}、{配偶者|はいぐうしゃ}、{子|こ}、{孫|まご}、{兄弟姉妹|きょうだいしまい}。{同居|どうきょ}のみ：3{親等|しんとう}{以内|いない}の{親族|しんぞく}、{事実婚|じじつこん}の{配偶者|はいぐうしゃ}の{父母|ふぼ}および{子|こ}。\",\"id\":\"Tanggungan hanya ada di 被用者保険 (bukan di 国保 atau 後期高齢者).\\nSyarat: hidupnya terutama dari penghasilan peserta, dan prinsipnya tinggal di Jepang.\\n・Boleh TINGGAL TERPISAH: orang tua/kakek-nenek (直系尊属), pasangan, anak, cucu, saudara kandung.\\n・HARUS TINGGAL BERSAMA: kerabat lain sampai derajat 3 (paman, bibi, keponakan, mertua, dll.), serta orang tua dan anak dari pasangan de facto.\"},{\"h\":\"★{頻出|ひんしゅつ} ①{療養|りょうよう}の{給付|きゅうふ}（{自己負担割合|じこふたんわりあい}）\",\"hid\":\"(1) Manfaat pengobatan: persentase biaya sendiri\",\"jp\":\"{病院|びょういん}や{診療所|しんりょうじょ}で{医療|いりょう}を{受|う}けた{場合|ばあい}の{自己負担額|じこふたんがく}。75{歳|さい}{以上|いじょう}：1{割|わり}（{一定以上所得者|いっていいじょうしょとくしゃ}2{割|わり}、{現役並|げんえきな}み{所得者|しょとくしゃ}3{割|わり}）。70{歳|さい}{以上|いじょう}75{歳|さい}{未満|みまん}：2{割|わり}（{現役並|げんえきな}み{所得者|しょとくしゃ}3{割|わり}）。{義務教育就学|ぎむきょういくしゅうがく}〜70{歳|さい}{未満|みまん}：3{割|わり}。〜{義務教育就学前|ぎむきょういくしゅうがくまえ}：2{割|わり}。\",\"id\":\"Biaya yang dibayar sendiri saat berobat:\\n・75 tahun ke atas (termasuk 65–74 dengan sertifikasi disabilitas): 10% — berpenghasilan tertentu 20%, setara pekerja aktif 30%\\n・70–74 tahun: 20% — setara pekerja aktif 30%\\n・Usia sekolah wajib sampai 69 tahun: 30%\\n・Sebelum usia sekolah wajib: 20%\\nBerlaku untuk ketiga jenis (被用者・国保・高齢者).\"},{\"h\":\"②〜⑦ {入院|にゅういん}・{特別|とくべつ}な{療養|りょうよう}の{給付|きゅうふ}\",\"hid\":\"(2)–(7) Manfaat rawat inap & khusus\",\"jp\":\"②{入院時食事療養費|にゅういんじしょくじりょうようひ}：{入院時|にゅういんじ}の{食事療養費|しょくじりょうようひ}（{標準負担額|ひょうじゅんふたんがく}を{除|のぞ}く）。③{入院時生活療養費|にゅういんじせいかつりょうようひ}：{療養病床|りょうようびょうしょう}に{長期入院|ちょうきにゅういん}する65{歳|さい}{以上|いじょう}の{生活療養費|せいかつりょうようひ}（{食費|しょくひ}と{居住費|きょじゅうひ}）。④{保険外併用療養費|ほけんがいへいようりょうようひ}：{評価療養|ひょうかりょうよう}、{患者申出療養|かんじゃもうしでりょうよう}、{選定療養|せんていりょうよう}。⑤{訪問看護療養費|ほうもんかんごりょうようひ}：かかりつけ{医|い}の{指示|しじ}で{訪問看護|ほうもんかんご}ステーションの{看護師|かんごし}から{療養上|りょうようじょう}の{世話|せわ}や{診療|しんりょう}の{補助|ほじょ}。⑥{療養費|りょうようひ}：{被保険者証|ひほけんしゃしょう}を{提示|ていじ}できない、{保険医療機関以外|ほけんいりょうきかんいがい}で{受診|じゅしん}→{償還払|しょうかんばら}い。⑦{特別療養費|とくべつりょうようひ}：{保険料|ほけんりょう}の{滞納|たいのう}で{被保険者資格証明書|ひほけんしゃしかくしょうめいしょ}→{償還払|しょうかんばら}い。\",\"id\":\"② Biaya makan rawat inap (dikurangi beban standar).\\n③ Biaya hidup rawat inap: untuk 65+ yang RAWAT INAP LAMA di 療養病床 (biaya makan + tempat tinggal).\\n④ Perawatan gabungan dengan layanan di luar asuransi: 評価療養, 患者申出療養 (atas permintaan pasien), 選定療養.\\n⑤ Biaya kunjungan keperawatan: perawat dari 訪問看護ステーション membantu di rumah atas instruksi dokter.\\n⑥ 療養費: saat tidak bisa menunjukkan kartu asuransi, atau terpaksa berobat di luar lembaga asuransi → 償還払い.\\n⑦ 特別療養費: peserta yang MENUNGGAK iuran dan menerima 被保険者資格証明書 → 償還払い. Hanya 国保 dan 後期高齢者 (TIDAK ada di asuransi karyawan).\\n\\n償還払い = bayar penuh dulu (talangan), lalu klaim bagian asuransi kemudian.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑧〜⑬ {現金給付|げんきんきゅうふ}\",\"hid\":\"(8)–(13) Manfaat uang tunai\",\"jp\":\"⑧{出産育児一時金|しゅっさんいくじいちじきん}：1{児|じ}につき50{万円|まんえん}（{被用者|ひようしゃ}・{国保|こくほ}）。⑨{家族療養費等|かぞくりょうようひとう}：{被扶養者|ひふようしゃ}への{給付|きゅうふ}（{被用者|ひようしゃ}のみ）。⑩{傷病手当金|しょうびょうてあてきん}：{標準報酬日額|ひょうじゅんほうしゅうにちがく}の3{分|ぶん}の2を{休業|きゅうぎょう}4{日目|にちめ}から{通算|つうさん}1{年|ねん}6か{月|げつ}（{被用者|ひようしゃ}のみ）。⑪{出産手当金|しゅっさんてあてきん}：{出産日|しゅっさんび}{以前|いぜん}42{日|にち}＋{出産後|しゅっさんご}56{日|にち}、3{分|ぶん}の2（{被用者|ひようしゃ}のみ）。⑫{移送費|いそうひ}：{償還払|しょうかんばら}い。⑬{埋葬料|まいそうりょう}5{万円|まんえん}（{健康保険|けんこうほけん}）、{葬祭費|そうさいひ}（{国保|こくほ}、{自治体|じちたい}により{異|こと}なる）。\",\"id\":\"⑧ 出産育児一時金: 500.000 yen per bayi (melahirkan di fasilitas yang ikut sistem kompensasi kebidanan). Ada di asuransi karyawan dan 国保.\\n⑨ 家族療養費: manfaat yang sama untuk tanggungan (kecuali 傷病手当金 dan 出産手当金). Hanya asuransi karyawan.\\n⑩ 傷病手当金: tidak bisa bekerja karena sakit dan tidak digaji → 2/3 gaji harian standar, mulai HARI KE-4, total maksimal 1 TAHUN 6 BULAN. Hanya asuransi karyawan.\\n⑪ 出産手当金: cuti melahirkan tanpa gaji → 42 hari sebelum + 56 hari setelah melahirkan, 2/3 gaji harian. Hanya asuransi karyawan.\\n⑫ 移送費: biaya dipindahkan untuk berobat → 償還払い.\\n⑬ 埋葬料 50.000 yen (健康保険) / 葬祭費 (国保, beda per daerah).\\n\\nKunci: ⑨⑩⑪ HANYA 被用者保険. ⑦ TIDAK ada di 被用者. ⑧ tidak ada di 後期高齢者.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑭{高額療養費|こうがくりょうようひ}\",\"hid\":\"(14) Biaya pengobatan mahal\",\"jp\":\"1か{月|げつ}あたりの{医療費|いりょうひ}が{上限額|じょうげんがく}を{超|こ}える{場合|ばあい}に、その{超|こ}えた{額|がく}を{支給|しきゅう}。{上限|じょうげん}は{所得区分|しょとくくぶん}と{年齢|ねんれい}で{異|こと}なる。{例|れい}：{標準報酬月額|ひょうじゅんほうしゅうげつがく}83{万円以上|まんえんいじょう}＝252,600{円|えん}＋（{総医療費|そういりょうひ}−842,000{円|えん}）×1%。26{万円以下|まんえんいか}＝57,600{円|えん}（70{歳以上|さいいじょう}の{外来|がいらい}18,000{円|えん}、{年|ねん}144,000{円上限|えんじょうげん}）。{低所得者|ていしょとくしゃ}＝70{歳未満|さいみまん}35,400{円|えん}、70{歳以上|さいいじょう}15,000{円|えん}または24,600{円|えん}、{外来|がいらい}8,000{円|えん}。\",\"id\":\"Jika biaya medis dalam 1 BULAN melebihi batas atas, kelebihannya dikembalikan. Batas tergantung penghasilan dan usia (untuk 70+ berlaku sejak Agustus 2018):\\n・Gaji bulanan standar ≥830 ribu: 252.600 + (total biaya − 842.000) × 1%\\n・≥530 ribu: 167.400 + (total − 558.000) × 1%\\n・≥280 ribu: 80.100 + (total − 267.000) × 1%\\n・≤260 ribu: 57.600 yen (70+ rawat jalan per orang 18.000 yen, maks. 144.000/tahun)\\n・Berpenghasilan rendah (bebas pajak penduduk): di bawah 70 = 35.400; 70+ rumah tangga = 15.000 atau 24.600; 70+ rawat jalan = 8.000 yen.\\n\\nYang perlu diingat: satuan PER BULAN, dan batas lebih rendah untuk penghasilan rendah dan lansia.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑮{高額介護合算療養費|こうがくかいごがっさんりょうようひ}\",\"hid\":\"(15) Gabungan medis & kaigo mahal\",\"jp\":\"{各医療保険|かくいりょうほけん}における{世帯内|せたいない}で、{医療保険|いりょうほけん}・{介護保険|かいごほけん}の{両制度|りょうせいど}の{自己負担額|じこふたんがく}の{合計額|ごうけいがく}が1{年間|ねんかん}に{一定|いってい}の{上限額|じょうげんがく}を{超|こ}えた{場合|ばあい}に{支給|しきゅう}（{介護保険|かいごほけん}からは{高額医療合算介護|こうがくいりょうがっさんかいご}サービス{費|ひ}が{支給|しきゅう}される）。\",\"id\":\"Jika TOTAL biaya sendiri medis + kaigo dalam satu RUMAH TANGGA selama 1 TAHUN melebihi batas → dikembalikan. Dari sisi asuransi medis namanya 高額介護合算療養費; dari sisi asuransi kaigo namanya 高額医療合算介護サービス費.\\n\\nBedakan: 高額療養費 = per BULAN, medis saja. 高額介護合算療養費 = per TAHUN, medis + kaigo.\"},{\"h\":\"{給付|きゅうふ}の{対象|たいしょう}まとめ（{被用者|ひようしゃ}・{国保|こくほ}・{高齢|こうれい}）\",\"hid\":\"Ringkasan: manfaat mana ada di asuransi mana\",\"jp\":\"{保険者|ほけんしゃ}の{種類|しゅるい}によって{給付内容|きゅうふないよう}が{異|こと}なる。\",\"id\":\"Tabel ringkas (○ = ada):\\n・①〜⑥, ⑫, ⑬, ⑭, ⑮: ada di ketiganya (被用者・国保・後期高齢者)\\n・⑦ 特別療養費: 国保 dan 後期高齢者 saja\\n・⑧ 出産育児一時金: 被用者 dan 国保 saja\\n・⑨ 家族療養費, ⑩ 傷病手当金, ⑪ 出産手当金: 被用者 saja\\n\\nJadi pekerja wiraswasta (国保) tidak mendapat 傷病手当金.\"},{\"h\":\"★{頻出|ひんしゅつ} {国民医療費|こくみんいりょうひ}\",\"hid\":\"Biaya medis nasional\",\"jp\":\"{国民医療費|こくみんいりょうひ}は、{医療機関等|いりょうきかんとう}における{保険診療|ほけんしんりょう}の{対象|たいしょう}となる{傷病|しょうびょう}の{治療|ちりょう}（{正常|せいじょう}な{妊娠|にんしん}・{分娩|ぶんべん}や{健康|けんこう}の{維持|いじ}・{増進|ぞうしん}を{目的|もくてき}とした{健康診断|けんこうしんだん}・{予防接種|よぼうせっしゅ}などは{除|のぞ}く）に{要|よう}した{費用|ひよう}を{推計|すいけい}したもの。2022（{令和|れいわ}4）{年度|ねんど}は{約|やく}47{兆円|ちょうえん}、{一人当|ひとりあ}たりは{約|やく}37{万円|まんえん}。\",\"id\":\"Perkiraan biaya pengobatan penyakit/cedera yang ditanggung asuransi.\\nTIDAK termasuk: kehamilan dan persalinan normal, pemeriksaan kesehatan, vaksinasi.\\nTahun 2022 (Reiwa 4): ±47 triliun yen; per orang ±370 ribu yen. Grafik sejak 1955 (Showa 30) terus NAIK (増加傾向).\\n\\nBedakan dengan 社会保障給付費 (±134–138 triliun yen, mencakup pensiun, medis, kesejahteraan).\"},{\"h\":\"{医療圏|いりょうけん}\",\"hid\":\"Wilayah pelayanan medis\",\"jp\":\"{一次医療圏|いちじいりょうけん}（{市町村|しちょうそん}）：{病院|びょういん}・{診療所|しんりょうじょ}。{二次医療圏|にじいりょうけん}（{複数|ふくすう}の{市町村|しちょうそん}）：{地域医療支援病院|ちいきいりょうしえんびょういん}が{病院|びょういん}・{診療所|しんりょうじょ}の{後方支援|こうほうしえん}。{三次医療圏|さんじいりょうけん}（{都道府県|とどうふけん}）：{特定機能病院|とくていきのうびょういん}が{高度|こうど}な{医療|いりょう}を{提供|ていきょう}。\",\"id\":\"・一次医療圏 = KOTA: rumah sakit dan klinik sehari-hari.\\n・二次医療圏 = BEBERAPA KOTA: 地域医療支援病院 mendukung RS dan klinik.\\n・三次医療圏 = PREFEKTUR: 特定機能病院 memberikan pengobatan tingkat tinggi.\"},{\"h\":\"★{頻出|ひんしゅつ} {医療提供施設|いりょうていきょうしせつ}（{医療法|いりょうほう}・{介護保険法|かいごほけんほう}）\",\"hid\":\"Fasilitas penyedia layanan medis\",\"jp\":\"{病院|びょういん}：{医師|いし}または{歯科医師|しかいし}が{医業|いぎょう}を{行|おこな}う{場所|ばしょ}で、20{人以上|にんいじょう}の{入院施設|にゅういんしせつ}。{病床|びょうしょう}の{種類|しゅるい}：①{精神病床|せいしんびょうしょう}②{感染症病床|かんせんしょうびょうしょう}③{結核病床|けっかくびょうしょう}④{療養病床|りょうようびょうしょう}⑤{一般病床|いっぱんびょうしょう}。{特定機能病院|とくていきのうびょういん}：{高度先端医療|こうどせんたんいりょう}、{厚生労働大臣|こうせいろうどうだいじん}の{承認|しょうにん}（{大学病院|だいがくびょういん}{本院|ほんいん}、{国立|こくりつ}がんセンター、{国立循環器病研究|こくりつじゅんかんきびょうけんきゅう}センターなど）。{地域医療支援病院|ちいきいりょうしえんびょういん}：{都道府県知事|とどうふけんちじ}の{承認|しょうにん}。{診療所|しんりょうじょ}：{入院施設|にゅういんしせつ}なし、または19{人以下|にんいか}。{在宅療養支援診療所|ざいたくりょうようしえんしんりょうじょ}：24{時間往診|じかんおうしん}・24{時間訪問看護|じかんほうもんかんご}が{可能|かのう}。{介護老人保健施設|かいごろうじんほけんしせつ}・{介護医療院|かいごいりょういん}（2018{年度|ねんど}〜）：{介護保険法|かいごほけんほう}。{薬局|やっきょく}：{薬剤師|やくざいし}が{調剤|ちょうざい}を{行|おこな}う{場所|ばしょ}。\",\"id\":\"・病院 (rumah sakit): 20 tempat tidur atau LEBIH.\\n・5 jenis tempat tidur: jiwa, penyakit menular, TBC, perawatan jangka panjang (療養), umum.\\n・特定機能病院: pengobatan canggih; disetujui MENTERI Kesehatan (contoh: RS universitas utama, Pusat Kanker Nasional, Pusat Penyakit Kardiovaskular Nasional).\\n・地域医療支援病院: mendukung RS/klinik daerah; disetujui GUBERNUR.\\n・診療所 (klinik): tanpa rawat inap, atau 19 tempat tidur ke BAWAH.\\n・在宅療養支援診療所: klinik yang bisa kunjungan dokter 24 jam dan menjamin kunjungan keperawatan 24 jam.\\n・介護老人保健施設 dan 介護医療院 (sejak 2018): fasilitas menurut UU ASURANSI KAIGO, bukan UU Medis.\\n・薬局: tempat apoteker meracik obat.\"},{\"h\":\"★{頻出|ひんしゅつ} {難病|なんびょう}と{指定難病|していなんびょう}\",\"hid\":\"Penyakit langka & 指定難病\",\"jp\":\"2015（{平成|へいせい}27）{年|ねん}1{月|がつ}1{日|にち}、「{難病|なんびょう}の{患者|かんじゃ}に{対|たい}する{医療等|いりょうとう}に{関|かん}する{法律|ほうりつ}」が{施行|しこう}。{難病|なんびょう}とは、{発病|はつびょう}の{機構|きこう}が{明|あき}らかでなく、{治療方法|ちりょうほうほう}が{確立|かくりつ}していない{希少|きしょう}な{疾病|しっぺい}であり、{長期|ちょうき}にわたり{療養|りょうよう}を{必要|ひつよう}とするもの。{指定難病|していなんびょう}：①{患者数|かんじゃすう}が{一定|いってい}の{人数|にんずう}に{達|たっ}していない（{人口|じんこう}の0.1%{程度未満|ていどみまん}）②{客観的|きゃっかんてき}な{診断基準|しんだんきじゅん}が{確立|かくりつ}。2025（{令和|れいわ}7）{年|ねん}4{月|がつ}から348{疾患|しっかん}。\",\"id\":\"UU tentang pengobatan pasien penyakit langka berlaku 1 Januari 2015.\\n難病 = (1) mekanisme timbulnya belum jelas, (2) cara pengobatan belum mapan, (3) jarang, (4) butuh pengobatan jangka panjang.\\n指定難病 (menerima bantuan biaya medis) = 難病 yang memenuhi: jumlah pasien di bawah ±0,1% penduduk DAN ada kriteria diagnosis objektif.\\nSejak April 2025: 348 penyakit.\"},{\"h\":\"{特定医療費|とくていいりょうひ}と{難病相談支援|なんびょうそうだんしえん}センター\",\"hid\":\"Biaya medis khusus & pusat konsultasi\",\"jp\":\"{特定医療費|とくていいりょうひ}の{支給|しきゅう}：{医療保険|いりょうほけん}（{保険適用分|ほけんてきようぶん}の{医療費|いりょうひ}、{入院時食事療養費|にゅういんじしょくじりょうようひ}、{入院時生活療養費|にゅういんじせいかつりょうようひ}）、{介護保険|かいごほけん}（{訪問看護|ほうもんかんご}、{訪問|ほうもん}リハビリテーション、{居宅療養管理指導|きょたくりょうようかんりしどう}、{介護医療院|かいごいりょういん}など）。{医療保険|いりょうほけん}・{介護保険|かいごほけん}の{給付|きゅうふ}を{優先|ゆうせん}（{保険優先制度|ほけんゆうせんせいど}）。{自己負担上限額|じこふたんじょうげんがく}を{超|こ}える{部分|ぶぶん}を{公費負担|こうひふたん}。{都道府県|とどうふけん}は{難病相談支援|なんびょうそうだんしえん}センターを{設置|せっち}できる。\",\"id\":\"・Yang ditanggung 特定医療費: dari asuransi medis (biaya berobat, makan dan hidup saat rawat inap) dan asuransi kaigo (kunjungan keperawatan, rehabilitasi kunjungan, 居宅療養管理指導, 介護医療院, dll.).\\n・ASURANSI DIDAHULUKAN (保険優先制度); bagian di atas 自己負担上限額 (batas sesuai penghasilan) ditanggung DANA PUBLIK.\\n・PREFEKTUR BISA (tidak wajib) mendirikan 難病相談支援センター: konsultasi telepon/tatap muka untuk pasien dan keluarga, memberi informasi dan saran.\"},{\"h\":\"{指定難病|していなんびょう}の{主|おも}な{例|れい}（{受給者数|じゅきゅうしゃすう}）\",\"hid\":\"Contoh 指定難病 (jumlah penerima)\",\"jp\":\"パーキンソン{病|びょう}147,481（60{歳以上|さいいじょう}95%）、{潰瘍性大腸炎|かいようせいだいちょうえん}146,702（0〜59{歳|さい}70%）、{全身性|ぜんしんせい}エリテマトーデス66,307、クローン{病|びょう}52,108（0〜59{歳|さい}85%）、{後縦靱帯骨化症|こうじゅうじんたいこっかしょう}31,733、{重症筋無力症|じゅうしょうきんむりょくしょう}27,371、{脊髄小脳変性症|せきずいしょうのうへんせいしょう}26,578、{多発性硬化症|たはつせいこうかしょう}24,105、{網膜色素変性症|もうまくしきそへんせいしょう}20,687、{進行性核上性麻痺|しんこうせいかくじょうせいまひ}13,355（60{歳以上|さいいじょう}99%）、{多系統萎縮症|たけいとういしゅくしょう}10,528、{筋萎縮性側索硬化症|きんいしゅくせいそくさくこうかしょう}（ALS）9,727、{悪性関節|あくせいかんせつ}リウマチ4,825、{前頭側頭葉変性症|ぜんとうそくとうようへんせいしょう}1,449、プリオン{病|びょう}448。348{疾患|しっかん}の{合計|ごうけい}1,086,579{人|にん}。\",\"id\":\"Pemegang sertifikat terbanyak:\\n1. パーキンソン病 (Parkinson) ±147 ribu — 95% usia 60+\\n2. 潰瘍性大腸炎 (kolitis ulseratif) ±147 ribu — 70% di bawah 60\\n3. 全身性エリテマトーデス (lupus) ±66 ribu\\n4. クローン病 (Crohn) ±52 ribu — 85% di bawah 60\\nLainnya: 後縦靱帯骨化症, 重症筋無力症 (myasthenia gravis), 脊髄小脳変性症, 多発性硬化症 (MS), 網膜色素変性症, 進行性核上性麻痺 (99% usia 60+), 多系統萎縮症, ALS (±9.700), 悪性関節リウマチ, 前頭側頭葉変性症, プリオン病.\\nTotal 348 penyakit: ±1,09 juta orang (43% di bawah 60, 57% usia 60+).\"}], points: [\"★ 国民皆保険 = 1961 (昭和36). Peserta ±124 juta = jumlah penduduk.\",\"★ 協会けんぽ = perusahaan kecil-menengah, iuran per PREFEKTUR. 組合健保 = perusahaan besar, iuran per SERIKAT.\",\"★ 市町村国保: penyelenggara prefektur + kota. 国保組合: dokter, pengacara, dll.\",\"★ 後期高齢者医療: 75+ (atau 65–74 disabilitas tertentu), dijalankan 広域連合 per prefektur.\",\"★ Penerima 生活保護 dibebaskan dari 国保 dan 後期高齢者 → 医療扶助.\",\"★ Tanggungan hanya di 被用者保険. Boleh terpisah: 直系尊属, pasangan, anak, cucu, saudara kandung.\",\"★ Biaya sendiri: 75+ 10% · 70–74 20% · sekolah wajib–69 30% · sebelum sekolah wajib 20%.\",\"★ 傷病手当金: 2/3, mulai hari ke-4, maks. 1 tahun 6 bulan (被用者 saja). 出産手当金: 42 + 56 hari.\",\"★ 出産育児一時金 500.000 yen. 埋葬料 50.000 yen. 償還払い = bayar dulu, klaim kemudian.\",\"★ 高額療養費 = per BULAN. 高額介護合算療養費 = per TAHUN, medis + kaigo.\",\"★ 国民医療費 2022: ±47 triliun yen, ±370 ribu yen per orang; tanpa persalinan normal, cek kesehatan, vaksin.\",\"★ 病院 ≥20 tempat tidur, 診療所 ≤19. 特定機能病院 → Menteri, 地域医療支援病院 → Gubernur. 老健・介護医療院 = UU kaigo.\",\"★ 指定難病: <0,1% penduduk + kriteria diagnosis, 348 penyakit (April 2025). UU berlaku 1 Jan 2015. Terbanyak: Parkinson.\"], quiz: [{\"jp\":\"{国民皆保険|こくみんかいほけん}{制度|せいど}が{整備|せいび}された{年|とし}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 tahun terwujudnya asuransi kesehatan untuk semua warga.\",\"answer\":2,\"opts\":[{\"jp\":\"1922{年|ねん}\",\"id\":\"1922\",\"reason\":\"UU Asuransi Kesehatan.\"},{\"jp\":\"1958{年|ねん}\",\"id\":\"1958\",\"reason\":\"Revisi UU 国保.\"},{\"jp\":\"1961{年|ねん}\",\"id\":\"1961\",\"reason\":\"Benar.\"},{\"jp\":\"1973{年|ねん}\",\"id\":\"1973\",\"reason\":\"Pengobatan lansia gratis.\"},{\"jp\":\"2000{年|ねん}\",\"id\":\"2000\",\"reason\":\"Asuransi kaigo.\"}],\"explain\":\"国民皆保険 = 1961 (昭和36).\"},{\"jp\":\"{協会|きょうかい}けんぽについて、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan benar tentang 協会けんぽ.\",\"answer\":0,\"opts\":[{\"jp\":\"{都道府県|とどうふけん}ごとに{保険料|ほけんりょう}が{異|こと}なる\",\"id\":\"Iuran berbeda per prefektur\",\"reason\":\"Benar.\"},{\"jp\":\"{大企業|だいきぎょう}の{従業員|じゅうぎょういん}が{加入|かにゅう}する\",\"id\":\"Untuk karyawan perusahaan besar\",\"reason\":\"Itu 組合健保.\"},{\ おこな}います。そのあと、{介護認定審査会|かいごにんていしんさかい|kh_shinsakai}が{二次判定|にじはんてい}を{行|おこな}い、{最後|さいご}に{市町村|しちょうそん}が{認定|にんてい}して{結果|けっか}を{通知|つうち}します。',\n        id: 'Pertama, ajukan permohonan ke kota (baru, perpanjangan, atau perubahan). Lalu dilakukan survei kondisi fisik dan mental (survei dasar 74 butir dan catatan khusus). Dari hasil survei dan surat pendapat dokter utama, komputer melakukan penilaian tahap 1. Setelah itu dewan pemeriksa melakukan penilaian tahap 2, dan terakhir kota menetapkan sertifikasi serta memberi tahu hasilnya.' },\n      { h: '{申請|しんせい}の{代行|だいこう}', hid: 'Siapa yang bisa mengajukan atas nama pemohon',\n        jp: '{本人|ほんにん}や{家族|かぞく}のほか、{指定居宅介護支援事業者|していきょたくかいごしえんじぎょうしゃ}、{地域密着型介護老人福祉施設|ちいきみっちゃくがたかいごろうじんふくししせつ}、{介護保険施設|かいごほけんしせつ}、{地域包括支援|ちいきほうかつしえん}センターなどが{申請|しんせい}を{代行|だいこう}できます。',\n        id: 'Selain pemohon dan keluarganya, permohonan bisa diwakilkan oleh kantor care manager yang ditunjuk, panti lansia khusus berbasis komunitas, fasilitas asuransi kaigo, dan pusat dukungan komprehensif daerah.' },\n      { h: '{介護認定審査会|かいごにんていしんさかい}', hid: 'Dewan pemeriksa',\n        jp: '{委員|いいん}は{保健|ほけん}・{医療|いりょう}・{福祉|ふくし}の{学識経験者|がくしきけいけんしゃ}から{市町村長|しちょうそんちょう}が{任命|にんめい}します。{任期|にんき}は{原則|げんそく}2{年|ねん}です（{条例|じょうれい}で3{年|ねん}まで{延長|えんちょう}できます）。{要介護度|ようかいごど}の{審査判定|しんさはんてい}と、{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい|kh_tokutei}の{判定|はんてい}を{行|おこな}います。',\n        id: 'Anggota diangkat oleh wali kota dari ahli di bidang kesehatan, medis, dan kesejahteraan. Masa jabatan prinsipnya 2 tahun (bisa diperpanjang sampai 3 tahun dengan peraturan daerah). Dewan menilai tingkat perlu perawatan dan menilai apakah peserta nomor 2 (usia 40–64) menderita penyakit khusus.' },\n      { h: '{認定|にんてい}の{有効期間|ゆうこうきかん}', hid: 'Masa berlaku sertifikasi',\n        jp: '{新規申請|しんきしんせい}と{区分変更申請|くぶんへんこうしんせい}は{原則|げんそく}6か{月|げつ}（3〜12か{月|げつ}）です。{更新申請|こうしんしんせい}は{原則|げんそく}12か{月|げつ}（3〜36か{月|げつ}）です。{直前|ちょくぜん}と{同|おな}じ{要介護度|ようかいごど}と{判定|はんてい}されたときは、48か{月|げつ}まで{延長|えんちょう}できます。',\n        id: 'Permohonan baru dan perubahan tingkat: prinsipnya 6 bulan (bisa 3–12 bulan). Perpanjangan: prinsipnya 12 bulan (bisa 3–36 bulan). Jika hasilnya sama dengan tingkat sebelumnya, bisa diperpanjang sampai 48 bulan.' },\n      { h: '{保険給付|ほけんきゅうふ}の3{種類|しゅるい}', hid: '3 jenis manfaat asuransi',\n        jp: '{要介護者|ようかいごしゃ}が{使|つか}える「{介護給付|かいごきゅうふ}」、{要支援者|ようしえんしゃ}が{使|つか}える「{予防給付|よぼうきゅうふ|kh_yobo}」、{市町村|しちょうそん}が{条例|じょうれい}で{決|き}める「{市町村特別給付|しちょうそんとくべつきゅうふ}」の3つです。{介護保険|かいごほけん}からは7〜9{割|わり}が{給付|きゅうふ}されます（{自己負担|じこふたん}は1〜3{割|わり}）。ケアプランの{作成|さくせい}（{居宅介護支援|きょたくかいごしえん|kh_shien}・{介護予防支援|かいごよぼうしえん}）は10{割|わり}{給付|きゅうふ}で、{自己負担|じこふたん}はありません。',\n        id: 'Ada 3 jenis: manfaat perawatan untuk orang 要介護, manfaat pencegahan untuk orang 要支援, dan manfaat khusus kota yang ditetapkan lewat peraturan daerah. Asuransi menanggung 70–90% (biaya sendiri 10–30%). Pembuatan care plan ditanggung 100%, jadi pengguna tidak membayar.' },\n      { h: 'だれが{指定|してい}するか', hid: 'Siapa yang menunjuk penyedia layanan',\n        jp: '{居宅|きょたく}サービスと{施設|しせつ}サービスは{都道府県知事|とどうふけんちじ}が{指定|してい}します。{地域密着型|ちいきみっちゃくがた}サービス、{居宅介護支援|きょたくかいごしえん}、{介護予防支援|かいごよぼうしえん}は{市町村長|しちょうそんちょう}が{指定|してい}します。{指定事業者|していじぎょうしゃ}は6{年|ねん}ごとに{更新|こうしん}が{必要|ひつよう}です。',\n        id: 'Layanan di rumah dan layanan fasilitas ditunjuk oleh gubernur prefektur. Layanan berbasis komunitas, dukungan perawatan di rumah, dan dukungan pencegahan ditunjuk oleh wali kota. Penyedia yang ditunjuk harus memperbarui penunjukan setiap 6 tahun.' }\n    ],\n    compare: { a: '介護給付', b: '予防給付', rows: [\n      { label: 'Untuk siapa', a: '要介護1–5', b: '要支援1–2' },\n      { label: 'Fasilitas (特養・老健・介護医療院)', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Kunjungan malam, 定期巡回, 看護小規模多機能', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Care plan', a: '居宅介護支援', b: '介護予防支援' } ] },\n    points: [\n      'Urutan: 申請 → 調査 + 主治医意見書 → 一次判定 (komputer) → 二次判定 (審査会) → 市町村が認定. Yang menetapkan sertifikasi adalah 市町村, bukan dewan.',\n      'Angka yang sering keluar: 基本調査 74 butir, masa jabatan dewan 2 tahun, berlaku baru 6 bulan, perpanjangan 12 bulan (maks. 48), 16 特定疾病, pembaruan penunjukan 6 tahun.',\n      'Batas angka layanan: 地域密着型通所介護 maks. 18 orang, 小規模多機能・地域密着型特養・地域密着型特定施設 maks. 29 orang, 特養 prinsipnya 要介護3 ke atas, pembelian alat bantu 100.000 yen/tahun, renovasi rumah 200.000 yen.',\n      'Lisensi care manager (介護支援専門員) diperbarui setiap 5 tahun. Jangan tertukar dengan penunjukan penyedia layanan (6 tahun).'\n    ],\n    quiz: [\n      { jp: '{要介護認定|ようかいごにんてい}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang sertifikasi perlu perawatan.', answer: 3,\n        opts: [\n          { jp: '{申請先|しんせいさき}は{都道府県|とどうふけん}である。', id: 'Permohonan diajukan ke prefektur.', reason: 'Permohonan diajukan ke kota (市町村).' },\n          { jp: '{一次判定|いちじはんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Penilaian tahap 1 dilakukan dewan pemeriksa.', reason: 'Tahap 1 oleh komputer. Dewan melakukan tahap 2.' },\n          { jp: '{基本調査|きほんちょうさ}は100{項目|こうもく}である。', id: 'Survei dasar terdiri dari 100 butir.', reason: 'Survei dasar 74 butir.' },\n          { jp: '{二次判定|にじはんてい}では{主治医意見書|しゅじいいけんしょ}も{使|つか}われる。', id: 'Penilaian tahap 2 juga memakai surat pendapat dokter utama.', reason: 'Benar. Dewan memakai hasil tahap 1, catatan khusus, dan surat pendapat dokter.' },\n          { jp: '{最終的|さいしゅうてき}な{認定|にんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Sertifikasi akhir ditetapkan dewan pemeriksa.', reason: 'Dewan hanya menilai. Yang menetapkan adalah kota.' } ],\n        explain: 'Dewan pemeriksa melakukan penilaian tahap 2 dengan melihat hasil komputer, catatan khusus survei, dan surat pendapat dokter utama. Keputusan resmi tetap dibuat oleh kota.' },\n      { jp: '{要介護認定|ようかいごにんてい}の{有効期間|ゆうこうきかん}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang masa berlaku sertifikasi.', answer: 1,\n        opts: [\n          { jp: '{新規申請|しんきしんせい}の{原則|げんそく}は3か{月|げつ}である。', id: 'Permohonan baru prinsipnya 3 bulan.', reason: 'Prinsipnya 6 bulan.' },\n          { jp: '{更新申請|こうしんしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perpanjangan prinsipnya 12 bulan.', reason: 'Benar.' },\n          { jp: '{区分変更申請|くぶんへんこうしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perubahan tingkat prinsipnya 12 bulan.', reason: 'Sama dengan permohonan baru: 6 bulan.' },\n          { jp: '{更新|こうしん}では、どんな{場合|ばあい}も36か{月|げつ}が{上限|じょうげん}である。', id: 'Untuk perpanjangan, batasnya selalu 36 bulan.', reason: 'Jika tingkatnya sama dengan sebelumnya, bisa sampai 48 bulan.' },\n          { jp: '{有効期間|ゆうこうきかん}は{本人|ほんにん}が{自由|じゆう}に{選|えら}べる。', id: 'Masa berlaku bebas dipilih pemohon.', reason: 'Ditentukan dalam rentang aturan oleh dewan/kota.' } ],\n        explain: 'Baru dan perubahan tingkat: 6 bulan (3–12). Perpanjangan: 12 bulan (3–36, atau 48 jika tingkat sama).' },\n      { jp: '{要支援者|ようしえんしゃ}が{利用|りよう}できないサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang tidak bisa dipakai orang 要支援.', answer: 4,\n        opts: [\n          { jp: '{介護予防福祉用具貸与|かいごよぼうふくしようぐたいよ}', id: 'Peminjaman alat bantu pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防住宅改修|かいごよぼうじゅうたくかいしゅう}', id: 'Renovasi rumah pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防短期入所生活介護|かいごよぼうたんきにゅうしょせいかつかいご}', id: 'Singgah pendek pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防小規模多機能型居宅介護|かいごよぼうしょうきぼたきのうがたきょたくかいご}', id: 'Layanan multifungsi skala kecil pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{夜間対応型訪問介護|やかんたいおうがたほうもんかいご}', id: 'Kunjungan perawatan malam', reason: 'Benar. Hanya untuk 要介護.' } ],\n        explain: 'Tidak ada versi 予防給付 untuk: 定期巡回・随時対応型, 夜間対応型訪問介護, 看護小規模多機能, 地域密着型通所介護, 地域密着型特定施設, 地域密着型特養, dan 3 fasilitas (特養・老健・介護医療院).' },\n      { jp: '{市町村長|しちょうそんちょう}が{指定|してい}するサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang ditunjuk oleh wali kota.', answer: 2,\n        opts: [\n          { jp: '{訪問介護|ほうもんかいご}', id: 'Kunjungan perawatan', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{介護老人保健施設|かいごろうじんほけんしせつ}', id: 'Fasilitas kesehatan lansia (老健)', reason: 'Fasilitas: gubernur (izin).' },\n          { jp: '{認知症対応型共同生活介護|にんちしょうたいおうがたきょうどうせいかつかいご}', id: 'Group home demensia', reason: 'Benar. Layanan berbasis komunitas: wali kota.' },\n          { jp: '{通所|つうしょ}リハビリテーション', id: 'Rehabilitasi harian', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{特定施設入居者生活介護|とくていしせつにゅうきょしゃせいかつかいご}', id: 'Perawatan penghuni fasilitas tertentu', reason: 'Layanan di rumah: gubernur (versi 地域密着型 oleh wali kota).' } ],\n        explain: 'Wali kota menunjuk: layanan berbasis komunitas (group home demensia, 小規模多機能, dll.), 居宅介護支援, dan 介護予防支援. Sisanya oleh gubernur.' },\n      { jp: '{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい}に{含|ふく}まれるものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk penyakit khusus untuk peserta nomor 2.', answer: 0,\n        opts: [\n          { jp: '{初老期|しょろうき}における{認知症|にんちしょう}', id: 'Demensia usia pra-lansia', reason: 'Benar. Termasuk 16 penyakit khusus.' },\n          { jp: '{高血圧症|こうけつあつしょう}', id: 'Hipertensi', reason: 'Tidak termasuk.' },\n          { jp: '{統合失調症|とうごうしっちょうしょう}', id: 'Skizofrenia', reason: 'Tidak termasuk.' },\n          { jp: '{胃|い}がん（{末期|まっき}ではない）', id: 'Kanker lambung (bukan stadium akhir)', reason: 'Yang termasuk hanya kanker stadium akhir (がん末期).' },\n          { jp: '{骨折|こっせつ}を{伴|ともな}わない{骨粗鬆症|こつそしょうしょう}', id: 'Osteoporosis tanpa patah tulang', reason: 'Yang termasuk adalah osteoporosis disertai patah tulang.' } ],\n        explain: 'Contoh 16 特定疾病: がん末期, リウマチ, ALS, パーキンソン病関連, 初老期の認知症, 脳血管疾患, 骨折を伴う骨粗鬆症, COPD, 糖尿病の合併症, 変形性関節症 (kedua lutut/panggul), dll.' }\n    ]\n  },\n  'ninchi-1': {\n    title: '中核症状とBPSD', titleId: 'Gejala inti dan gejala perilaku-psikologis',\n    terms: ['chukaku', 'kioku', 'kentoshiki', 'jikko', 'bpsd', 'haikai', 'moso', 'yokuutsu'],\n    sections: [\n      { h: '{中核症状|ちゅうかくしょうじょう}', hid: 'Gejala inti',\n        jp: '{脳|のう}の{神経細胞|しんけいさいぼう}が{壊|こわ}れることで、{直接|ちょくせつ}{起|お}こる{症状|しょうじょう}です。{認知症|にんちしょう}の{人|ひと}には、だれにでも{現|あらわ}れます。{記憶障害|きおくしょうがい|kioku}、{見当識障害|けんとうしきしょうがい|kentoshiki}、{実行機能障害|じっこうきのうしょうがい|jikko}などがあります。',\n        id: 'Gejala yang muncul langsung karena sel saraf otak rusak. Gejala ini muncul pada semua penderita demensia. Contohnya gangguan memori, gangguan orientasi, dan gangguan fungsi eksekutif.' },\n      { h: '{行動|こうどう}・{心理症状|しんりしょうじょう}（BPSD）', hid: 'Gejala perilaku & psikologis',\n        jp: '{中核症状|ちゅうかくしょうじょう|chukaku}に、{本人|ほんにん}の{性格|せいかく}や{環境|かんきょう}、{体調|たいちょう}などが{影響|えいきょう}して{起|お}こる{症状|しょうじょう}です。{徘徊|はいかい|haikai}、{妄想|もうそう|moso}、{暴言|ぼうげん}・{暴力|ぼうりょく}、{抑うつ|よくうつ|yokuutsu}などがあります。{全|すべ}ての{人|ひと}に{現|あらわ}れるわけではありません。',\n        id: 'Gejala yang muncul karena gejala inti dipengaruhi kepribadian, lingkungan, dan kondisi fisik orang tersebut. Contohnya berkeliaran tanpa tujuan, delusi, kata-kata kasar dan kekerasan, serta depresi. Tidak semua penderita mengalaminya.' }\n    ],\n    compare: { a: '中核症状', b: 'BPSD', rows: [\n      { label: 'Siapa', a: 'Semua penderita', b: 'Tidak semua' },\n      { label: 'Penyebab', a: 'Kerusakan sel otak', b: 'Gejala inti + lingkungan, kepribadian' },\n      { label: 'Dengan perawatan', a: 'Sulit membaik', b: 'Bisa berkurang' } ] },\n    points: [\n      'Soal sering meminta memilih mana yang termasuk 中核症状. Ingat kata kuncinya: 記憶・見当識・判断・実行機能.',\n      '徘徊・妄想・暴言 adalah BPSD, bukan gejala inti. Ini pengecoh yang paling sering muncul.'\n    ],\n    quiz: [\n      { jp: '{認知症|にんちしょう}の{中核症状|ちゅうかくしょうじょう}として、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk gejala inti demensia.', answer: 2,\n        opts: [\n          { jp: '{徘徊|はいかい}', id: 'Berkeliaran tanpa tujuan', reason: 'Termasuk BPSD, dipengaruhi lingkungan dan perasaan.' },\n          { jp: '{妄想|もうそう}', id: 'Delusi', reason: 'Termasuk BPSD, tidak muncul pada semua penderita.' },\n          { jp: '{見当識障害|けんとうしきしょうがい}', id: 'Gangguan orientasi', reason: 'Benar. Muncul langsung karena kerusakan otak.' },\n          { jp: '{暴言|ぼうげん}', id: 'Kata-kata kasar', reason: 'Termasuk BPSD, sering dipicu stres atau rasa tidak nyaman.' },\n          { jp: '{抑|よく}うつ', id: 'Depresi', reason: 'Termasuk BPSD.' } ],\n        explain: '見当識障害 muncul langsung karena kerusakan otak, jadi termasuk gejala inti. Empat pilihan lain adalah BPSD, yang dipengaruhi lingkungan dan kondisi orang tersebut.' },\n      { jp: '{認知症|にんちしょう}の{行動|こうどう}・{心理症状|しんりしょうじょう}（BPSD）について、{最|もっと}も{適切|てきせつ}なものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan tentang BPSD yang paling tepat.', answer: 3,\n        opts: [\n          { jp: 'すべての{認知症|にんちしょう}の{人|ひと}に{現|あらわ}れる', id: 'Muncul pada semua penderita demensia', reason: 'Yang muncul pada semua penderita adalah 中核症状.' },\n          { jp: '{脳|のう}の{障害|しょうがい}だけが{原因|げんいん}である', id: 'Penyebabnya hanya kerusakan otak', reason: 'BPSD juga dipengaruhi lingkungan, kepribadian, dan kondisi tubuh.' },\n          { jp: '{記憶障害|きおくしょうがい}はBPSDに{含|ふく}まれる', id: 'Gangguan memori termasuk BPSD', reason: 'Gangguan memori termasuk 中核症状.' },\n          { jp: '{環境|かんきょう}を{整|ととの}えると{軽|かる}くなることがある', id: 'Bisa berkurang jika lingkungan ditata', reason: 'Benar. Perawatan dan lingkungan yang tepat bisa mengurangi BPSD.' },\n          { jp: '{薬|くすり}で{完全|かんぜん}に{治|なお}る', id: 'Bisa sembuh total dengan obat', reason: 'Obat hanya membantu. Pendekatan perawatan tetap yang utama.' } ],\n        explain: 'BPSD muncul dari gejala inti ditambah pengaruh lingkungan dan kondisi orang tersebut. Karena itu, mengubah cara merawat dan menata lingkungan bisa membuatnya berkurang.' },\n      { jp: 'Aさんは{夕方|ゆうがた}になると「{家|いえ}に{帰|かえ}ります」と{言|い}って{落|お}ち{着|つ}かなくなる。{介護福祉職|かいごふくししょく}の{対応|たいおう}として、{最|もっと}も{適切|てきせつ}なものを1つ{選|えら}びなさい。',\n        id: 'Setiap sore, Bu A berkata \"Saya mau pulang\" dan menjadi gelisah. Pilih 1 respons pekerja kaigo yang paling tepat.', answer: 2,\n        opts: [\n          { jp: '「ここがAさんの{家|いえ}です」と{説得|せっとく}する', id: 'Meyakinkan \"Ini rumah Anda\"', reason: 'Membantah perasaannya bisa membuatnya makin gelisah.' },\n          { jp: '{部屋|へや}に{鍵|かぎ}をかける', id: 'Mengunci kamar', reason: 'Termasuk 身体拘束 (pengekangan), pada prinsipnya dilarang.' },\n          { jp: '{話|はなし}を{聞|き}いて、{気持|きも}ちを{受|う}け{止|と}める', id: 'Mendengarkan dan menerima perasaannya', reason: 'Benar. Sikap 受容 (menerima) adalah dasar komunikasi.' },\n          { jp: '{聞|き}こえないふりをする', id: 'Pura-pura tidak mendengar', reason: 'Mengabaikan membuatnya merasa tidak dihargai.' },\n          { jp: '{早|はや}く{寝|ね}るように{促|うなが}す', id: 'Menyuruhnya cepat tidur', reason: 'Tidak menanggapi alasan ia gelisah.' } ],\n        explain: 'Ini disebut 夕暮れ症候群 (sindrom senja), salah satu BPSD. Kuncinya 受容: dengarkan dulu alasan dan perasaannya, jangan membantah atau membatasi geraknya.' }\n    ]\n  }\n};\n\n// Pembagian part sesuai ujian asli (sejak 第38回). q = jumlah soal per 科目.\nconst PARTS = {\n  A: { title: 'Aパート · Dasar & teknik kaigo', time: 'Pagi 10:00–11:45', q: 60, desc: 'Nilai dan sistem kaigo, komunikasi, sistem sosial, dan teknik bantuan hidup sehari-hari.' },\n  B: { title: 'Bパート · Tubuh, penyakit & disabilitas', time: 'Siang 13:40–', q: 45, desc: 'Mekanisme tubuh dan pikiran, penuaan, demensia, disabilitas, dan perawatan medis. Banyak hafalan.' },\n  C: { title: 'Cパート · Penerapan', time: 'Siang 13:40–', q: 20, desc: 'Proses kaigo dan soal kasus. Menguji kemampuan menerapkan pengetahuan pada situasi nyata.' }\n};\nconst SUBJECTS = [\n  { key: 'songen', part: 'A', q: 2, jp: '人間の尊厳と自立', idn: 'Martabat manusia & kemandirian', lessons: ['songen-b3', 'songen-3', 'songen-4', 'songen-5', 'songen-6'], rk: ['songen-3', 'songen-4', 'songen-5', 'songen-6'] },\n  { key: 'kihon', part: 'A', q: 10, jp: '介護の基本', idn: 'Dasar-dasar kaigo', lessons: [] },\n  { key: 'kankei', part: 'A', q: 4, jp: '人間関係とコミュニケーション', idn: 'Hubungan antarmanusia & komunikasi', lessons: [] },\n  { key: 'comm', part: 'A', q: 6, jp: 'コミュニケーション技術', idn: 'Teknik komunikasi', lessons: [] },\n  { key: 'shakai', part: 'A', q: 12, jp: '社会の理解', idn: 'Memahami sistem sosial', lessons: ['shakai-b1', 'shakai-b2', 'shakai-b4', 'shakai-b5', 'shakai-b6', 'shakai-b7', 'shakai
