"しゃかいてきほうせつ\",\"romaji\":\"shakaiteki hōsetsu\",\"arti\":\"Inklusi sosial\",\"desc\":\"Merangkul semua orang agar tidak ada yang terisolasi, hidup dan saling mendukung bersama.\"},\n  p3_advocacy: {\"kanji\":\"権利擁護\",\"read\":\"けんりようご\",\"romaji\":\"kenri yōgo\",\"arti\":\"Advokasi, perlindungan hak\",\"desc\":\"Memperjuangkan dan mewakili suara pengguna untuk melindungi hak dan kepentingannya.\"},\n  p3_ud: {\"kanji\":\"ユニバーサルデザイン\",\"read\":\"ユニバーサルデザイン\",\"romaji\":\"yunibāsaru dezain\",\"arti\":\"Desain universal\",\"desc\":\"Desain yang mudah dipakai semua orang tanpa memandang usia atau disabilitas. Ada 7 prinsip.\"},\n  p3_taido: {\"kanji\":\"態度価値\",\"read\":\"たいどかち\",\"romaji\":\"taido kachi\",\"arti\":\"Nilai sikap (Frankl)\",\"desc\":\"Nilai yang terwujud dari sikap yang diambil saat hidup dibatasi, misalnya saat sakit berat. 2 nilai lain: 創造価値 dan 体験価値.\"},\n  p3_il: {\"kanji\":\"自立生活運動\",\"read\":\"じりつせいかつうんどう\",\"romaji\":\"jiritsu seikatsu undō\",\"arti\":\"Gerakan hidup mandiri (IL)\",\"desc\":\"Dimulai akhir 1960-an di AS oleh Ed Roberts dkk. Menjunjung pilihan dan penentuan diri penyandang disabilitas.\"},\n  p3_goritekihairyo: {\"kanji\":\"合理的配慮\",\"read\":\"ごうりてきはいりょ\",\"romaji\":\"gōriteki hairyo\",\"arti\":\"Akomodasi yang wajar\",\"desc\":\"Penyesuaian yang diperlukan agar penyandang disabilitas bisa setara. Pertama kali muncul dalam perjanjian internasional di Konvensi Hak Penyandang Disabilitas (2006).\"},\n  p3_seizonken: {\"kanji\":\"生存権\",\"read\":\"せいぞんけん\",\"romaji\":\"seizonken\",\"arti\":\"Hak untuk hidup layak\",\"desc\":\"Pasal 25 Konstitusi: semua warga berhak atas kehidupan minimum yang sehat dan berbudaya. Kasus terkait: 朝日訴訟, 堀木訴訟.\"},\n  p3_nichijo: {\"kanji\":\"日常生活自立支援事業\",\"read\":\"にちじょうせいかつじりつしえんじぎょう\",\"romaji\":\"nichijō seikatsu jiritsu shien jigyō\",\"arti\":\"Program dukungan kemandirian hidup sehari-hari\",\"desc\":\"Dilaksanakan dewan kesejahteraan sosial (社協) berdasarkan UU Kesejahteraan Sosial. Membantu pengelolaan uang harian dan penggunaan layanan, lewat kontrak.\"},\n  p4_hotei: {\"kanji\":\"法定後見制度\",\"read\":\"ほうていこうけんせいど\",\"romaji\":\"hōtei kōken seido\",\"arti\":\"Perwalian hukum\",\"desc\":\"Untuk orang yang kemampuan menilainya sudah kurang. Pengadilan keluarga menunjuk wali. 3 jenis: 後見・保佐・補助.\"},\n  p4_koken: {\"kanji\":\"後見\",\"read\":\"こうけん\",\"romaji\":\"kōken\",\"arti\":\"Perwalian penuh\",\"desc\":\"Untuk orang yang selalu tidak mampu menilai. Wali (成年後見人) punya hak mewakili semua tindakan hukum terkait harta. Tidak perlu persetujuan pengguna.\"},\n  p4_hosa: {\"kanji\":\"保佐\",\"read\":\"ほさ\",\"romaji\":\"hosa\",\"arti\":\"Pendampingan (curatorship)\",\"desc\":\"Untuk orang yang kemampuan menilainya sangat kurang. Pendamping disebut 保佐人.\"},\n  p4_hojo: {\"kanji\":\"補助\",\"read\":\"ほじょ\",\"romaji\":\"hojo\",\"arti\":\"Bantuan hukum (assistance)\",\"desc\":\"Untuk orang yang kemampuan menilainya kurang. Perlu persetujuan pengguna saat mengajukan.\"},\n  p4_ninni: {\"kanji\":\"任意後見制度\",\"read\":\"にんいこうけんせいど\",\"romaji\":\"nin'i kōken seido\",\"arti\":\"Perwalian sukarela\",\"desc\":\"Saat masih mampu, memilih wali dan isi tugasnya lewat kontrak akta notaris (公正証書). Berlaku setelah pengadilan menunjuk pengawas wali (任意後見監督人).\"},\n  p4_shinjo: {\"kanji\":\"身上監護\",\"read\":\"しんじょうかんご\",\"romaji\":\"shinjō kango\",\"arti\":\"Perlindungan diri (urusan pribadi)\",\"desc\":\"Tugas wali mewakili kontrak perawatan, masuk RS, atau fasilitas. Tindakan perawatan langsung tidak termasuk.\"},\n  p4_torikeshi: {\"kanji\":\"取消し\",\"read\":\"とりけし\",\"romaji\":\"torikeshi\",\"arti\":\"Pembatalan\",\"desc\":\"Tindakan hukum oleh orang di bawah perwalian bisa dibatalkan, kecuali pembelian kebutuhan sehari-hari.\"},\n  p4_koseishosho: {\"kanji\":\"公正証書\",\"read\":\"こうせいしょうしょ\",\"romaji\":\"kōsei shōsho\",\"arti\":\"Akta notaris\",\"desc\":\"Kontrak perwalian sukarela dibuat di kantor notaris (公証役場) dalam bentuk akta notaris, lalu didaftarkan ke kantor hukum (法務局).\"},\n  p4_senmonin: {\"kanji\":\"専門員\",\"read\":\"せんもんいん\",\"romaji\":\"senmon'in\",\"arti\":\"Tenaga ahli (program kemandirian)\",\"desc\":\"Dalam 日常生活自立支援事業, membuat rencana dukungan dan menandatangani kontrak. Biasanya pekerja sosial.\"},\n  p4_seikatsushienin: {\"kanji\":\"生活支援員\",\"read\":\"せいかつしえんいん\",\"romaji\":\"seikatsu shien'in\",\"arti\":\"Pendamping hidup\",\"desc\":\"Memberikan bantuan nyata sesuai rencana dan instruksi 専門員.\"},\n  p4_shinsaseikyu: {\"kanji\":\"審査請求\",\"read\":\"しんさせいきゅう\",\"romaji\":\"shinsa seikyū\",\"arti\":\"Banding administratif\",\"desc\":\"Diajukan jika tidak puas dengan keputusan pemerintah, dalam 3 bulan sejak hari berikutnya setelah mengetahui keputusan.\"},\n  p4_unei: {\"kanji\":\"運営適正化委員会\",\"read\":\"うんえいてきせいかいいんかい\",\"romaji\":\"un'ei tekiseika iinkai\",\"arti\":\"Komite kelayakan operasional\",\"desc\":\"Ditempatkan di dewan kesejahteraan sosial prefektur. Menerima keluhan tentang layanan kesejahteraan.\"},\n  p4_kujo: {\"kanji\":\"苦情解決責任者\",\"read\":\"くじょうかいけつせきにんしゃ\",\"romaji\":\"kujō kaiketsu sekininsha\",\"arti\":\"Penanggung jawab penyelesaian keluhan\",\"desc\":\"Ditempatkan di setiap tempat layanan untuk menangani keluhan pengguna.\"},\n  p5_gyakutai: {\"kanji\":\"虐待\",\"read\":\"ぎゃくたい\",\"romaji\":\"gyakutai\",\"arti\":\"Penganiayaan, kekerasan\",\"desc\":\"Perlakuan yang melukai fisik, mental, seksual, ekonomi, atau penelantaran.\"},\n  p5_yogosha: {\"kanji\":\"養護者\",\"read\":\"ようごしゃ\",\"romaji\":\"yōgosha\",\"arti\":\"Pengasuh (keluarga)\",\"desc\":\"Orang yang merawat lansia/penyandang disabilitas di rumah, misalnya keluarga. Bukan staf fasilitas.\"},\n  p5_shintai: {\"kanji\":\"身体的虐待\",\"read\":\"しんたいてきぎゃくたい\",\"romaji\":\"shintaiteki gyakutai\",\"arti\":\"Kekerasan fisik\",\"desc\":\"Kekerasan yang menyebabkan atau bisa menyebabkan luka. Jenis terbanyak pada lansia dan disabilitas.\"},\n  p5_shinri: {\"kanji\":\"心理的虐待\",\"read\":\"しんりてきぎゃくたい\",\"romaji\":\"shinriteki gyakutai\",\"arti\":\"Kekerasan psikologis\",\"desc\":\"Kata-kata sangat kasar, sikap menolak, dan perilaku yang melukai hati.\"},\n  p5_neglect: {\"kanji\":\"介護等放棄\",\"read\":\"かいごとうほうき\",\"romaji\":\"kaigo-tō hōki\",\"arti\":\"Penelantaran (neglect)\",\"desc\":\"Sangat mengabaikan perawatan: mengurangi makan secara ekstrem, membiarkan lama, dll.\"},\n  p5_keizai: {\"kanji\":\"経済的虐待\",\"read\":\"けいざいてきぎゃくたい\",\"romaji\":\"keizaiteki gyakutai\",\"arti\":\"Kekerasan ekonomi\",\"desc\":\"Menggunakan atau mengambil harta lansia secara tidak sah.\"},\n  p5_seiteki: {\"kanji\":\"性的虐待\",\"read\":\"せいてきぎゃくたい\",\"romaji\":\"seiteki gyakutai\",\"arti\":\"Kekerasan seksual\",\"desc\":\"Melakukan atau memaksa tindakan asusila.\"},\n  p5_tsuho: {\"kanji\":\"通報義務\",\"read\":\"つうほうぎむ\",\"romaji\":\"tsūhō gimu\",\"arti\":\"Kewajiban melapor\",\"desc\":\"Yang menemukan dugaan kekerasan wajib melapor ke kota (市町村). Melapor tidak melanggar kewajiban kerahasiaan.\"},\n  p5_menseki: {\"kanji\":\"守秘義務違反\",\"read\":\"しゅひぎむいはん\",\"romaji\":\"shuhi gimu ihan\",\"arti\":\"Pelanggaran kewajiban kerahasiaan\",\"desc\":\"Melaporkan kekerasan tidak dianggap pelanggaran kerahasiaan, dan pelapor tidak boleh dipecat karenanya.\"},\n  p5_tachiiri: {\"kanji\":\"立入調査\",\"read\":\"たちいりちょうさ\",\"romaji\":\"tachiiri chōsa\",\"arti\":\"Pemeriksaan di tempat\",\"desc\":\"Kota bisa memasuki rumah untuk memastikan keselamatan. Jika ada bahaya serius, bisa minta bantuan kepala kepolisian.\"},\n  p5_shiyosha: {\"kanji\":\"使用者\",\"read\":\"しようしゃ\",\"romaji\":\"shiyōsha\",\"arti\":\"Pemberi kerja\",\"desc\":\"Salah satu dari 3 jenis pelaku dalam UU Pencegahan Kekerasan terhadap Penyandang Disabilitas. Laporan bisa ke kota atau prefektur.\"},\n  p5_kenrisenter: {\"kanji\":\"都道府県障害者権利擁護センター\",\"read\":\"とどうふけんしょうがいしゃけんりようごセンター\",\"romaji\":\"todōfuken shōgaisha kenri yōgo sentā\",\"arti\":\"Pusat advokasi hak disabilitas prefektur\",\"desc\":\"Lembaga prefektur dalam UU pencegahan kekerasan disabilitas. Di kota: 市町村障害者虐待防止センター.\"},\n  p1_koreika: { kanji: '高齢化率', read: 'こうれいかりつ', romaji: 'kōreika ritsu', arti: 'Tingkat penuaan penduduk', desc: 'Persentase penduduk usia 65+ dari total penduduk. Jepang sekitar 29,3%.' },\n  p1_tfr: { kanji: '合計特殊出生率', read: 'ごうけいとくしゅしゅっしょうりつ', romaji: 'gōkei tokushu shusshō ritsu', arti: 'Angka kelahiran total (TFR)', desc: 'Rata-rata jumlah anak yang dilahirkan seorang wanita seumur hidup. Jepang 2023: 1,20.' },\n  p1_shoshi: { kanji: '少子高齢化', read: 'しょうしこうれいか', romaji: 'shōshi kōreika', arti: 'Kelahiran menurun & penuaan penduduk', desc: 'Anak makin sedikit dan lansia makin banyak. Sejak 1997 jumlah lansia melampaui jumlah anak.' },\n  p1_course: { kanji: 'ライフコース', read: 'ライフコース', romaji: 'raifu kōsu', arti: 'Jalur hidup (life course)', desc: 'Pandangan bahwa setiap individu memilih jalur hidupnya sendiri, bukan hanya mengikuti tahapan umum.' },\n  p1_kattou: { kanji: '役割葛藤', read: 'やくわりかっとう', romaji: 'yakuwari kattō', arti: 'Konflik peran', desc: 'Pertentangan antara beberapa peran yang dimiliki seseorang, misalnya peran sebagai pekerja dan sebagai pengasuh orang tua.' },\n  p1_bias: { kanji: 'ジェンダー・バイアス', read: 'ジェンダー・バイアス', romaji: 'jendā baiasu', arti: 'Bias gender', desc: 'Prasangka atau stereotip tetap tentang peran laki-laki dan perempuan di masyarakat.' },\n  p1_mcurve: { kanji: 'M字カーブ', read: 'エムじカーブ', romaji: 'emu-ji kābu', arti: 'Kurva M', desc: 'Pola tingkat kerja wanita: naik saat mulai bekerja, turun saat menikah/melahirkan, naik lagi setelah anak besar.' },\n  p1_fuyo: { kanji: '扶養義務', read: 'ふようぎむ', romaji: 'fuyō gimu', arti: 'Kewajiban menafkahi', desc: 'Menurut KUH Perdata, kerabat garis lurus dan saudara kandung wajib saling menafkahi.' },\n  p1_inzoku: { kanji: '姻族', read: 'いんぞく', romaji: 'inzoku', arti: 'Kerabat karena perkawinan', desc: 'Kerabat dari pihak pasangan. Termasuk 親族 sampai derajat 3.' },\n  p1_kaku: { kanji: '核家族世帯', read: 'かくかぞくせたい', romaji: 'kaku kazoku setai', arti: 'Rumah tangga keluarga inti', desc: 'Suami-istri saja, suami-istri dengan anak belum menikah, atau orang tua tunggal dengan anak belum menikah.' },\n  p2_gemein: { kanji: 'ゲマインシャフト', read: 'ゲマインシャフト', romaji: 'gemainshafuto', arti: 'Gemeinschaft (masyarakat paguyuban)', desc: 'Konsep Tönnies: kelompok alami berdasarkan ikatan batin, misalnya keluarga dan desa.' },\n  p2_gesell: { kanji: 'ゲゼルシャフト', read: 'ゲゼルシャフト', romaji: 'gezerushafuto', arti: 'Gesellschaft (masyarakat patembayan)', desc: 'Konsep Tönnies: kelompok buatan berdasarkan pilihan dan kepentingan, misalnya kota besar.' },\n  p2_settle: { kanji: 'セツルメント', read: 'セツルメント', romaji: 'setsurumento', arti: 'Gerakan settlement', desc: 'Orang berpendidikan tinggal di kawasan miskin untuk meneliti dan membantu warga. Pertama: Toynbee Hall (1884, Inggris).' },\n  p2_genkai: { kanji: '限界集落', read: 'げんかいしゅうらく', romaji: 'genkai shūraku', arti: 'Desa ambang batas', desc: 'Desa yang penduduk usia 65+ lebih dari 50%, sehingga fungsi komunitas sulit dipertahankan.' },\n  p2_kaso: { kanji: '過疎地域', read: 'かそちいき', romaji: 'kaso chiiki', arti: 'Daerah jarang penduduk', desc: 'Daerah yang ditetapkan hukum karena penurunan penduduk yang tinggi. Mencakup sekitar 51,5% kota/desa.' },\n  p2_minsei: { kanji: '民生委員', read: 'みんせいいいん', romaji: 'minsei iin', arti: 'Relawan kesejahteraan warga', desc: 'Diangkat Menteri Kesehatan atas rekomendasi gubernur. Masa jabatan 3 tahun, tidak digaji, sekaligus menjadi 児童委員.' },\n  p2_fukushi: { kanji: '福祉事務所', read: 'ふくしじむしょ', romaji: 'fukushi jimusho', arti: 'Kantor urusan kesejahteraan', desc: 'Wajib didirikan prefektur dan kota, opsional untuk 町村. Prefektur menangani 3 UU, kota menangani 6 UU kesejahteraan.' },\n  p2_jido: { kanji: '児童相談所', read: 'じどうそうだんじょ', romaji: 'jidō sōdanjo', arti: 'Pusat konsultasi anak', desc: 'Wajib di prefektur dan kota besar tertentu. Bisa melakukan perlindungan sementara anak (lebih dari 2 bulan perlu izin pengadilan keluarga).' },\n  p2_kosei: { kanji: '身体障害者更生相談所', read: 'しんたいしょうがいしゃこうせいそうだんじょ', romaji: 'shintai shōgaisha kōsei sōdanjo', arti: 'Pusat konsultasi rehabilitasi disabilitas fisik', desc: 'Wajib didirikan prefektur. Menilai secara medis/psikologis dan menilai kesesuaian alat bantu (補装具).' },\n  p2_seishin: { kanji: '精神保健福祉センター', read: 'せいしんほけんふくしセンター', romaji: 'seishin hoken fukushi sentā', arti: 'Pusat kesehatan jiwa & kesejahteraan', desc: 'Wajib di prefektur dan kota besar tertentu. Menilai buku disabilitas mental dan biaya pengobatan rawat jalan jiwa.' },\n  kh_nintei: { kanji: '要介護認定', read: 'ようかいごにんてい', romaji: 'yōkaigo nintei', arti: 'Sertifikasi tingkat perlu perawatan', desc: 'Proses kota menentukan apakah seseorang perlu dukungan (要支援1–2) atau perlu perawatan (要介護1–5). Tanpa sertifikasi ini, layanan asuransi kaigo tidak bisa dipakai.' },\n  kh_ichiji: { kanji: '一次判定', read: 'いちじはんてい', romaji: 'ichiji hantei', arti: 'Penilaian tahap 1', desc: 'Penilaian oleh komputer berdasarkan hasil survei dasar 74 butir dan pendapat dokter. Hasilnya berupa perkiraan waktu perawatan (基準時間).' },\n  kh_shinsakai: { kanji: '介護認定審査会', read: 'かいごにんていしんさかい', romaji: 'kaigo nintei shinsakai', arti: 'Dewan pemeriksa sertifikasi kaigo', desc: 'Melakukan penilaian tahap 2 (二次判定). Anggotanya ahli kesehatan, medis, dan kesejahteraan yang diangkat wali kota. Masa jabatan prinsipnya 2 tahun.' },\n  kh_ikensho: { kanji: '主治医意見書', read: 'しゅじいいけんしょ', romaji: 'shujii ikensho', arti: 'Surat pendapat dokter utama', desc: 'Dokumen dari dokter yang biasa merawat, tentang penyakit dan kondisi pemohon. Dipakai di penilaian tahap 1 dan 2.' },\n  kh_tokutei: { kanji: '特定疾病', read: 'とくていしっぺい', romaji: 'tokutei shippei', arti: '16 penyakit khusus', desc: 'Penyakit yang terkait penuaan. Peserta asuransi nomor 2 (usia 40–64) hanya bisa memakai layanan kaigo jika penyebabnya salah satu dari 16 penyakit ini.' },\n  kh_yobo: { kanji: '予防給付', read: 'よぼうきゅうふ', romaji: 'yobō kyūfu', arti: 'Manfaat pencegahan', desc: 'Manfaat asuransi untuk orang 要支援1–2. Tujuannya mencegah kondisi memburuk.' },\n  kh_chiiki: { kanji: '地域密着型サービス', read: 'ちいきみっちゃくがたサービス', romaji: 'chiiki micchakugata sābisu', arti: 'Layanan berbasis komunitas', desc: 'Layanan skala kecil untuk warga di kota itu sendiri. Ditunjuk oleh wali kota (市町村長), bukan gubernur.' },\n  kh_kaishu: { kanji: '住宅改修', read: 'じゅうたくかいしゅう', romaji: 'jūtaku kaishū', arti: 'Renovasi rumah', desc: 'Renovasi kecil seperti memasang pegangan atau menghapus beda tinggi lantai. Batas biaya dasar 200.000 yen.' },\n  kh_shien: { kanji: '居宅介護支援', read: 'きょたくかいごしえん', romaji: 'kyotaku kaigo shien', arti: 'Dukungan perawatan di rumah (pembuatan care plan)', desc: 'Care manager membuat rencana perawatan (ケアプラン) untuk orang 要介護. Pengguna tidak membayar biaya sendiri (asuransi menanggung 100%).' },\n  chukaku: { kanji: '中核症状', read: 'ちゅうかくしょうじょう', romaji: 'chūkaku shōjō', arti: 'Gejala inti', desc: 'Gejala yang muncul pada semua penderita demensia karena sel otak rusak. Pada dasarnya sulit disembuhkan.' },\n  kioku: { kanji: '記憶障害', read: 'きおくしょうがい', romaji: 'kioku shōgai', arti: 'Gangguan memori', desc: 'Sulit mengingat hal baru. Kejadian yang baru saja terjadi cepat terlupa, sedangkan kenangan lama lebih lama bertahan.' },\n  kentoshiki: { kanji: '見当識障害', read: 'けんとうしきしょうがい', romaji: 'kentōshiki shōgai', arti: 'Gangguan orientasi', desc: 'Tidak bisa mengenali waktu, tempat, atau orang. Biasanya hilang berurutan: waktu → tempat → orang.' },\n  jikko: { kanji: '実行機能障害', read: 'じっこうきのうしょうがい', romaji: 'jikkō kinō shōgai', arti: 'Gangguan fungsi eksekutif', desc: 'Tidak bisa merencanakan dan melakukan kegiatan sesuai urutan, misalnya memasak atau berganti pakaian.' },\n  bpsd: { kanji: '行動・心理症状', read: 'こうどう・しんりしょうじょう', romaji: 'kōdō shinri shōjō', arti: 'Gejala perilaku & psikologis (BPSD)', desc: 'Muncul karena gejala inti dipengaruhi lingkungan, kepribadian, dan kondisi tubuh. Bisa berkurang dengan perawatan yang tepat.' },\n  haikai: { kanji: '徘徊', read: 'はいかい', romaji: 'haikai', arti: 'Berkeliaran tanpa tujuan', desc: 'Berjalan ke sana kemari. Bagi penderita biasanya ada alasan, m uskan 8 prinsip normalisasi.\"},{\"jp\":\"ヴォルフェンスベルガー\",\"id\":\"Wolfensberger\",\"reason\":\"Social Role Valorization.\"},{\"jp\":\"エド・ロバーツ\",\"id\":\"Ed Roberts\",\"reason\":\"Gerakan hidup mandiri (IL).\"},{\"jp\":\"フランクル\",\"id\":\"Frankl\",\"reason\":\"3 nilai manusia.\"}],\"explain\":\"Bank-Mikkelsen = bapak normalisasi (UU Denmark 1959). Nirje = 8 prinsip. Wolfensberger = SRV.\"},{\"jp\":\"ニィリエのノーマライゼーションの8つの{原理|げんり}に{含|ふく}まれるものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 yang termasuk 8 prinsip normalisasi Nirje.\",\"answer\":2,\"opts\":[{\"jp\":\"{施設|しせつ}での{集団生活|しゅうだんせいかつ}\",\"id\":\"Hidup berkelompok di fasilitas\",\"reason\":\"Bertentangan dengan normalisasi.\"},{\"jp\":\"{価値|かち}ある{社会的役割|しゃかいてきやくわり}の{獲得|かくとく}\",\"id\":\"Meraih peran sosial bernilai\",\"reason\":\"Itu SRV (Wolfensberger).\"},{\"jp\":\"1{日|にち}のノーマルなリズム\",\"id\":\"Ritme harian yang normal\",\"reason\":\"Benar.\"},{\"jp\":\"{障害|しょうがい}の{完全|かんぜん}な{治療|ちりょう}\",\"id\":\"Penyembuhan total disabilitas\",\"reason\":\"Bukan prinsip normalisasi.\"},{\"jp\":\"{発達|はったつ}の{保障|ほしょう}\",\"id\":\"Jaminan perkembangan\",\"reason\":\"Konsep 糸賀一雄.\"}],\"explain\":\"8 prinsip Nirje: ritme hari, minggu, tahun; pengalaman siklus hidup; menghormati keinginan; hubungan dengan lawan jenis; standar ekonomi; standar lingkungan.\"},{\"jp\":\"「この{子|こ}らを{世|よ}の{光|ひかり}に」と{述|の}べ、{発達保障|はったつほしょう}を{唱|とな}えた{人物|じんぶつ}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 tokoh yang menulis \\\"この子らを世の光に\\\" dan mengusulkan jaminan perkembangan.\",\"answer\":3,\"opts\":[{\"jp\":\"{石井十次|いしいじゅうじ}\",\"id\":\"Ishii Juji\",\"reason\":\"Tokoh panti asuhan.\"},{\"jp\":\"{留岡幸助|とめおかこうすけ}\",\"id\":\"Tomeoka Kosuke\",\"reason\":\"Tokoh pendidikan anak nakal.\"},{\"jp\":\"{石井亮一|いしいりょういち}\",\"id\":\"Ishii Ryoichi\",\"reason\":\"Pendiri fasilitas disabilitas intelektual pertama.\"},{\"jp\":\"{糸賀一雄|いとがかずお}\",\"id\":\"Itoga Kazuo\",\"reason\":\"Benar.\"},{\"jp\":\"{野口幽香|のぐちゆか}\",\"id\":\"Noguchi Yuka\",\"reason\":\"Tokoh TK untuk anak miskin.\"}],\"explain\":\"糸賀一雄 = \\\"この子らを世の光に\\\", jaminan perkembangan (発達保障).\"},{\"jp\":\"フランクルの3つの{価値|かち}のうち、{生命|せいめい}が{制限|せいげん}される{状況|じょうきょう}でどのような{態度|たいど}をとるかで{実現|じつげん}される{価値|かち}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 nilai Frankl yang terwujud dari sikap saat hidup dibatasi.\",\"answer\":1,\"opts\":[{\"jp\":\"{創造価値|そうぞうかち}\",\"id\":\"Nilai kreasi\",\"reason\":\"Terwujud lewat karya.\"},{\"jp\":\"{態度価値|たいどかち}\",\"id\":\"Nilai sikap\",\"reason\":\"Benar.\"},{\"jp\":\"{体験価値|たいけんかち}\",\"id\":\"Nilai pengalaman\",\"reason\":\"Terwujud lewat pengalaman.\"},{\"jp\":\"{経済価値|けいざいかち}\",\"id\":\"Nilai ekonomi\",\"reason\":\"Bukan konsep Frankl.\"},{\"jp\":\"{社会価値|しゃかいかち}\",\"id\":\"Nilai sosial\",\"reason\":\"Bukan konsep Frankl.\"}],\"explain\":\"Frankl: 創造価値, 体験価値, 態度価値.\"},{\"jp\":\"{障害者|しょうがいしゃ}の{権利|けんり}に{関|かん}する{条約|じょうやく}について、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan yang benar tentang Konvensi Hak Penyandang Disabilitas.\",\"answer\":4,\"opts\":[{\"jp\":\"1981{年|ねん}に{採択|さいたく}された。\",\"id\":\"Diadopsi tahun 1981.\",\"reason\":\"1981 = Tahun Internasional Penyandang Disabilitas. Konvensi diadopsi 2006.\"},{\"jp\":\"{日本|にほん}は2006{年|ねん}に{批准|ひじゅん}した。\",\"id\":\"Jepang meratifikasi tahun 2006.\",\"reason\":\"Jepang meratifikasi Januari 2014.\"},{\"jp\":\"テーマは「{完全参加|かんぜんさんか}と{平等|びょうどう}」である。\",\"id\":\"Temanya \\\"partisipasi penuh dan kesetaraan\\\".\",\"reason\":\"Itu tema Tahun Internasional 1981.\"},{\"jp\":\"アメリカの{国内法|こくないほう}である。\",\"id\":\"Merupakan UU dalam negeri AS.\",\"reason\":\"Itu ADA (1990).\"},{\"jp\":\"「{合理的配慮|ごうりてきはいりょ}」が{国際条約|こくさいじょうやく}で{初|はじ}めて{取|と}り{上|あ}げられた。\",\"id\":\"\\\"Akomodasi yang wajar\\\" pertama kali muncul di perjanjian internasional.\",\"reason\":\"Benar.\"}],\"explain\":\"Konvensi 2006, Jepang ratifikasi 2014, prinsip \\\"Nothing about us without us\\\", konsep 合理的配慮.\"},{\"jp\":\"{日本国憲法|にほんこくけんぽう}{第|だい}25{条|じょう}に{規定|きてい}されているものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 yang diatur dalam Pasal 25 Konstitusi Jepang.\",\"answer\":2,\"opts\":[{\"jp\":\"{法|ほう}の{下|もと}の{平等|びょうどう}\",\"id\":\" permohonan ke kota (baru, perpanjangan, atau perubahan). Lalu dilakukan survei kondisi fisik dan mental (survei dasar 74 butir dan catatan khusus). Dari hasil survei dan surat pendapat dokter utama, komputer melakukan penilaian tahap 1. Setelah itu dewan pemeriksa melakukan penilaian tahap 2, dan terakhir kota menetapkan sertifikasi serta memberi tahu hasilnya.' },\n      { h: '{申請|しんせい}の{代行|だいこう}', hid: 'Siapa yang bisa mengajukan atas nama pemohon',\n        jp: '{本人|ほんにん}や{家族|かぞく}のほか、{指定居宅介護支援事業者|していきょたくかいごしえんじぎょうしゃ}、{地域密着型介護老人福祉施設|ちいきみっちゃくがたかいごろうじんふくししせつ}、{介護保険施設|かいごほけんしせつ}、{地域包括支援|ちいきほうかつしえん}センターなどが{申請|しんせい}を{代行|だいこう}できます。',\n        id: 'Selain pemohon dan keluarganya, permohonan bisa diwakilkan oleh kantor care manager yang ditunjuk, panti lansia khusus berbasis komunitas, fasilitas asuransi kaigo, dan pusat dukungan komprehensif daerah.' },\n      { h: '{介護認定審査会|かいごにんていしんさかい}', hid: 'Dewan pemeriksa',\n        jp: '{委員|いいん}は{保健|ほけん}・{医療|いりょう}・{福祉|ふくし}の{学識経験者|がくしきけいけんしゃ}から{市町村長|しちょうそんちょう}が{任命|にんめい}します。{任期|にんき}は{原則|げんそく}2{年|ねん}です（{条例|じょうれい}で3{年|ねん}まで{延長|えんちょう}できます）。{要介護度|ようかいごど}の{審査判定|しんさはんてい}と、{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい|kh_tokutei}の{判定|はんてい}を{行|おこな}います。',\n        id: 'Anggota diangkat oleh wali kota dari ahli di bidang kesehatan, medis, dan kesejahteraan. Masa jabatan prinsipnya 2 tahun (bisa diperpanjang sampai 3 tahun dengan peraturan daerah). Dewan menilai tingkat perlu perawatan dan menilai apakah peserta nomor 2 (usia 40–64) menderita penyakit khusus.' },\n      { h: '{認定|にんてい}の{有効期間|ゆうこうきかん}', hid: 'Masa berlaku sertifikasi',\n        jp: '{新規申請|しんきしんせい}と{区分変更申請|くぶんへんこうしんせい}は{原則|げんそく}6か{月|げつ}（3〜12か{月|げつ}）です。{更新申請|こうしんしんせい}は{原則|げんそく}12か{月|げつ}（3〜36か{月|げつ}）です。{直前|ちょくぜん}と{同|おな}じ{要介護度|ようかいごど}と{判定|はんてい}されたときは、48か{月|げつ}まで{延長|えんちょう}できます。',\n        id: 'Permohonan baru dan perubahan tingkat: prinsipnya 6 bulan (bisa 3–12 bulan). Perpanjangan: prinsipnya 12 bulan (bisa 3–36 bulan). Jika hasilnya sama dengan tingkat sebelumnya, bisa diperpanjang sampai 48 bulan.' },\n      { h: '{保険給付|ほけんきゅうふ}の3{種類|しゅるい}', hid: '3 jenis manfaat asuransi',\n        jp: '{要介護者|ようかいごしゃ}が{使|つか}える「{介護給付|かいごきゅうふ}」、{要支援者|ようしえんしゃ}が{使|つか}える「{予防給付|よぼうきゅうふ|kh_yobo}」、{市町村|しちょうそん}が{条例|じょうれい}で{決|き}める「{市町村特別給付|しちょうそんとくべつきゅうふ}」の3つです。{介護保険|かいごほけん}からは7〜9{割|わり}が{給付|きゅうふ}されます（{自己負担|じこふたん}は1〜3{割|わり}）。ケアプランの{作成|さくせい}（{居宅介護支援|きょたくかいごしえん|kh_shien}・{介護予防支援|かいごよぼうしえん}）は10{割|わり}{給付|きゅうふ}で、{自己負担|じこふたん}はありません。',\n        id: 'Ada 3 jenis: manfaat perawatan untuk orang 要介護, manfaat pencegahan untuk orang 要支援, dan manfaat khusus kota yang ditetapkan lewat peraturan daerah. Asuransi menanggung 70–90% (biaya sendiri 10–30%). Pembuatan care plan ditanggung 100%, jadi pengguna tidak membayar.' },\n      { h: 'だれが{指定|してい}するか', hid: 'Siapa yang menunjuk penyedia layanan',\n        jp: '{居宅|きょたく}サービスと{施設|しせつ}サービスは{都道府県知事|とどうふけんちじ}が{指定|してい}します。{地域密着型|ちいきみっちゃくがた}サービス、{居宅介護支援|きょたくかいごしえん}、{介護予防支援|かいごよぼうしえん}は{市町村長|しちょうそんちょう}が{指定|してい}します。{指定事業者|していじぎょうしゃ}は6{年|ねん}ごとに{更新|こうしん}が{必要|ひつよう}です。',\n        id: 'Layanan di rumah dan layanan fasilitas ditunjuk oleh gubernur prefektur. Layanan berbasis komunitas, dukungan perawatan di rumah, dan dukungan pencegahan ditunjuk oleh wali kota. Penyedia yang ditunjuk harus memperbarui penunjukan setiap 6 tahun.' }\n    ],\n    compare: { a: '介護給付', b: '予防給付', rows: [\n      { label: 'Untuk siapa', a: '要介護1–5', b: '要支援1–2' },\n      { label: 'Fasilitas (特養・老健・介護医療院)', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Kunjungan malam, 定期巡回, 看護小規模多機能', a: 'Bisa', b: 'Tidak bisa' },\n      { label: 'Care plan', a: '居宅介護支援', b: '介護予防支援' } ] },\n    points: [\n      'Urutan: 申請 → 調査 + 主治医意見書 → 一次判定 (komputer) → 二次判定 (審査会) → 市町村が認定. Yang menetapkan sertifikasi adalah 市町村, bukan dewan.',\n      'Angka yang sering keluar: 基本調査 74 butir, masa jabatan dewan 2 tahun, berlaku baru 6 bulan, perpanjangan 12 bulan (maks. 48), 16 特定疾病, pembaruan penunjukan 6 tahun.',\n      'Batas angka layanan: 地域密着型通所介護 maks. 18 orang, 小規模多機能・地域密着型特養・地域密着型特定施設 maks. 29 orang, 特養 prinsipnya 要介護3 ke atas, pembelian alat bantu 100.000 yen/tahun, renovasi rumah 200.000 yen.',\n      'Lisensi care manager (介護支援専門員) diperbarui setiap 5 tahun. Jangan tertukar dengan penunjukan penyedia layanan (6 tahun).'\n    ],\n    quiz: [\n      { jp: '{要介護認定|ようかいごにんてい}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang sertifikasi perlu perawatan.', answer: 3,\n        opts: [\n          { jp: '{申請先|しんせいさき}は{都道府県|とどうふけん}である。', id: 'Permohonan diajukan ke prefektur.', reason: 'Permohonan diajukan ke kota (市町村).' },\n          { jp: '{一次判定|いちじはんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Penilaian tahap 1 dilakukan dewan pemeriksa.', reason: 'Tahap 1 oleh komputer. Dewan melakukan tahap 2.' },\n          { jp: '{基本調査|きほんちょうさ}は100{項目|こうもく}である。', id: 'Survei dasar terdiri dari 100 butir.', reason: 'Survei dasar 74 butir.' },\n          { jp: '{二次判定|にじはんてい}では{主治医意見書|しゅじいいけんしょ}も{使|つか}われる。', id: 'Penilaian tahap 2 juga memakai surat pendapat dokter utama.', reason: 'Benar. Dewan memakai hasil tahap 1, catatan khusus, dan surat pendapat dokter.' },\n          { jp: '{最終的|さいしゅうてき}な{認定|にんてい}は{介護認定審査会|かいごにんていしんさかい}が{行|おこな}う。', id: 'Sertifikasi akhir ditetapkan dewan pemeriksa.', reason: 'Dewan hanya menilai. Yang menetapkan adalah kota.' } ],\n        explain: 'Dewan pemeriksa melakukan penilaian tahap 2 dengan melihat hasil komputer, catatan khusus survei, dan surat pendapat dokter utama. Keputusan resmi tetap dibuat oleh kota.' },\n      { jp: '{要介護認定|ようかいごにんてい}の{有効期間|ゆうこうきかん}について、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 pernyataan yang benar tentang masa berlaku sertifikasi.', answer: 1,\n        opts: [\n          { jp: '{新規申請|しんきしんせい}の{原則|げんそく}は3か{月|げつ}である。', id: 'Permohonan baru prinsipnya 3 bulan.', reason: 'Prinsipnya 6 bulan.' },\n          { jp: '{更新申請|こうしんしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perpanjangan prinsipnya 12 bulan.', reason: 'Benar.' },\n          { jp: '{区分変更申請|くぶんへんこうしんせい}の{原則|げんそく}は12か{月|げつ}である。', id: 'Perubahan tingkat prinsipnya 12 bulan.', reason: 'Sama dengan permohonan baru: 6 bulan.' },\n          { jp: '{更新|こうしん}では、どんな{場合|ばあい}も36か{月|げつ}が{上限|じょうげん}である。', id: 'Untuk perpanjangan, batasnya selalu 36 bulan.', reason: 'Jika tingkatnya sama dengan sebelumnya, bisa sampai 48 bulan.' },\n          { jp: '{有効期間|ゆうこうきかん}は{本人|ほんにん}が{自由|じゆう}に{選|えら}べる。', id: 'Masa berlaku bebas dipilih pemohon.', reason: 'Ditentukan dalam rentang aturan oleh dewan/kota.' } ],\n        explain: 'Baru dan perubahan tingkat: 6 bulan (3–12). Perpanjangan: 12 bulan (3–36, atau 48 jika tingkat sama).' },\n      { jp: '{要支援者|ようしえんしゃ}が{利用|りよう}できないサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang tidak bisa dipakai orang 要支援.', answer: 4,\n        opts: [\n          { jp: '{介護予防福祉用具貸与|かいごよぼうふくしようぐたいよ}', id: 'Peminjaman alat bantu pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防住宅改修|かいごよぼうじゅうたくかいしゅう}', id: 'Renovasi rumah pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防短期入所生活介護|かいごよぼうたんきにゅうしょせいかつかいご}', id: 'Singgah pendek pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{介護予防小規模多機能型居宅介護|かいごよぼうしょうきぼたきのうがたきょたくかいご}', id: 'Layanan multifungsi skala kecil pencegahan', reason: 'Bisa dipakai 要支援.' },\n          { jp: '{夜間対応型訪問介護|やかんたいおうがたほうもんかいご}', id: 'Kunjungan perawatan malam', reason: 'Benar. Hanya untuk 要介護.' } ],\n        explain: 'Tidak ada versi 予防給付 untuk: 定期巡回・随時対応型, 夜間対応型訪問介護, 看護小規模多機能, 地域密着型通所介護, 地域密着型特定施設, 地域密着型特養, dan 3 fasilitas (特養・老健・介護医療院).' },\n      { jp: '{市町村長|しちょうそんちょう}が{指定|してい}するサービスを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 layanan yang ditunjuk oleh wali kota.', answer: 2,\n        opts: [\n          { jp: '{訪問介護|ほうもんかいご}', id: 'Kunjungan perawatan', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{介護老人保健施設|かいごろうじんほけんしせつ}', id: 'Fasilitas kesehatan lansia (老健)', reason: 'Fasilitas: gubernur (izin).' },\n          { jp: '{認知症対応型共同生活介護|にんちしょうたいおうがたきょうどうせいかつかいご}', id: 'Group home demensia', reason: 'Benar. Layanan berbasis komunitas: wali kota.' },\n          { jp: '{通所|つうしょ}リハビリテーション', id: 'Rehabilitasi harian', reason: 'Layanan di rumah: gubernur.' },\n          { jp: '{特定施設入居者生活介護|とくていしせつにゅうきょしゃせいかつかいご}', id: 'Perawatan penghuni fasilitas tertentu', reason: 'Layanan di rumah: gubernur (versi 地域密着型 oleh wali kota).' } ],\n        explain: 'Wali kota menunjuk: layanan berbasis komunitas (group home demensia, 小規模多機能, dll.), 居宅介護支援, dan 介護予防支援. Sisanya oleh gubernur.' },\n      { jp: '{第|だい}2{号被保険者|ごうひほけんしゃ}の{特定疾病|とくていしっぺい}に{含|ふく}まれるものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk penyakit khusus untuk peserta nomor 2.', answer: 0,\n        opts: [\n          { jp: '{初老期|しょろうき}における{認知症|にんちしょう}', id: 'Demensia usia pra-lansia', reason: 'Benar. Termasuk 16 penyakit khusus.' },\n          { jp: '{高血圧症|こうけつあつしょう}', id: 'Hipertensi', reason: 'Tidak termasuk.' },\n          { jp: '{統合失調症|とうごうしっちょうしょう}', id: 'Skizofrenia', reason: 'Tidak termasuk.' },\n          { jp: '{胃|い}がん（{末期|まっき}ではない）', id: 'Kanker lambung (bukan stadium akhir)', reason: 'Yang termasuk hanya kanker stadium akhir (がん末期).' },\n          { jp: '{骨折|こっせつ}を{伴|ともな}わない{骨粗鬆症|こつそしょうしょう}', id: 'Osteoporosis tanpa patah tulang', reason: 'Yang termasuk adalah osteoporosis disertai patah tulang.' } ],\n        explain: 'Contoh 16 特定疾病: がん末期, リウマチ, ALS, パーキンソン病関連, 初老期の認知症, 脳血管疾患, 骨折を伴う骨粗鬆症, COPD, 糖尿病の合併症, 変形性関節症 (kedua lutut/panggul), dll.' }\n    ]\n  },\n  'ninchi-1': {\n    title: '中核症状とBPSD', titleId: 'Gejala inti dan gejala perilaku-psikologis',\n    terms: ['chukaku', 'kioku', 'kentoshiki', 'jikko', 'bpsd', 'haikai', 'moso', 'yokuutsu'],\n    sections: [\n      { h: '{中核症状|ちゅうかくしょうじょう}', hid: 'Gejala inti',\n        jp: '{脳|のう}の{神経細胞|しんけいさいぼう}が{壊|こわ}れることで、{直接|ちょくせつ}{起|お}こる{症状|しょうじょう}です。{認知症|にんちしょう}の{人|ひと}には、だれにでも{現|あらわ}れます。{記憶障害|きおくしょうがい|kioku}、{見当識障害|けんとうしきしょうがい|kentoshiki}、{実行機能障害|じっこうきのうしょうがい|jikko}などがあります。',\n        id: 'Gejala yang muncul langsung karena sel saraf otak rusak. Gejala ini muncul pada semua penderita demensia. Contohnya gangguan memori, gangguan orientasi, dan gangguan fungsi eksekutif.' },\n      { h: '{行動|こうどう}・{心理症状|しんりしょうじょう}（BPSD）', hid: 'Gejala perilaku & psikologis',\n        jp: '{中核症状|ちゅうかくしょうじょう|chukaku}に、{本人|ほんにん}の{性格|せいかく}や{環境|かんきょう}、{体調|たいちょう}などが{影響|えいきょう}して{起|お}こる{症状|しょうじょう}です。{徘徊|はいかい|haikai}、{妄想|もうそう|moso}、{暴言|ぼうげん}・{暴力|ぼうりょく}、{抑うつ|よくうつ|yokuutsu}などがあります。{全|すべ}ての{人|ひと}に{現|あらわ}れるわけではありません。',\n        id: 'Gejala yang muncul karena gejala inti dipengaruhi kepribadian, lingkungan, dan kondisi fisik orang tersebut. Contohnya berkeliaran tanpa tujuan, delusi, kata-kata kasar dan kekerasan, serta depresi. Tidak semua penderita mengalaminya.' }\n    ],\n    compare: { a: '中核症状', b: 'BPSD', rows: [\n      { label: 'Siapa', a: 'Semua penderita', b: 'Tidak semua' },\n      { label: 'Penyebab', a: 'Kerusakan sel otak', b: 'Gejala inti + lingkungan, kepribadian' },\n      { label: 'Dengan perawatan', a: 'Sulit membaik', b: 'Bisa berkurang' } ] },\n    points: [\n      'Soal sering meminta memilih mana yang termasuk 中核症状. Ingat kata kuncinya: 記憶・見当識・判断・実行機能.',\n      '徘徊・妄想・暴言 adalah BPSD, bukan gejala inti. Ini pengecoh yang paling sering muncul.'\n    ],\n    quiz: [\n      { jp: '{認知症|にんちしょう}の{中核症状|ちゅうかくしょうじょう}として、{正|ただ}しいものを1つ{選|えら}びなさい。',\n        id: 'Pilih 1 yang termasuk gejala inti demensia.', answer: 2,\n        opts: [\n          { jp: '{徘徊|はいかい}', id: 'Berkeliaran tanpa tujuan', reason: 'Termasuk BPSD, dipengaruhi lingkungan dan perasaan.' },\n          { jp: '{妄想|もうそう}', id: 'Delusi', reason: 'Termasuk BPSD, tidak muncul pada semua penderita.' },\n          { jp: '{見当識障害|けんとうしきしょうがい}', id: 'Gangguan orientasi', reason: 'Benar. Muncul langsung karena kerusakan otak.' },\n          { jp: '{暴言|ぼうげん}', id: 'Kata-kata kasar', reason: 'Termasuk BPSD, sering dipicu stres atau rasa tidak nyaman.' },\n          { jp: '{抑|よく}うつ', id: 'Depresi', reason: 'Termasuk BPSD.' } ],\n        explain: '見当識障害 muncul langsung karena kerusakan otak, jadi terma
