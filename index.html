      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    // its OWN frames — from local text at the root, or text obtained from

    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];

      const out = [];

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

          return;
        }

        console.error('Failed to decode asset ' + uuid + ':', err);

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

nan kaigo jika penyebabnya salah satu dari 16 penyakit ini.' },\n  kh_yobo: { kanji: '予防給付', read: 'よぼうきゅうふ', romaji: 'yobō kyūfu', arti: 'Manfaat pencegahan', desc: 'Manfaat asuransi untuk orang 要支援1–2. Tujuannya mencegah kondisi memburuk.' },\n  kh_chiiki: { kanji: '地域密着型サービス', read: 'ちいきみっちゃくがたサービス', romaji: 'chiiki micchakugata sābisu', arti: 'Layanan berbasis komunitas', desc: 'Layanan skala kecil untuk warga di kota itu sendiri. Ditunjuk oleh wali kota (市町村長), bukan gubernur.' },\n  kh_kaishu: { kanji: '住宅改修', read: 'じゅうたくかいしゅう', romaji: 'jūtaku kaishū', arti: 'Renovasi rumah', desc: 'Renovasi kecil seperti memasang pegangan atau menghapus beda tinggi lantai. Batas biaya dasar 200.000 yen.' },\n  kh_shien: { kanji: '居宅介護支援', read: 'きょたくかいごしえん', romaji: 'kyotaku kaigo shien', arti: 'Dukungan perawatan di rumah (pembuatan care plan)', desc: 'Care manager membuat rencana perawatan (ケアプラン) untuk orang 要介護. Pengguna tidak membayar biaya sendiri (asuransi menanggung 100%).' },\n  chukaku: { kanji: '中核症状', read: 'ちゅうかくしょうじょう', romaji: 'chūkaku shōjō', arti: 'Gejala inti', desc: 'Gejala yang muncul pada semua penderita demensia karena sel otak rusak. Pada dasarnya sulit disembuhkan.' },\n  kioku: { kanji: '記憶障害', read: 'きおくしょうがい', romaji: 'kioku shōgai', arti: 'Gangguan memori', desc: 'Sulit mengingat hal baru. Kejadian yang baru saja terjadi cepat terlupa, sedangkan kenangan lama lebih lama bertahan.' },\n  kentoshiki: { kanji: '見当識障害', read: 'けんとうしきしょうがい', romaji: 'kentōshiki shōgai', arti: 'Gangguan orientasi', desc: 'Tidak bisa mengenali waktu, tempat, atau orang. Biasanya hilang berurutan: waktu → tempat → orang.' },\n  jikko: { kanji: '実行機能障害', read: 'じっこうきのうしょうがい', romaji: 'jikkō kinō shōgai', arti: 'Gangguan fungsi eksekutif', desc: 'Tidak bisa merencanakan dan melakukan kegiatan sesuai urutan, misalnya memasak atau berganti pakaian.' },\n  bpsd: { kanji: '行動・心理症状', read: 'こうどう・しんりしょうじょう', romaji: 'kōdō shinri shōjō', arti: 'Gejala perilaku & psikologis (BPSD)', desc: 'Muncul karena gejala inti dipengaruhi lingkungan, kepribadian, dan kondisi tubuh. Bisa berkurang dengan perawatan yang tepat.' },\n  haikai: { kanji: '徘徊', read: 'はいかい', romaji: 'haikai', arti: 'Berkeliaran tanpa tujuan', desc: 'Berjalan ke sana kemari. Bagi penderita biasanya ada alasan, misalnya ingin pulang atau mencari sesuatu.' },\n  moso: { kanji: '妄想', read: 'もうそう', romaji: 'mōsō', arti: 'Delusi', desc: 'Meyakini hal yang tidak benar. Contoh yang sering muncul di ujian: 物盗られ妄想, merasa barangnya dicuri.' },\n  yokuutsu: { kanji: '抑うつ', read: 'よくうつ', romaji: 'yokuutsu', arti: 'Depresi, murung', desc: 'Perasaan sedih dan tidak bersemangat yang berlangsung lama. Termasuk BPSD.' }\n};\n\nconst LESSONS = {\n  'shakai-b11': { title: '社会福祉法関連', titleId: 'UU Kesejahteraan Sosial (第1章 3節 ⑪)', terms: [\"h11_0\",\"h11_1\",\"h11_2\",\"h11_3\",\"h11_4\",\"h11_5\",\"h11_6\",\"h11_7\",\"h11_8\",\"h11_9\",\"h11_10\",\"h11_11\",\"h11_12\",\"h11_13\",\"h11_14\",\"h11_15\",\"h11_16\",\"h11_17\",\"h11_18\",\"h11_19\",\"h11_20\",\"h11_21\",\"h11_22\",\"h11_23\",\"h11_24\",\"h11_25\"], sections: [{\"tag\":\"★ 重要度\",\"h\":\"{社会福祉法|しゃかいふくしほう}の{概要|がいよう}\",\"hid\":\"Gambaran UU Kesejahteraan Sosial\",\"jp\":\"「{社会福祉法|しゃかいふくしほう}」は、{社会福祉|しゃかいふくし}を{目的|もくてき}とする{事業|じぎょう}の{全分野|ぜんぶんや}に{共通|きょうつう}する{基本事項|きほんじこう}を{定|さだ}めた{法律|ほうりつ}です。\",\"id\":\"UU yang menetapkan hal dasar bersama untuk SEMUA bidang usaha kesejahteraan sosial.\",\"table\":{\"head\":[\"Hal\",\"Isi\"],\"rows\":[[\"目的\",\"Hal dasar bersama semua bidang; melindungi kepentingan pengguna & mendorong 地域福祉 → meningkatkan kesejahteraan sosial\"],[\"社会福祉事業\",\"Dibagi 第一種 dan 第二種\"],[\"基本的理念\",\"Pengguna tumbuh sehat jiwa-raga & hidup mandiri sesuai kemampuan → layanan harus BERKUALITAS dan TEPAT (良質かつ適切)\"],[\"提供の原則\",\"Menghormati kehendak pengguna; kerja sama dengan warga & layanan kesehatan-medis; menyediakan layanan secara TERPADU\"],[\"地方社会福祉審議会\",\"Di bawah gubernur/wali kota 指定都市・中核市; menjawab konsultasi & memberi pendapa \"],[\"慣習的\",\"3 対人的同調・よい子\",\"Mengikuti pendapat mayoritas\"],[\"慣習的\",\"4「法と秩序」\",\"Menjaga aturan & ketertiban sosial\"],[\"脱慣習的\",\"5 社会契約的な法律\",\"Setuju berdasarkan hak individu & nilai masyarakat\"],[\"脱慣習的\",\"6 普遍的な倫理的原理\",\"Menilai berdasarkan prinsip etika (hak & kesetaraan manusia)\"]]},\"tip\":\"Kata kunci: 罰→1, 損得→2, 多数意見→3, 規則→4, 合意→5, 倫理→6.\"},{\"tag\":\"★★★ 頻出\",\"h\":\"ライチャードの{高齢者|こうれいしゃ}の{人格|じんかく}の{分類|ぶんるい}\",\"hid\":\"5 tipe kepribadian lansia (Reichard)\",\"jp\":\"\",\"id\":\"3 tipe 適応 (bisa menyesuaikan diri) dan 2 tipe 不適応.\",\"table\":{\"head\":[\"\",\"Tipe\",\"Ciri\"],\"rows\":[[\"適応\",\"円熟型 (統合型)\",\"Menerima penuaan apa adanya; aktif ikut kegiatan sosial setelah pensiun\"],[\"適応\",\"依存型 (安楽いす型)\",\"Menerima keadaan tapi bergantung pada orang lain & pasif; senang pensiun karena bebas tanggung jawab\"],[\"適応\",\"防衛型 (装甲型)\",\"Menekan cemas akan penuaan dengan terus beraktivitas (自己防衛); rasa tanggung jawab kerja kuat\"],[\"不適応\",\"憤慨型 (外罰型)\",\"Tidak menerima masa lalu & penuaan; menyalahkan orang lain\"],[\"不適応\",\"自責型 (内罰型)\",\"Menganggap hidupnya gagal karena diri sendiri; tidak takut mati (dianggap pembebasan)\"]]},\"tip\":\"安楽いす = kursi santai → 依存型. 装甲 = baju baja → 防衛型. 外罰 = salahkan orang lain, 内罰 = salahkan diri sendiri.\"},{\"tag\":\"★★\",\"h\":\"プロダクティブ・エイジングなど\",\"hid\":\"Konsep penuaan positif & エイジズム\",\"jp\":\"\",\"id\":\"\",\"list\":[{\"k\":\"プロダクティブ・エイジング\",\"t\":\"Lansia ikut kegiatan produktif & berkontribusi ke masyarakat. Termasuk kerja, セルフケア, dan hobi.\"},{\"k\":\"サクセスフル・エイジング\",\"t\":\"Sadar & menerima penuaan sambil beradaptasi baik dengan kehidupan sosial → hari tua yang kaya.\"},{\"k\":\"アクティブ・エイジング\",\"t\":\"Terus ikut serta dalam masyarakat tanpa menurunkan kualitas hidup (QOL).\"},{\"k\":\"{社会情動的選択理論|しゃかいじょうどうてきせんたくりろん}\",\"t\":\"Makin tua, lingkup pergaulan dipersempit secara selektif: pengalaman emosi positif dimaksimalkan, risiko emosi diminimalkan.\"},{\"k\":\"エイジズム\",\"t\":\"Stereotip & diskriminasi terhadap ng. Tulang belakang (脊椎) = 26 ruas: 頸椎 7, 胸椎 12, 腰椎 5, 仙骨 1 (gabungan 5 仙椎), 尾骨 1. Ruas leher ke-1 = 環椎, ke-2 = 軸椎. 寛骨 = gabungan 腸骨・恥骨・坐骨.\",\"table\":{\"head\":[\"Tempat mudah patah (lansia)\",\"Arti\"],\"rows\":[[\"大腿骨頸部\",\"Leher tulang paha (jatuh → sering jadi 寝たきり)\"],[\"脊椎 (圧迫骨折)\",\"Tulang belakang\"],[\"上腕骨頸部\",\"Leher tulang lengan atas\"],[\"橈骨遠位端\",\"Ujung bawah tulang pengumpil (dekat pergelangan)\"]]},\"tip\":\"4 骨折 khas lansia (骨粗しょう症) sering keluar di ujian.\"},{\"tag\":\"★★ 重要\",\"h\":\"骨の成分と役割\",\"hid\":\"Komponen & fungsi tulang\",\"id\":\"骨膜 = selaput luar (ada saraf & pembuluh darah). 骨質 = mineral Ca & P + protein. 骨髄 = di dalam rongga 骨髄腔. 骨芽細胞 membentuk tulang, 破骨細胞 menghancurkan/menyerap tulang.\",\"table\":{\"head\":[\"役割\",\"Isi\"],\"rows\":[[\"支持\",\"Menopang kepala & organ\"],[\"保護\",\"Melindungi otak & organ dalam\"],[\"運動\",\"Otot berkontraksi, sendi jadi titik tumpu\"],[\"造血\",\"赤色骨髄 membuat sel darah merah, putih, trombosit\"],[\"貯蔵\",\"Menyimpan elektrolit Ca, P, Na, K\"]]}},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-2.webp\"],\"h\":\"筋肉と関節の動き\",\"hid\":\"Otot & gerakan sendi\",\"id\":\"Otot penting: 三角筋 (bahu), 大胸筋 (dada), 上腕二頭筋/三頭筋 (lengan atas), 腸腰筋 (pinggul dalam), 大殿筋 (bokong), 大腿四頭筋 (paha depan), 大腿二頭筋 (paha belakang). ヒラメ筋 + 腓腹筋 = 下腿三頭筋 → アキレス腱.\",\"table\":{\"head\":[\"Gerakan\",\"Otot\"],\"rows\":[[\"Siku 屈曲 (tekuk)\",\"上腕二頭筋\"],[\"Siku 伸展 (luruskan)\",\"上腕三頭筋\"],[\"Lutut 伸展\",\"大腿四頭筋\"],[\"Lutut 屈曲\",\"大腿二頭筋\"],[\"Pinggul 屈曲\",\"腸腰筋\"],[\"Pinggul 伸展\",\"大殿筋\"],[\"Bahu 外転 (angkat ke samping)\",\"三角筋\"],[\"Bahu 内転 (rapat ke badan)\",\"大胸筋\"]]},\"tip\":\"Pergelangan kaki: 伸展 = 背屈 (ujung kaki ke atas), 屈曲 = 底屈. Lengan bawah: 回外 (telapak ke atas) / 回内.\"},{\"tag\":\"★★ 重要\",\"h\":\"抗重力筋・筋肉の種類\",\"hid\":\"Otot anti-gravitasi & jenis otot\",\"id\":\"抗重力筋 = otot yang menjaga postur melawan gravitasi: 脊柱起立筋, 大殿筋, 大腿四頭筋, 下腿三頭筋 (lemah → mudah jatuh).\",\"table\":{\"head\":[\"Jenis\",\"Sifat\",\"Tempat\"],\"rows\":[[\"骨格筋\",\"随意筋 (bisa digerakkan sesuai kehendak)\",\"Lengan, kaki, perut, punggung\"],[\"平滑筋\",\"不随意筋 (内臓筋)\",\"Organ dalam, pembuluh darah\"],[\"心筋\",\"不随意筋, berdenyut ritmis seumur hidup\",\"Hanya jantung\"]]}},{\"tag\":\"★ 重要度\",\"h\":\"内臓の位置\",\"hid\":\"Letak organ dalam\",\"id\":\"横隔膜 memisahkan 胸腔 (paru-paru + jantung; di atasnya lewat 食道 & 気管) dan 腹腔. Bagian atas 腹腔: 胃, 肝臓, 胆のう, 膵臓, 脾臓. 腎臓 ada 2 (kiri-kanan) di sisi belakang 腹腔. Usus besar: 盲腸 → 上行結腸 → 横行結腸 → 下行結腸 → S状結腸 → 直腸 → 肛門.\"},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-5.webp\"],\"h\":\"脳の構造と働き\",\"hid\":\"Struktur & fungsi otak\",\"id\":\"Otak dilapisi 3 selaput (dari luar): 硬膜 → くも膜 → 軟膜. 大脳皮質 punya area 運動野, 体性感覚野, 視覚野, 聴覚野, 嗅覚野, 味覚野, 言語野.\",\"table\":{\"head\":[\"Bagian\",\"Fungsi\"],\"rows\":[[\"前頭葉\",\"運動野 (gerak sadar sisi tubuh berlawanan), ブローカ野 = 運動性言語中枢 (bicara), 意欲・意志\"],[\"頭頂葉\",\"体性感覚野 (raba, nyeri, suhu sisi berlawanan), 空間認知\"],[\"側頭葉\",\"情動, 記憶, ウェルニッケ野 = 感覚性言語中枢 (memahami bahasa)\"],[\"後頭葉\",\"視覚野 (penglihatan)\"],[\"大脳辺縁系\",\"Naluri & emosi; 海馬 = membentuk memori, 扁桃体 = emosi\"],[\"大脳基底核\",\"Belajar, motivasi, kognisi, pengaturan gerak\"],[\"視床\",\"Menyalurkan semua indra kecuali penciuman ke 大脳\"],[\"視床下部\",\"Pusat 自律神経: suhu tubuh, tidur, fungsi seksual\"],[\"中脳\",\"Pusat keseimbangan, postur, penglihatan\"],[\"橋\",\"Jalur relay saraf 大脳/小脳 ↔ perifer\"],[\"延髄\",\"Detak jantung, pembuluh darah, 呼吸, air liur, 嚥下, refleks muntah\"],[\"小脳\",\"Keseimbangan, refleks postur, mengatur gerak\"]]},\"tip\":\"ブローカ rusak → sulit bicara (運動性失語). ウェルニッケ rusak → sulit memahami (感覚性失語). 延髄 = pusat napas & menelan.\"},{\"tag\":\"★★ 重要\",\"h\":\"中枢神経と末梢神経\",\"hid\":\"Saraf pusat & tepi\",\"id\":\"中枢神経 = 脳 + 脊髄. 末梢神経 = 脳神経 12 pasang + 脊髄神経 31 pasang (頸 8, 胸 12, 腰 5, 仙骨 5, 尾骨 1). 末梢神経 dibagi: 体性神経 (運動神経 & 感覚神経 → otot rangka, gerak sadar) dan 自律神経 (交感 & 副交感 → otot tak sadar & kelenjar).\",\"table\":{\"head\":[\"脳神経\",\"Fungsi\"],\"rows\":[[\"① 嗅神経\",\"Penciuman\"],[\"② 視神経\",\"Penglihatan\"],[\"③ 動眼神経\",\"Gerak bola mata, atur pupil\"],[\"④ 滑車神経\",\"Bola mata ke bawah-dalam\"],[\"⑤ 三叉神経 ★\",\"Rasa di wajah, otot mengunyah\"],[\"⑥ 外転神経\",\"Bola mata ke samping luar\"],[\"⑦ 顔面神経\",\"Otot ekspresi, rasa lidah, air mata & liur\"],[\"⑧ 内耳神経\",\"Pendengaran & keseimbangan\"],[\"⑨ 舌咽神経\",\"Rasa, menelan, liur\"],[\"⑩ 迷走神経\",\"Atur organ dalam, menelan, suara\"],[\"⑪ 副神経\",\"Otot leher & bahu\"],[\"⑫ 舌下神経\",\"Gerak lidah\"]]}},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-7.webp\"],\"h\":\"交感神経と副交感神経\",\"hid\":\"Simpatis vs parasimpatis\",\"id\":\"Keduanya bekerja berlawanan (相反). 交感神経 = mode tegang/aktif (興奮). 副交感神経 = mode santai (リラックス).\",\"table\":{\"head\":[\"Organ\",\"交感神経\",\"副交感神経\"],\"rows\":[[\"呼吸\",\"Dangkal & cepat\",\"Dalam & pelan\"],[\"気道\",\"Melebar\",\"Menyempit\"],[\"血管\",\"Menyempit\",\"Melebar\"],[\"心拍\",\"Naik\",\"Turun\"],[\"血圧\",\"Naik\",\"Turun\"],[\"胃液\",\"Berkurang\",\"Bertambah\"],[\"腸 (cerna)\",\"Dihambat\",\"Dipercepat\"],[\"血糖\",\"Naik\",\"Turun\"],[\"排尿\",\"Dihambat\",\"Dipercepat\"],[\"免疫力\",\"Turun\",\"Naik\"],[\"瞳孔\",\"Membesar (散大)\",\"Mengecil (縮小)\"]]},\"tip\":\"Hafal: 交感 = pupil besar, jantung cepat, cerna & kencing berhenti.\"},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-8.webp\"],\"h\":\"心臓と血液循環\",\"hid\":\"Jantung & peredaran darah\",\"id\":\"Jantung punya 4 ruang: 右心房, 右心室, 左心房, 左心室. Katup: 三尖弁 (kanan), 僧帽弁 (kiri), 肺動脈弁, 大動脈弁. 冠動脈 memberi O₂ & nutrisi ke otot jantung. Sekali denyut ± 70–100 mL. 血圧: saat kontraksi = 最高血圧, saat relaksasi = 最低血圧. Listrik jantung (刺激伝導系): 洞房結節 (右心房) → ヒス束 → プルキンエ線維.\",\"table\":{\"head\":[\"Sirkulasi\",\"Jalur\"],\"rows\":[[\"肺循環\",\"右心室 → 肺動脈 (darah vena, O₂ rendah) → 肺 (tukar gas) → 肺静脈 (darah arteri, O₂ tinggi) → 左心房\"],[\"体循環\",\"左心室 → 大動脈 → seluruh tubuh → 大静脈 → 右心房\"]]},\"tip\":\"Jebakan ujian: 肺動脈 berisi darah VENA, 肺静脈 berisi darah ARTERI.\"},{\"tag\":\"★★ 重要\",\"h\":\"動脈と静脈・脈拍\",\"hid\":\"Arteri, vena & titik nadi\",\"id\":\"Titik untuk mengukur nadi: 総頸動脈 (leher), 上腕動脈 (siku dalam), 橈骨動脈 (pergelangan, paling umum), 大腿動脈 (pangkal paha), 膝窩動脈 (belakang lutut), 後脛骨動脈 (mata kaki dalam), 足背動脈 (punggung kaki). Vena tepi punya 弁 (katup) agar darah tidak mengalir balik.\"},{\"tag\":\"★★★ 頻出\",\"h\":\"血液の成分\",\"hid\":\"Komponen darah\",\"id\":\"Darah ± 7–8% berat badan. 血漿 ± 55% (air ± 90%, protein ± 7%). Protein plasma: アルブミン = nutrisi sel, グロブリン = imun, フィブリノゲン = pembekuan darah.\",\"table\":{\"head\":[\"細胞成分 (± 45%)\",\"Fungsi\",\"Jumlah /mm³\"],\"rows\":[[\"赤血球\",\"ヘモグロビン membawa O₂\",\"450–500 万\"],[\"白血球\",\"Melawan bakteri & benda asing\",\"4.000–9.000\"],[\"血小板\",\"Pembekuan & menghentikan darah\",\"20–50 万\"]]},\"tip\":\"白血球: リンパ球 (B細胞 = imun humoral, T細胞 & NK細胞 = imun seluler), 単球 (→ マクロファージ), 顆粒球 (好中球, 好酸球, 好塩基球).\"},{\"tag\":\"★ 重要度\",\"h\":\"リンパ系\",\"hid\":\"Sistem limfe\",\"id\":\"Cairan jaringan yang tidak terserap kapiler masuk ke pembuluh limfe → リンパ液. リンパ球 di dalamnya memproses virus, bakteri & sel rusak. リンパ節 = simpul penyaring racun & kuman; banyak di 頸部, 腋窩, 鼠径部. 胸管 membawa limfe tubuh bawah + kiri atas → 左静脈角; 右リンパ本幹 (kanan atas) → 右静脈角. 静脈角 = pertemuan 内頸静脈 & 鎖骨下静脈.\"},{\"tag\":\"★★★ 頻出\",\"h\":\"呼吸器\",\"hid\":\"Organ pernapasan\",\"id\":\"上気道 = hidung s/d 喉頭; 下気道 = 気管 ke bawah. Paru kanan 3 lobus, kiri 2 lobus. 外呼吸 = tukar gas udara ↔ darah di 肺胞; 内呼吸 = darah ↔ sel. Jalur udara: 鼻・口 → 咽頭 → 喉頭 → 気管 → 気管支 → 肺胞.\",\"table\":{\"head\":[\"Topik\",\"Isi\"],\"rows\":[[\"痰\",\"Sekret saluran napas + debu, bakteri; didorong ke tenggorokan oleh せん毛運動\"],[\"肺活量\",\"Tarik napas maksimal lalu buang maksimal. Pria 3.000–4.000 mL, wanita 2.000–3.000 mL\"],[\"残気量\",\"Udara sisa di paru; bertambah seiring usia\"],[\"吸息\",\"外肋間筋 & 横隔膜 kontraksi → dada mengembang\"],[\"呼息\",\"内肋間筋 kontraksi, 横隔膜 relaksasi\"]]}},{\"tag\":\"★★ 重要\",\"h\":\"口腔・歯・舌・唾液\",\"hid\":\"Mulut, gigi, lidah, air liur\",\"id\":\"Gigi permanen 28–32. 切歯 & 犬歯 = menggigit/memotong; 臼歯 = menggiling. 歯周病 = radang jaringan penyangga gigi → 歯周ポケット makin dalam → gigi lepas. Lidah untuk 咀嚼, 嚥下, 発声; rasa diterima 味蕾; 5 rasa dasar: 甘味, 苦味, 酸味, 塩味, うま味.\",\"table\":{\"head\":[\"Topik\",\"Isi\"],\"rows\":[[\"大唾液腺\",\"耳下腺, 顎下腺, 舌下腺\"],[\"唾液\",\"± 1 L/hari, > 99% air, ada enzim cerna & 抗菌作用\"],[\"口臭 生理的\",\"Bangun tidur, dehidrasi, liur sedikit\"],[\"口臭 食物\",\"Bawang putih, nira, rokok\"],[\"口臭 疾患\",\"Gigi berlubang, 歯周病, radang hidung, gangguan napas/cerna\"]]}},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-14.webp\"],\"h\":\"摂食・嚥下の5期\",\"hid\":\"5 tahap makan & menelan\",\"table\":{\"head\":[\"期\",\"Yang terjadi\"],\"rows\":[[\"① 先行期 (認知期)\",\"Mengenali bentuk, warna, bau makanan; liur keluar\"],[\"② 準備期 (咀嚼期)\",\"Memasukkan ke mulut, mengunyah, membentuk 食塊\"],[\"③ 口腔期\",\"食塊 didorong 舌 dari mulut ke 咽頭; 軟口蓋 menutup hidung\"],[\"④ 咽頭期\",\"嚥下反射 → 喉頭蓋 turun menutup saluran napas; 舌骨・喉頭 naik\"],[\"⑤ 食道期\",\"食塊 ke lambung oleh 蠕動運動, gravitasi, tekanan perut\"]]},\"tip\":\"Urutan 5 期 & kapan saluran napas tertutup (咽頭期) sangat sering keluar.\"},{\"tag\":\"★★★ 頻出\",\"fig\":[\"fig-d8-15.webp\"],\"h\":\"消化器と排便\",\"hid\":\"Organ pencernaan & BAB\",\"table\":{\"head\":[\"Organ\",\"Isi\"],\"rows\":[[\"胃\",\"噴門 → 胃底部 → 胃体部 → 幽門; menghasilkan 胃液\"],[\"小腸\",\"6–7 m: 十二指腸, 空腸, 回腸; cerna dengan 胆汁・膵液・腸液, serap nutrisi\"],[\"大腸\",\"± 1,5 m: 盲腸, 結腸, 直腸; serap air & elektrolit → 糞便\"],[\"肝臓\",\"Buat 胆汁; lewat 門脈 menyimpan nutrisi, detoks, memecah, mengatur darah\"],[\"胆のう\",\"Simpan 胆汁 → 十二指腸; bantu cerna lemak\"],[\"膵臓\",\"膵液 (enzim 3 nutrisi utama, basa lemah) + ランゲルハンス島 (インスリン, グルカゴン)\"]]},\"tip\":\"排便: makanan masuk lambung → 胃・結腸反射; 副交感神経 gerakkan 直腸; 内肛門括約筋 (tak sadar) lalu 外肛門括約筋 (sadar). ブリストル 7 tingkat: コロコロ便 → 硬い便 → やや硬い便 → 普通便 → やや軟らかい便 → 泥状便 → 水様便.\"},{\"tag\":\"★★ 重要\",\"h\":\"泌尿器と尿\",\"hid\":\"Organ kemih & urine\",\"table\":{\"head\":[\"Topik\",\"Isi\"],\"rows\":[[\"腎臓\",\"Menyaring darah: 糸球体 → ボウマンのう → 原尿 150–200 L/hari; 99% diserap ulang di 尿細管 → urine 1–2 L/hari\"],[\"尿管\",\"± 30 cm, 3 titik sempit → tempat 尿管結石\"],[\"膀胱\",\"Kapasitas ± 500 mL; ingin kencing saat 150–300 mL\"],[\"尿道\",\"Pria 16–18 cm, wanita ibagi usia)\",\"jp\":\"75{歳|さい}{未満|みまん}：{被用者保険|ひようしゃほけん}（{健康保険|けんこうほけん}・{船員保険|せんいんほけん}・{共済組合|きょうさいくみあい}）と{国民健康保険|こくみんけんこうほけん}（{市町村国保|しちょうそんこくほ}・{国保組合|こくほくみあい}）。75{歳|さい}{以上|いじょう}：{後期高齢者医療制度|こうきこうれいしゃいりょうせいど}。{参考|さんこう}：{生活保護|せいかつほご}の{人|ひと}は{医療扶助|いりょうふじょ}。\",\"id\":\"Pembagian utama berdasarkan USIA:\\n・Di bawah 75 tahun → (A) 被用者保険 (asuransi karyawan): 健康保険, 船員保険, 共済組合; atau (B) 国民健康保険: 市町村国保, 国保組合.\\n・75 tahun ke atas → 後期高齢者医療制度.\\n・Catatan: penerima 生活保護 memakai 医療扶助.\\n\\nJumlah peserta (Maret 2023): 協会けんぽ ±39,44 juta · 組合健保 ±28,2 juta · 日雇特例 ±16 ribu · 船員保険 ±110 ribu · 共済組合 ±9,83 juta · 市町村国保 ±24,13 juta · 国保組合 ±2,64 juta · 後期高齢者 ±19,14 juta · 医療扶助 ±1,71 juta.\"},{\"h\":\"★{頻出|ひんしゅつ} {健康保険|けんこうほけん}（{協会|きょうかい}けんぽ・{組合健保|くみあいけんぽ}・{日雇特例|ひやといとくれい}）\",\"hid\":\"健康保険: Kyōkai Kenpo, Kumiai Kenpo, pekerja harian\",\"jp\":\"{協会|きょうかい}けんぽ（{全国健康保険協会|ぜんこくけんこうほけんきょうかい}）：{中小企業等|ちゅうしょうきぎょうとう}のサラリーマンとその{家族|かぞく}が{加入|かにゅう}。{都道府県|とどうふけん}ごとに{保険料|ほけんりょう}が{異|こと}なる。{組合健保|くみあいけんぽ}：{大企業等|だいきぎょうとう}の{健康保険組合|けんこうほけんくみあい}が{保険者|ほけんしゃ}。{健康保険組合|けんこうほけんくみあい}ごとに{保険料|ほけんりょう}が{異|こと}なる。{日雇特例被保険者|ひやといとくれいひほけんしゃ}：{日々雇|ひびやと}い{入|い}れられる{人|ひと}や2か{月|げつ}{以内|いない}の{期間|きかん}を{定|さだ}めて{使用|しよう}される{人|ひと}。\",\"id\":\"・協会けんぽ: karyawan perusahaan KECIL-MENENGAH + keluarga. Iuran berbeda per PREFEKTUR.\\n・組合健保: perusahaan BESAR; penyelenggaranya 健康保険組合. Iuran berbeda per SERIKAT.\\n・日雇特例被保険者: pekerja harian atau kontrak ≤2 bulan.\\n\\nJebakan ujian: \\\"per prefektur\\\" = 協会けんぽ, \\\"per serikat\\\" = 組合健保.\"},{\"h\":\"{船員保険|せんいんほけん}・{共済組合|きょうさいくみあい}\",\"hid\":\"Asuransi pelaut & koperasi pegawai\",\"jp\":\"{船員保険|せんいんほけん}：{船舶所有者|せんぱくしょゆうしゃ}に{使用|しよう}される{者|もの}とその{家族|かぞく}が{対象|たいしょう}。{共済組合|きょうさいくみあい}：{国家公務員|こっかこうむいん}（20{共済組合|きょうさいくみあい}）、{地方公務員等|ちほうこうむいんとう}（64{共済組合|きょうさいくみあい}）、{私学教職員|しがくきょうしょくいん}（1{事業団|じぎょうだん}）。\",\"id\":\"・船員保険: orang yang dipekerjakan pemilik kapal + keluarganya.\\n・共済組合: pegawai negeri pusat (20 koperasi), pegawai daerah (64 koperasi), guru/staf sekolah swasta (1 badan).\"},{\"h\":\"{国民健康保険|こくみんけんこうほけん}\",\"hid\":\"Asuransi kesehatan nasional\",\"jp\":\"{市町村国民健康保険|しちょうそんこくみんけんこうほけん}：{都道府県|とどうふけん}および{市町村|しちょうそん}が{保険者|ほけんしゃ}。{被用者保険等|ひようしゃほけんとう}に{加入|かにゅう}していない{人|ひと}が{住所|じゅうしょ}を{有|ゆう}する{都道府県|とどうふけん}で{加入|かにゅう}する。{国民健康保険組合|こくみんけんこうほけんくみあい}：{医師|いし}、{弁護士|べんごし}など{同種|どうしゅ}の{事業|じぎょう}または{業務|ぎょうむ}に{従事|じゅうじ}する{人|ひと}で{組織|そしき}される。\",\"id\":\"・市町村国保: penyelenggara PREFEKTUR + KOTA (keduanya). Untuk orang yang tidak ikut asuransi karyawan (wiraswasta, petani, tidak bekerja, dll.); ikut di prefektur tempat tinggal.\\n・国保組合: dibentuk orang dengan pekerjaan sejenis, misalnya dokter dan pengacara.\"},{\"h\":\"★{頻出|ひんしゅつ} {後期高齢者医療制度|こうきこうれいしゃいりょうせいど}\",\"hid\":\"Sistem medis lansia tahap akhir\",\"jp\":\"{都道府県|とどうふけん}{単位|たんい}の{後期高齢者医療広域連合|こうきこうれいしゃいりょうこういきれんごう}が{運営主体|うんえいしゅたい}。75{歳|さい}{以上|いじょう}の{人|ひと}、65{歳|さい}{以上|いじょう}75{歳|さい}{未満|みまん}の{一定|いってい}の{障害認定|しょうがいにんてい}を{受|う}けた{人|ひと}が{加入|かにゅう}。\",\"id\":\"・Pelaksana: 後期高齢者医療広域連合 (gabungan wilayah per PREFEKTUR) — bukan kota, bukan negara.\\n・Peserta: usia 75+, ATAU usia 65–74 yang mendapat sertifikasi disabilitas tertentu.\\n・Tidak ada sistem tanggungan (被扶養者) — setiap orang menjadi peserta sendiri.\"},{\"h\":\"{生活保護|せいかつほご}と{医療|いりょう}（{医療扶助|いりょうふじょ}）\",\"hid\":\"Bantuan hidup & pengobatan\",\"jp\":\"{生活保護受給者|せいかつほごじゅきゅうしゃ}は、{国民健康保険|こくみんけんこうほけん}と{後期高齢者医療制度|こうきこうれいしゃいりょうせいど}への{加入|かにゅう}が{免除|めんじょ}される（{医療扶助|いりょうふじょ}で{医療|いりょう}を{受|う}けることができる）。\",\"id\":\"Penerima 生活保護 DIBEBASKAN dari 国保 dan 後期高齢者医療. Mereka berobat lewat 医療扶助 (salah satu jenis bantuan dalam 生活保護). Jumlah ±1,71 juta (rata-rata per bulan 2023).\"},{\"h\":\"★{頻出|ひんしゅつ} {被扶養者|ひふようしゃ}になれる{人|ひと}\",\"hid\":\"Siapa yang bisa jadi tanggungan\",\"jp\":\"{被用者保険|ひようしゃほけん}は、{被扶養者|ひふようしゃ}についても{保険給付|ほけんきゅうふ}の{対象|たいしょう}とする（{一定|いってい}の{要件|ようけん}あり）。{主|しゅ}として{被保険者|ひほけんしゃ}の{収入|しゅうにゅう}により{生計|せいけい}を{維持|いじ}されている、{原則|げんそく}{日本国内|にほんこくない}に{住所|じゅうしょ}がある{人|ひと}。{別居|べっきょ}でもよい：{直系尊属|ちょっけいそんぞく}、{配偶者|はいぐうしゃ}、{子|こ}、{孫|まご}、{兄弟姉妹|きょうだいしまい}。{同居|どうきょ}のみ：3{親等|しんとう}{以内|いない}の{親族|しんぞく}、{事実婚|じじつこん}の{配偶者|はいぐうしゃ}の{父母|ふぼ}および{子|こ}。\",\"id\":\"Tanggungan hanya ada di 被用者保険 (bukan di 国保 atau 後期高齢者).\\nSyarat: hidupnya terutama dari penghasilan peserta, dan prinsipnya tinggal di Jepang.\\n・Boleh TINGGAL TERPISAH: orang tua/kakek-nenek (直系尊属), pasangan, anak, cucu, saudara kandung.\\n・HARUS TINGGAL BERSAMA: kerabat lain sampai derajat 3 (paman, bibi, keponakan, mertua, dll.), serta orang tua dan anak dari pasangan de facto.\"},{\"h\":\"★{頻出|ひんしゅつ} ①{療養|りょうよう}の{給付|きゅうふ}（{自己負担割合|じこふたんわりあい}）\",\"hid\":\"(1) Manfaat pengobatan: persentase biaya sendiri\",\"jp\":\"{病院|びょういん}や{診療所|しんりょうじょ}で{医療|いりょう}を{受|う}けた{場合|ばあい}の{自己負担額|じこふたんがく}。75{歳|さい}{以上|いじょう}：1{割|わり}（{一定以上所得者|いっていいじょうしょとくしゃ}2{割|わり}、{現役並|げんえきな}み{所得者|しょとくしゃ}3{割|わり}）。70{歳|さい}{以上|いじょう}75{歳|さい}{未満|みまん}：2{割|わり}（{現役並|げんえきな}み{所得者|しょとくしゃ}3{割|わり}）。{義務教育就学|ぎむきょういくしゅうがく}〜70{歳|さい}{未満|みまん}：3{割|わり}。〜{義務教育就学前|ぎむきょういくしゅうがくまえ}：2{割|わり}。\",\"id\":\"Biaya yang dibayar sendiri saat berobat:\\n・75 tahun ke atas (termasuk 65–74 dengan sertifikasi disabilitas): 10% — berpenghasilan tertentu 20%, setara pekerja aktif 30%\\n・70–74 tahun: 20% — setara pekerja aktif 30%\\n・Usia sekolah wajib sampai 69 tahun: 30%\\n・Sebelum usia sekolah wajib: 20%\\nBerlaku untuk ketiga jenis (被用者・国保・高齢者).\"},{\"h\":\"②〜⑦ {入院|にゅういん}・{特別|とくべつ}な{療養|りょうよう}の{給付|きゅうふ}\",\"hid\":\"(2)–(7) Manfaat rawat inap & khusus\",\"jp\":\"②{入院時食事療養費|にゅういんじしょくじりょうようひ}：{入院時|にゅういんじ}の{食事療養費|しょくじりょうようひ}（{標準負担額|ひょうじゅんふたんがく}を{除|のぞ}く）。③{入院時生活療養費|にゅういんじせいかつりょうようひ}：{療養病床|りょうようびょうしょう}に{長期入院|ちょうきにゅういん}する65{歳|さい}{以上|いじょう}の{生活療養費|せいかつりょうようひ}（{食費|しょくひ}と{居住費|きょじゅうひ}）。④{保険外併用療養費|ほけんがいへいようりょうようひ}：{評価療養|ひょうかりょうよう}、{患者申出療養|かんじゃもうしでりょうよう}、{選定療養|せんていりょうよう}。⑤{訪問看護療養費|ほうもんかんごりょうようひ}：かかりつけ{医|い}の{指示|しじ}で{訪問看護|ほうもんかんご}ステーションの{看護師|かんごし}から{療養上|りょうようじょう}の{世話|せわ}や{診療|しんりょう}の{補助|ほじょ}。⑥{療養費|りょうようひ}：{被保険者証|ひほけんしゃしょう}を{提示|ていじ}できない、{保険医療機関以外|ほけんいりょうきかんいがい}で{受診|じゅしん}→{償還払|しょうかんばら}い。⑦{特別療養費|とくべつりょうようひ}：{保険料|ほけんりょう}の{滞納|たいのう}で{被保険者資格証明書|ひほけんしゃしかくしょうめいしょ}→{償還払|しょうかんばら}い。\",\"id\":\"② Biaya makan rawat inap (dikurangi beban standar).\\n③ Biaya hidup rawat inap: untuk 65+ yang RAWAT INAP LAMA di 療養病床 (biaya makan + tempat tinggal).\\n④ Perawatan gabungan dengan layanan di luar asuransi: 評価療養, 患者申出療養 (atas permintaan pasien), 選定療養.\\n⑤ Biaya kunjungan keperawatan: perawat dari 訪問看護ステーション membantu di rumah atas instruksi dokter.\\n⑥ 療養費: saat tidak bisa menunjukkan kartu asuransi, atau terpaksa berobat di luar lembaga asuransi → 償還払い.\\n⑦ 特別療養費: peserta yang MENUNGGAK iuran dan menerima 被保険者資格証明書 → 償還払い. Hanya 国保 dan 後期高齢者 (TIDAK ada di asuransi karyawan).\\n\\n償還払い = bayar penuh dulu (talangan), lalu klaim bagian asuransi kemudian.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑧〜⑬ {現金給付|げんきんきゅうふ}\",\"hid\":\"(8)–(13) Manfaat uang tunai\",\"jp\":\"⑧{出産育児一時金|しゅっさんいくじいちじきん}：1{児|じ}につき50{万円|まんえん}（{被用者|ひようしゃ}・{国保|こくほ}）。⑨{家族療養費等|かぞくりょうようひとう}：{被扶養者|ひふようしゃ}への{給付|きゅうふ}（{被用者|ひようしゃ}のみ）。⑩{傷病手当金|しょうびょうてあてきん}：{標準報酬日額|ひょうじゅんほうしゅうにちがく}の3{分|ぶん}の2を{休業|きゅうぎょう}4{日目|にちめ}から{通算|つうさん}1{年|ねん}6か{月|げつ}（{被用者|ひようしゃ}のみ）。⑪{出産手当金|しゅっさんてあてきん}：{出産日|しゅっさんび}{以前|いぜん}42{日|にち}＋{出産後|しゅっさんご}56{日|にち}、3{分|ぶん}の2（{被用者|ひようしゃ}のみ）。⑫{移送費|いそうひ}：{償還払|しょうかんばら}い。⑬{埋葬料|まいそうりょう}5{万円|まんえん}（{健康保険|けんこうほけん}）、{葬祭費|そうさいひ}（{国保|こくほ}、{自治体|じちたい}により{異|こと}なる）。\",\"id\":\"⑧ 出産育児一時金: 500.000 yen per bayi (melahirkan di fasilitas yang ikut sistem kompensasi kebidanan). Ada di asuransi karyawan dan 国保.\\n⑨ 家族療養費: manfaat yang sama untuk tanggungan (kecuali 傷病手当金 dan 出産手当金). Hanya asuransi karyawan.\\n⑩ 傷病手当金: tidak bisa bekerja karena sakit dan tidak digaji → 2/3 gaji harian standar, mulai HARI KE-4, total maksimal 1 TAHUN 6 BULAN. Hanya asuransi karyawan.\\n⑪ 出産手当金: cuti melahirkan tanpa gaji → 42 hari sebelum + 56 hari setelah melahirkan, 2/3 gaji harian. Hanya asuransi karyawan.\\n⑫ 移送費: biaya dipindahkan untuk berobat → 償還払い.\\n⑬ 埋葬料 50.000 yen (健康保険) / 葬祭費 (国保, beda per daerah).\\n\\nKunci: ⑨⑩⑪ HANYA 被用者保険. ⑦ TIDAK ada di 被用者. ⑧ tidak ada di 後期高齢者.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑭{高額療養費|こうがくりょうようひ}\",\"hid\":\"(14) Biaya pengobatan mahal\",\"jp\":\"1か{月|げつ}あたりの{医療費|いりょうひ}が{上限額|じょうげんがく}を{超|こ}える{場合|ばあい}に、その{超|こ}えた{額|がく}を{支給|しきゅう}。{上限|じょうげん}は{所得区分|しょとくくぶん}と{年齢|ねんれい}で{異|こと}なる。{例|れい}：{標準報酬月額|ひょうじゅんほうしゅうげつがく}83{万円以上|まんえんいじょう}＝252,600{円|えん}＋（{総医療費|そういりょうひ}−842,000{円|えん}）×1%。26{万円以下|まんえんいか}＝57,600{円|えん}（70{歳以上|さいいじょう}の{外来|がいらい}18,000{円|えん}、{年|ねん}144,000{円上限|えんじょうげん}）。{低所得者|ていしょとくしゃ}＝70{歳未満|さいみまん}35,400{円|えん}、70{歳以上|さいいじょう}15,000{円|えん}または24,600{円|えん}、{外来|がいらい}8,000{円|えん}。\",\"id\":\"Jika biaya medis dalam 1 BULAN melebihi batas atas, kelebihannya dikembalikan. Batas tergantung penghasilan dan usia (untuk 70+ berlaku sejak Agustus 2018):\\n・Gaji bulanan standar ≥830 ribu: 252.600 + (total biaya − 842.000) × 1%\\n・≥530 ribu: 167.400 + (total − 558.000) × 1%\\n・≥280 ribu: 80.100 + (total − 267.000) × 1%\\n・≤260 ribu: 57.600 yen (70+ rawat jalan per orang 18.000 yen, maks. 144.000/tahun)\\n・Berpenghasilan rendah (bebas pajak penduduk): di bawah 70 = 35.400; 70+ rumah tangga = 15.000 atau 24.600; 70+ rawat jalan = 8.000 yen.\\n\\nYang perlu diingat: satuan PER BULAN, dan batas lebih rendah untuk penghasilan rendah dan lansia.\"},{\"h\":\"★{頻出|ひんしゅつ} ⑮{高額介護合算療養費|こうがくかいごがっさんりょうようひ}\",\"hid\":\"(15) Gabungan medis & kaigo mahal\",\"jp\":\"{各医療保険|かくいりょうほけん}における{世帯内|せたいない}で、{医療保険|いりょうほけん}・{介護保険|かいごほけん}の{両制度|りょうせいど}の{自己負担額|じこふたんがく}の{合計額|ごうけいがく}が1{年間|ねんかん}に{一定|いってい}の{上限額|じょうげんがく}を{超|こ}えた{場合|ばあい}に{支給|しきゅう}（{介護保険|かいごほけん}からは{高額医療合算介護|こうがくいりょうがっさんかいご}サービス{費|ひ}が{支給|しきゅう}される）。\",\"id\":\"Jika TOTAL biaya sendiri medis + kaigo dalam satu RUMAH TANGGA selama 1 TAHUN melebihi batas → dikembalikan. Dari sisi asuransi medis namanya 高額介護合算療養費; dari sisi asuransi kaigo namanya 高額医療合算介護サービス費.\\n\\nBedakan: 高額療養費 = per BULAN, medis saja. 高額介護合算療養費 = per TAHUN, medis + kaigo.\"},{\"h\":\"{給付|きゅうふ}の{対象|たいしょう}まとめ（{被用者|ひようしゃ}・{国保|こくほ}・{高齢|こうれい}）\",\"hid\":\"Ringkasan: manfaat mana ada di asuransi mana\",\"jp\":\"{保険者|ほけんしゃ}の{種類|しゅるい}によって{給付内容|きゅうふないよう}が{異|こと}なる。\",\"id\":\"Tabel ringkas (○ = ada):\\n・①〜⑥, ⑫, ⑬, ⑭, ⑮: ada di ketiganya (被用者・国保・後期高齢者)\\n・⑦ 特別療養費: 国保 dan 後期高齢者 saja\\n・⑧ 出産育児一時金: 被用者 dan 国保 saja\\n・⑨ 家族療養費, ⑩ 傷病手当金, ⑪ 出産手当金: 被用者 saja\\n\\nJadi pekerja wiraswasta (国保) tidak mendapat 傷病手当金.\"},{\"h\":\"★{頻出|ひんしゅつ} {国民医療費|こくみんいりょうひ}\",\"hid\":\"Biaya medis nasional\",\"jp\":\"{国民医療費|こくみんいりょうひ}は、{医療機関等|いりょうきかんとう}における{保険診療|ほけんしんりょう}の{対象|たいしょう}となる{傷病|しょうびょう}の{治療|ちりょう}（{正常|せいじょう}な{妊娠|にんしん}・{分娩|ぶんべん}や{健康|けんこう}の{維持|いじ}・{増進|ぞうしん}を{目的|もくてき}とした{健康診断|けんこうしんだん}・{予防接種|よぼうせっしゅ}などは{除|のぞ}く）に{要|よう}した{費用|ひよう}を{推計|すいけい}したもの。2022（{令和|れいわ}4）{年度|ねんど}は{約|やく}47{兆円|ちょうえん}、{一人当|ひとりあ}たりは{約|やく}37{万円|まんえん}。\",\"id\":\"Perkiraan biaya pengobatan penyakit/cedera yang ditanggung asuransi.\\nTIDAK termasuk: kehamilan dan persalinan normal, pemeriksaan kesehatan, vaksinasi.\\nTahun 2022 (Reiwa 4): ±47 triliun yen; per orang ±370 ribu yen. Grafik sejak 1955 (Showa 30) terus NAIK (増加傾向).\\n\\nBedakan dengan 社会保障給付費 (±134–138 triliun yen, mencakup pensiun, medis, kesejahteraan).\",\"fig\":[\"fig-d3-12.webp\"]},{\"h\":\"{医療圏|いりょうけん}\",\"hid\":\"Wilayah pelayanan medis\",\"jp\":\"{一次医療圏|いちじいりょうけん}（{市町村|しちょうそん}）：{病院|びょういん}・{診療所|しんりょうじょ}。{二次医療圏|にじいりょうけん}（{複数|ふくすう}の{市町村|しちょうそん}）：{地域医療支援病院|ちいきいりょうしえんびょういん}が{病院|びょういん}・{診療所|しんりょうじょ}の{後方支援|こうほうしえん}。{三次医療圏|さんじいりょうけん}（{都道府県|とどうふけん}）：{特定機能病院|とくていきのうびょういん}が{高度|こうど}な{医療|いりょう}を{提供|ていきょう}。\",\"id\":\"・一次医療圏 = KOTA: rumah sakit dan klinik sehari-hari.\\n・二次医療圏 = BEBERAPA KOTA: 地域医療支援病院 mendukung RS dan klinik.\\n・三次医療圏 = PREFEKTUR: 特定機能病院 memberikan pengobatan tingkat tinggi.\"},{\"h\":\"★{頻出|ひんしゅつ} {医療提供施設|いりょうていきょうしせつ}（{医療法|いりょうほう}・{介護保険法|かいごほけんほう}）\",\"hid\":\"Fasilitas penyedia layanan medis\",\"jp\":\"{病院|びょういん}：{医師|いし}または{歯科医師|しかいし}が{医業|いぎょう}を{行|おこな}う{場所|ばしょ}で、20{人以上|にんいじょう}の{入院施設|にゅういんしせつ}。{病床|びょうしょう}の{種類|しゅるい}：①{精神病床|せいしんびょうしょう}②{感染症病床|かんせんしょうびょうしょう}③{結核病床|けっかくびょうしょう}④{療養病床|りょうようびょうしょう}⑤{一般病床|いっぱんびょうしょう}。{特定機能病院|とくていきのうびょういん}：{高度先端医療|こうどせんたんいりょう}、{厚生労働大臣|こうせいろうどうだいじん}の{承認|しょうにん}（{大学病院|だいがくびょういん}{本院|ほんいん}、{国立|こくりつ}がんセンター、{国立循環器病研究|こくりつじゅんかんきびょうけんきゅう}センターなど）。{地域医療支援病院|ちいきいりょうしえんびょういん}：{都道府県知事|とどうふけんちじ}の{承認|しょうにん}。{診療所|しんりょうじょ}：{入院施設|にゅういんしせつ}なし、または19{人以下|にんいか}。{在宅療養支援診療所|ざいたくりょうようしえんしんりょうじょ}：24{時間往診|じかんおうしん}・24{時間訪問看護|じかんほうもんかんご}が{可能|かのう}。{介護老人保健施設|かいごろうじんほけんしせつ}・{介護医療院|かいごいりょういん}（2018{年度|ねんど}〜）：{介護保険法|かいごほけんほう}。{薬局|やっきょく}：{薬剤師|やくざいし}が{調剤|ちょうざい}を{行|おこな}う{場所|ばしょ}。\",\"id\":\"・病院 (rumah sakit): 20 tempat tidur atau LEBIH.\\n・5 jenis tempat tidur: jiwa, penyakit menular, TBC, perawatan jangka panjang (療養), umum.\\n・特定機能病院: pengobatan canggih; disetujui MENTERI Kesehatan (contoh: RS universitas utama, Pusat Kanker Nasional, Pusat Penyakit Kardiovaskular Nasional).\\n・地域医療支援病院: mendukung RS/klinik daerah; disetujui GUBERNUR.\\n・診療所 (klinik): tanpa rawat inap, atau 19 tempat tidur ke BAWAH.\\n・在宅療養支援診療所: klinik yang bisa kunjungan dokter 24 jam dan menjamin kunjungan keperawatan 24 jam.\\n・介護老人保健施設 dan 介護医療院 (sejak 2018): fasilitas menurut UU ASURANSI KAIGO, bukan UU Medis.\\n・薬局: tempat apoteker meracik obat.\"},{\"h\":\"★{頻出|ひんしゅつ} {難病|なんびょう}と{指定難病|していなんびょう}\",\"hid\":\"Penyakit langka & 指定難病\",\"jp\":\"2015（{平成|へいせい}27）{年|ねん}1{月|がつ}1{日|にち}、「{難病|なんびょう}の{患者|かんじゃ}に{対|たい}する{医療等|いりょうとう}に{関|かん}する{法律|ほうりつ}」が{施行|しこう}。{難病|なんびょう}とは、{発病|はつびょう}の{機構|きこう}が{明|あき}らかでなく、{治療方法|ちりょうほうほう}が{確立|かくりつ}していない{希少|きしょう}な{疾病|しっぺい}であり、{長期|ちょうき}にわたり{療養|りょうよう}を{必要|ひつよう}とするもの。{指定難病|していなんびょう}：①{患者数|かんじゃすう}が{一定|いってい}の{人数|にんずう}に{達|たっ}していない（{人口|じんこう}の0.1%{程度未満|ていどみまん}）②{客観的|きゃっかんてき}な{診断基準|しんだんきじゅん}が{確立|かくりつ}。2025（{令和|れいわ}7）{年|ねん}4{月|がつ}から348{疾患|しっかん}。\",\"id\":\"UU tentang pengobatan pasien penyakit langka berlaku 1 Januari 2015.\\n難病 = (1) mekanisme timbulnya belum jelas, (2) cara pengobatan belum mapan, (3) jarang, (4) butuh pengobatan jangka panjang.\\n指定難病 (menerima bantuan biaya medis) = 難病 yang memenuhi: jumlah pasien di bawah ±0,1% penduduk DAN ada kriteria diagnosis objektif.\\nSejak April 2025: 348 penyakit.\"},{\"h\":\"{特定医療費|とくていいりょうひ}と{難病相談支援|なんびょうそうだんしえん}センター\",\"hid\":\"Biaya medis khusus & pusat konsultasi\",\"jp\":\"{特定医療費|とくていいりょうひ}の{支給|しきゅう}：{医療保険|いりょうほけん}（{保険適用分|ほけんてきようぶん}の{医療費|いりょうひ}、{入院時食事療養費|にゅういんじしょくじりょうようひ}、{入院時生活療養費|にゅういんじせいかつりょうようひ}）、{介護保険|かいごほけん}（{訪問看護|ほうもんかんご}、{訪問|ほうもん}リハビリテーション、{居宅療養管理指導|きょたくりょうようかんりしどう}、{介護医療院|かいごいりょういん}など）。{医療保険|いりょうほけん}・{介護保険|かいごほけん}の{給付|きゅうふ}を{優先|ゆうせん}（{保険優先制度|ほけんゆうせんせいど}）。{自己負担上限額|じこふたんじょうげんがく}を{超|こ}える{部分|ぶぶん}を{公費負担|こうひふたん}。{都道府県|とどうふけん}は{難病相談支援|なんびょうそうだんしえん}センターを{設置|せっち}できる。\",\"id\":\"・Yang ditanggung 特定医療費: dari asuransi medis (biaya berobat, makan dan hidup saat rawat inap) dan asuransi kaigo (kunjungan keperawatan, rehabilitasi kunjungan, 居宅療養管理指導, 介護医療院, dll.).\\n・ASURANSI DIDAHULUKAN (保険優先制度); bagian di atas 自己負担上限額 (batas sesuai penghasilan) ditanggung DANA PUBLIK.\\n・PREFEKTUR BISA (tidak wajib) mendirikan 難病相談支援センター: konsultasi telepon/tatap muka untuk pasien dan keluarga, memberi informasi dan saran.\"},{\"h\":\"{指定難病|していなんびょう}の{主|おも}な{例|れい}（{受給者数|じゅきゅうしゃすう}）\",\"hid\":\"Contoh 指定難病 (jumlah penerima)\",\"jp\":\"パーキンソン{病|びょう}147,481（60{歳以上|さいいじょう}95%）、{潰瘍性大腸炎|かいようせいだいちょうえん}146,702（0〜59{歳|さい}70%）、{全身性|ぜんしんせい}エリテマトーデス66,307、クローン{病|びょう}52,108（0〜59{歳|さい}85%）、{後縦靱帯骨化症|こうじゅうじんたいこっかしょう}31,733、{重症筋無力症|じゅうしょうきんむりょくしょう}27,371、{脊髄小脳変性症|せきずいしょうのうへんせいしょう}26,578、{多発性硬化症|たはつせいこうかしょう}24,105、{網膜色素変性症|もうまくしきそへんせいしょう}20,687、{進行性核上性麻痺|しんこうせいかくじょうせいまひ}13,355（60{歳以上|さいいじょう}99%）、{多系統萎縮症|たけいとういしゅくしょう}10,528、{筋萎縮性側索硬化症|きんいしゅくせいそくさくこうかしょう}（ALS）9,727、{悪性関節|あくせいかんせつ}リウマチ4,825、{前頭側頭葉変性症|ぜんとうそくとうようへんせいしょう}1,449、プリオン{病|びょう}448。348{疾患|しっかん}の{合計|ごうけい}1,086,579{人|にん}。\",\"id\":\"Pemegang sertifikat terbanyak:\\n1. パーキンソン病 (Parkinson) ±147 ribu — 95% usia 60+\\n2. 潰瘍性大腸炎 (kolitis ulseratif) ±147 ribu — 70% di bawah 60\\n3. 全身性エリテマトーデス (lupus) ±66 ribu\\n4. クローン病 (Crohn) ±52 ribu — 85% di bawah 60\\nLainnya: 後縦靱帯骨化症, 重症筋無力症 (myasthenia gravis), 脊髄小脳変性症, 多発性硬化症 (MS), 網膜色素変性症, 進行性核上性麻痺 (99% usia 60+), 多系統萎縮症, ALS (±9.700), 悪性関節リウマチ, 前頭側頭葉変性症, プリオン病.\\nTotal 348 penyakit: ±1,09 juta orang (43% di bawah 60, 57% usia 60+).\"},{\"tag\":\"★ 頻出\",\"h\":\"{健康日本|けんこうにっぽん}21（{第三次|だいさんじ}）\",\"hid\":\"Gerakan Kesehatan Nasional ke-3\",\"jp\":\"{全|すべ}ての{国民|こくみん}が{健|すこ}やかで{心豊|こころゆた}かに{生活|せいかつ}できる{持続可能|じぞくかのう}な{社会|しゃかい}の{実現|じつげん}を{目指|めざ}します。{計画期間|けいかくきかん}は{令和|れいわ}6（2024）{年度|ねんど}から{令和|れいわ}17（2035）{年度|ねんど}までの12{年間|ねんかん}です。\",\"id\":\"Tujuan tertinggi: memperpanjang umur sehat dan memperkecil kesenjangan kesehatan. Periode 2024–2035 (12 tahun).\",\"table\":{\"head\":[\"Bidang\",\"Target utama\"],\"rows\":[[\"1. 健康寿命の延伸・健康格差の縮小\",\"Umur sehat lebih panjang, kesenjangan lebih kecil\"],[\"2. 個人の行動と健康状態の改善\",\"Gaya hidup: gizi, olahraga, istirahat & tidur, alkohol, rokok, gigi-mulut · penyakit gaya hidup (NCDs): kanker, kardiovaskular, diabetes, COPD · fungsi hidup: ロコモティブシンドローム, pemeriksaan osteoporosis, tekanan psikologis\"],[\"3. 社会環境の質の向上\",\"Hubungan sosial, makan bersama (共食), kesehatan jiwa · lingkungan yang membuat sehat secara alami (kota enak dijalani, cegah rokok pasif) · Smart Life Project, 健康経営\"],[\"4. ライフコースアプローチ\",\"Anak: olahraga, obesitas, alkohol & rokok <20 th · lansia: kurang gizi, lokomotif, kegiatan sosial · wanita: terlalu kurus, alkohol, rokok saat hamil\"]]},\"tip\":\"Periode 12 tahun (2024–2035). Pendekatan baru: ライフコースアプローチ.\"},{\"tag\":\"★ 頻出\",\"h\":\"{平均寿命|へいきんじゅみょう}と{健康寿命|けんこうじゅみょう}・{健康|けんこう}の{用語|ようご}\",\"hid\":\"Harapan hidup & umur sehat\",\"jp\":\"2022（{令和|れいわ}4）{年|ねん}{時点|じてん}で、{平均寿命|へいきんじゅみょう}と{健康寿命|けんこうじゅみょう}の{差|さ}は{男性|だんせい}8.48{年|ねん}、{女性|じょせい}11.64{年|ねん}です。この{差|さ}が{大|おお}きいほど、「{不健康|ふけんこう}な{期間|きかん}」が{長|なが}くなります。\",\"id\":\"Selisih harapan hidup dan umur sehat = masa hidup TIDAK sehat (terbatas).\",\"table\":{\"head\":[\"\",\"Harapan hidup\",\"Umur sehat\",\"Selisih\"],\"rows\":[[\"Pria\",\"81,05\",\"72,57\",\"8,48 tahun\"],[\"Wanita\",\"87,09\",\"75,45\",\"11,64 tahun\"]]},\"list\":[{\"k\":\"WHOの{健康|けんこう}の{定義|ていぎ}\",\"t\":\"Bukan sekadar tidak sakit atau lemah, tetapi keadaan SEJAHTERA secara FISIK, MENTAL, dan SOSIAL.\"},{\"k\":\"{健康寿命|けんこうじゅみょう}\",\"t\":\"Masa hidup mandiri yang sehat TANPA perlu perawatan sehari-hari.\"},{\"k\":\"ロコモティブシンドローム（{運動器症候群|うんどうきしょうこうぐん}）\",\"t\":\"Fungsi alat gerak MENURUN sehingga berisiko perlu perawatan atau terbaring.\"},{\"k\":\"メタボリックシンドローム（{内臓脂肪症候群|ないぞうしぼうしょうこうぐん}）\",\"t\":\"Obesitas perut + tekanan darah tinggi / gula darah tinggi / gangguan lemak → mudah terkena penyakit jantung, stroke.\"},{\"k\":\"BMI\",\"t\":\"Berat (kg) ÷ tinggi (m)². Menurut 日本肥満学会: 22 = standar, 25+ = obesitas, <18,5 = berat kurang.\"}],\"tip\":\"Selisih wanita (11,64) lebih besar dari pria (8,48).\"},{\"tag\":\"★ 頻出\",\"h\":\"{健康増進法|けんこうぞうしんほう}と{健康診査|けんこうしんさ}\",\"hid\":\"UU Promosi Kesehatan & pemeriksaan kesehatan\",\"jp\":\"{健康増進法|けんこうぞうしんほう}は、{国民|こくみん}の{健康|けんこう}の{増進|ぞうしん}を{総合的|そうごうてき}に{推進|すいしん}し、{国民保健|こくみんほけん}の{向上|こうじょう}を{図|はか}ります。\",\"id\":\"Isi UU Promosi Kesehatan:\",\"table\":{\"head\":[\"Hal\",\"Isi\"],\"rows\":[[\"Kebijakan dasar\",\"Ditetapkan 厚生労働大臣\"],[\"Bimbingan kesehatan\",\"市町村: konsultasi & bimbingan perbaikan gizi dan gaya hidup\"],[\"Cegah rokok pasif\",\"SIAPA PUN dilarang merokok di tempat larangan merokok tanpa alasan sah\"],[\"Standar asupan makanan\",\"食事摂取基準 ditetapkan 厚生労働大臣\"],[\"特定健康診査 (WAJIB)\",\"Usia 40–74 (peserta asuransi medis); oleh penyelenggara asuransi; tujuan: METABOLIK\"],[\"健康診査 (BERUSAHA)\",\"Usia 75+ (後期高齢者); oleh 広域連合; tujuan: FRAIL (フレイル)\"]]},\"tip\":\"40–74 = 特定健診 (metabolik). 75+ = 健診 (frail).\"},{\"tag\":\"★ 頻出\",\"h\":\"メタボリックシンドロームの{診断基準|しんだんきじゅん}\",\"hid\":\"Kriteria sindrom metabolik\",\"jp\":\"{腹囲|ふくい}が{男性|だんせい}85cm{以上|いじょう}、{女性|じょせい}90cm{以上|いじょう}で、{次|つぎ}の①〜③のうち2つ{以上|いじょう}に{該当|がいとう}する{状態|じょうたい}です。\",\"id\":\"Lingkar perut pria ≥85 cm / wanita ≥90 cm, DITAMBAH 2 atau lebih dari 3 kondisi berikut:\",\"table\":{\"head\":[\"Kriteria\",\"Batas\"],\"rows\":[[\"① Gula darah tinggi\",\"Gula darah puasa ≥110 mg/dL (atau HbA1c ≥6,0%)\"],[\"② Tekanan darah tinggi\",\"Sistolik ≥130 dan/atau diastolik ≥85 mmHg\"],[\"③ Gangguan lemak\",\"Trigliserida ≥150 mg/dL dan/atau HDL <40 mg/dL\"]]},\"list\":[{\"k\":\"{特定保健指導|とくていほけんしどう}\",\"t\":\"Sesuai jumlah risiko dari 特定健診.\"},{\"k\":\"{動機|どうき}づけ{支援|しえん}\",\"t\":\"Risiko SEDANG: wawancara untuk menumbuhkan mo ungi haknya dan meningkatkan kualitas hidup.\"},{\"k\":\"バリアフリー\",\"t\":\"MENGHILANGKAN hambatan (barrier) dalam kehidupan sosial penyandang disabilitas.\"}],\"tip\":\"Inklusi sosial = untuk SEMUA orang. Advokasi = 代弁 (mewakili suara).\"},{\"tag\":\"★ 頻出\",\"h\":\"ユニバーサルデザインの7{原則|げんそく}\",\"hid\":\"7 prinsip desain universal\",\"jp\":\"ユニバーサルデザインとは、{年齢|ねんれい}や{障害|しょうがい}の{有無|うむ}などにかかわらず、すべての{人|ひと}が{使|つか}いやすいように{施設|しせつ}や{製品|せいひん}などをデザインすることです。\",\"id\":\"Desain yang sejak awal mudah dipakai SEMUA orang. Bedanya dengan barrier-free: barrier-free menghilangkan hambatan yang SUDAH ada.\",\"table\":{\"head\":[\"No.\",\"Prinsip\",\"Arti\"],\"rows\":[[\"1\",\"公平\",\"Siapa saja bisa memakai secara adil\"],[\"2\",\"好みや能力に合う\",\"Sesuai selera dan kemampuan pemakai (fleksibel)\"],[\"3\",\"簡単\",\"Cara pakai sederhana, langsung dipahami\"],[\"4\",\"情報がすぐ理解できる\",\"Informasi yang perlu langsung dimengerti\"],[\"5\",\"ミスが危険につながらない\",\"Kesalahan kecil tidak berbahaya\"],[\"6\",\"少ない力で楽に\",\"Tanpa beban berlebih, tenaga kecil\"],[\"7\",\"大きさと広さ\",\"Ukuran dan ruang cukup untuk siapa saja\"]]},\"tip\":\"\\\"Keindahan desain\\\" dan \\\"khusus lansia\\\" bukan bagian dari 7 prinsip (keluar di ujian ke-38).\"},{\"tag\":\"★ 頻出\",\"h\":\"フランクルの3つの{価値|かち}とケアの{本質|ほんしつ}\",\"hid\":\"3 nilai Frankl & hakikat perawatan\",\"jp\":\"フランクルは、{人間|にんげん}が{実現|じつげん}できる{価値|かち}を3つに{分類|ぶんるい}しました。\",\"id\":\"Tiga nilai yang bisa diwujudkan manusia:\",\"table\":{\"head\":[\"Nilai\",\"Arti\"],\"rows\":[[\"創造価値\",\"Diwujudkan dengan MENCIPTAKAN sesuatu\"],[\"体験価値\",\"Diwujudkan dengan MENGALAMI sesuatu\"],[\"態度価値\",\"Diwujudkan dari SIKAP yang diambil saat hidup DIBATASI (sakit berat, dll.)\"]]},\"list\":[{\"k\":\"ミルトン・メイヤロフ『ケアの{本質|ほんしつ}』\",\"t\":\"\\\"Merawat seseorang dalam arti terdalam adalah membantu orang itu TUMBUH dan mewujudkan dirinya (自己実現).\\\"\"}],\"tip\":\"Situasi \\\"hidup terbatas\\\" → 態度価値. Mayeroff = ケアの本質.\"},{\"tag\":\"★ 頻出\",\"h\":\"{人権運動|じんけんうんどう}の{歴史|れきし}\",\"hid\":\"Sejarah gerakan HAM dis ngguna & 社協\"],[\"Cek kemampuan\",\"Surat penilaian/diagnosis dokter ke 家庭裁判所\",\"「契約締結判定ガイドライン」; jika sulit → diperiksa 契約締結審査会\"],[\"Penentuan bantuan\",\"Oleh 家庭裁判所\",\"Oleh pengguna bersama 社協\"],[\"Pemberi bantuan\",\"後見人・保佐人・補助人・任意後見人\",\"専門員・生活支援員\"],[\"Isi bantuan\",\"財産管理 (kelola sewa apartemen, stempel & buku tabungan, jual properti, bagi warisan) · 身上監護 (kontrak masuk-keluar RS/fasilitas, kontrak layanan kaigo, pembayaran)\",\"日常的金銭管理 (bayar tagihan, pajak, biaya medis & layanan) · penitipan dokumen (buku tabungan ≤500 ribu yen, stempel bank) · bantuan memakai layanan kesejahteraan\"],[\"Biaya\",\"Dari harta pengguna\",\"Sampai kontrak: dana publik; setelah kontrak: pengguna bayar\"],[\"Keringanan\",\"成年後見制度利用支援事業 dll.\",\"Penerima 生活保護: subsidi publik\"]]},\"list\":[{\"k\":\"その{他|た}\",\"t\":\"Keduanya tetap bisa dipakai meski pengguna masuk RS atau fasilitas.\\nOrang yang cukup mampu memahami kontrak program kemandirian TETAP boleh memakai perwalian dewasa.\"}],\"tip\":\"Kata kunci: 民法・家裁・後見人 ⇔ 社会福祉法・社協・専門員. Menjual properti = hanya perwalian.\"},{\"tag\":\"★ 頻出\",\"h\":\"{成年後見制度|せいねんこうけんせいど}のしくみ\",\"hid\":\"Struktur perwalian dewasa\",\"jp\":\"{成年後見制度|せいねんこうけんせいど}は、{精神上|せいしんじょう}の{障害|しょうがい}により{判断能力|はんだんのうりょく}が{不十分|ふじゅうぶん}であるために、{法律行為|ほうりつこうい}の{意思決定|いしけってい}が{困難|こんなん}な{人|ひと}を{後見人|こうけんにん}などが{保護|ほご}する{制度|せいど}です。{申立|もうした}ては{家庭裁判所|かていさいばんしょ}に{対|たい}して{行|おこな}います。\",\"id\":\"Melindungi orang yang sulit mengambil keputusan hukum karena kemampuan menilainya kurang. Permohonan ke 家庭裁判所, yang menunjuk wali dan pengawas wali berdasarkan wewenangnya (職権).\\n\\n2 jenis:\\n・法定後見制度 (後見・保佐・補助): untuk orang yang SUDAH kurang mampu menilai.\\n・任意後見制度: sekarang masih mampu, memilih wali untuk MASA DEPAN.\",\"table\":{\"head\":[\"\",\"後見\",\"保佐\",\"補助\"],\"rows\":[[\"Sasaran\",\"Kemampuan menilai SELALU tidak ada (欠く常況)\",\"SANGAT kurang (著しく不十分)\",\"Kurang (不十分)\"],[\"Yang bisa mengajukan\",\"Pengguna, pasangan, kerabat s.d. derajat 4, jaksa, 市町村長, dll.\",\"(sama)\",\"(sama)\"],[\"Hak mewakili\",\"SEMUA tindakan hukum terkait harta\",\"Hanya \\\"tindakan hukum tertentu\\\" yang ditetapkan pengadilan\",\"(sama dengan 保佐)\"],[\"Nama\",\"成年後見人\",\"保佐人\",\"補助人\"]]},\"list\":[{\"k\":\"{後見人等|こうけんにんとう}になれる{人|ひと}\",\"t\":\"Selain pasangan dan kerabat, juga profesional seperti PENGACARA, dan BADAN HUKUM seperti 社会福祉法人.\"},{\"k\":\"{後見人|こうけんにん}の{職務|しょくむ}\",\"t\":\"Tindakan HUKUM: 財産管理 (mengelola harta untuk pengguna) + 身上監護/身上保護 (mewakili kontrak kaigo, kontrak rawat inap). Tindakan perawatan langsung (介護行為) TIDAK termasuk.\"},{\"k\":\"{取消|とりけ}し\",\"t\":\"Tindakan hukum oleh 成年被後見人 bisa dibatalkan, KECUALI tindakan sehari-hari seperti membeli kebutuhan harian.\"}],\"tip\":\"Wali tidak memandikan atau menyuapi. Membeli kebutuhan harian tidak bisa dibatalkan.\"},{\"tag\":\"★ 頻出\",\"h\":\"{任意後見制度|にんいこうけんせいど}\",\"hid\":\"Perwalian sukarela\",\"jp\":\"{任意後見制度|にんいこうけんせいど}は、{本人|ほんにん}が{契約|けいやく}の{締結|ていけつ}に{必要|ひつよう}な{判断能力|はんだんのうりょく}を{有|ゆう}している{間|あいだ}に、{将来|しょうらい}のために、{後見事務|こうけんじむ}の{内容|ないよう}と{任意後見人|にんいこうけんにん}を{自|みずか}ら{事前|じぜん}の{契約|けいやく}によって{決|き}めておく{制度|せいど}です。\",\"id\":\"Selagi masih mampu, pengguna SENDIRI menentukan lewat kontrak: isi tugas wali dan siapa walinya, untuk berjaga-jaga di masa depan.\",\"table\":{\"head\":[\"Tahap\",\"Isi\"],\"rows\":[[\"1. 任意後見契約\",\"Dibuat di 公証人役場 dalam bentuk 「公正証書」 (akta notaris)\"],[\"2. 登記\",\"Setelah akta dibuat, didaftarkan ke 法務局 atas permintaan (嘱託) notaris\"],[\"3. 後見開始の審判\",\"Saat kemampuan menurun: pengguna, pasangan, kerabat s.d. derajat 4, atau calon wali (任意後見受任者) mengajukan 「任意後見監督人選任の申立て」 ke 家庭裁判所\"]]},\"tip\":\"Perwalian sukarela baru BERLAKU setelah 任意後見監督人 ditunjuk.\"},{\"tag\":\"★ 頻出\",\"h\":\"{成年後見制度利用支援事業|せいねんこうけんせいどりようしえんじぎょう}\",\"hid\":\"Program dukungan penggunaan perwalian\",\"jp\":\"{成年後見制度|せいねんこうけんせいど}の{利用|りよう}が{有効|ゆうこう}にもかかわらず、{利用|りよう}が{困難|こんなん}な{人|ひと}に{対|たい}し、{制度|せいど}の{利用|りよう}を{支援|しえん}する{制度|せいど}です。\",\"id\":\"Membantu orang yang perlu perwalian tapi sulit memakainya (biasanya karena biaya).\",\"table\":{\"head\":[\"Hal\",\"Isi\"],\"rows\":[[\"Asuransi kaigo\",\"Upaya OPSIONAL (任意事業) dalam 地域支援事業\"],[\"UU Dukungan Menyeluruh Disabilitas\",\"Upaya WAJIB (必須事業) dalam 地域生活支援事業\"],[\"Sasaran\",\"Penderita demensia, disabilitas intelektual/mental yang sulit memakai perwalian tanpa subsidi\"],[\"Yang disubsidi\",\"Biaya permohonan (biaya pendaftaran, biaya penilaian dokter, dll.) dan HONOR wali\"]]},\"tip\":\"Kaigo = 任意事業, disabilitas = 必須事業. Ini jebakan yang sering dipakai.\"},{\"tag\":\"★ 頻出\",\"h\":\"{成年後見制度|せいねんこうけんせいど}の{利用状況|りようじょうきょう}（2024{年|ねん}）\",\"hid\":\"Data penggunaan perwalian 2024\",\"jp\":\"{最高裁判所事務総局家庭局|さいこうさいばんしょじむそうきょくかていきょく}「{成年後見関係事件|せいねんこうけんかんけいじけん}の{概況|がいきょう}」より。\",\"id\":\"Data kasus perwalian dewasa (Januari–Desember 2024):\",\"table\":{\"head\":[\"Hal\",\"Data\"],\"rows\":[[\"Jumlah permohonan\",\"後見開始 28.785 (TERBANYAK) · 保佐開始 9.156 · 補助開始 3.026 · 任意後見 874\"],[\"Pemohon\",\"市区町村長 23,9% (TERBANYAK) · pengguna sendiri 23,5% · anak 19% · saudara 11% · orang tua 5% · pasangan 4%\"],[\"Siapa walinya\",\"Kerabat 17% (anak 9%) · BUKAN kerabat 83% (±80%)\"],[\"Wali bukan kerabat\",\"司法書士 29% (TERBANYAK) · 弁護士 21% · 社会福祉士 17% · 社協, dll.\"]]},\"tip\":\"Tiga \\\"terbanyak\\\": 後見開始, 市区町村長, 司法書士. Wali bukan kerabat ±80%.\"},{\"tag\":\"★ 頻出\",\"h\":\"{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}のしくみ\",\"hid\":\"Struktur program kemandirian hidup sehari-hari\",\"jp\":\"{実施主体|じっしゅたい}は{都道府県|とどうふけん}・{指定都市|していとし}の{社会福祉協議会|しゃかいふくしきょうぎかい}です。{業務|ぎょうむ}の{一部|いちぶ}を{市町村社会福祉協議会|しちょうそんしゃかいふくしきょうぎかい}（{基幹的社協|きかんてきしゃきょう}）などに{委託|いたく}できます。\",\"id\":\"Alur: pengguna (di rumah/fasilitas) ⇄ KONTRAK dengan 社協 kota (loket). 専門員 membuat rencana dukungan dan memberi instruksi ke 生活支援員, yang memberikan layanan. 社協 prefektur (pelaksana) mengawasi, dan 契約締結審査会 memeriksa kemampuan kontrak. 運営適正化委員会 (lembaga pihak ketiga) menerima laporan, mengawasi, memberi saran, dan menerima keluhan.\",\"table\":{\"head\":[\"Peran\",\"Tugas\"],\"rows\":[[\"生活支援員\",\"Memberi bantuan sesuai rencana dukungan\"],[\"専門員\",\"Membuat RENCANA dukungan, urusan kontrak, membimbing 生活支援員; prinsipnya diangkat dari 社会福祉士・精神保健福祉士\"],[\"契約締結審査会\",\"Di 社協 prefektur/指定都市; memeriksa jika kemampuan kontrak diragukan\"]]},\"list\":[{\"k\":\"① {福祉|ふくし}サービスの{利用援助|りようえんじょ}\",\"t\":\"Informasi dan saran, bantuan prosedur (kontrak), bantuan memakai sistem pengaduan; juga bantuan renovasi rumah, sewa rumah, kontrak konsumen, urusan administrasi (lapor 住民票).\"},{\"k\":\"② {日常的金銭管理|にちじょうてききんせんかんり}など\",\"t\":\"Membayar biaya layanan, menarik/menyetor/menutup tabungan; kunjungan rutin untuk memantau perubahan hidup.\"},{\"k\":\"{利用料|りようりょう}\",\"t\":\"Rata-rata 1.200 yen per kali (beda per pelaksana). Konsultasi awal sebelum kontrak dan rumah tangga 生活保護: GRATIS.\"}],\"tip\":\"Rencana dibuat 専門員, bukan 生活支援員. Tetap bisa dipakai saat masuk RS/fasilitas.\"},{\"tag\":\"★ 頻出\",\"h\":\"{苦情解決|くじょうかいけつ}のしくみ\",\"hid\":\"Sistem keberatan & keluhan\",\"jp\":\"{行政処分|ぎょうせいしょぶん}への{不服|ふふく}は「{審査請求|しんさせいきゅう}」、サービスへの{苦情|くじょう}は「{苦情解決|くじょうかいけつ}」の{窓口|まどぐち}に{申|もう}し{立|た}てます。{審査請求期間|しんさせいきゅうきかん}は、その{処分|しょぶん}があったことを{知|し}った{日|ひ}の{翌日|よくじつ}から3か{月|げつ}{以内|いない}です。\",\"id\":\"Tidak puas KEPUTUSAN pemerintah → 審査請求 (banding administratif), dalam 3 BULAN sejak hari berikutnya setelah mengetahui keputusan. Keluhan tentang LAYANAN → lembaga penyelesaian keluhan.\",\"table\":{\"head\":[\"Jenis\",\"Tujuan\",\"Isi\"],\"rows\":[[\"審査請求\",\"国民健康保険審査会\",\"Keputusan manfaat & iuran 国保\"],[\"審査請求\",\"介護保険審査会\",\"Sertifikasi perlu perawatan, manfaat, iuran asuransi kaigo\"],[\"審査請求\",\"都道府県知事\",\"Keputusan 市町村長 (misalnya 生活保護)\"],[\"審査請求\",\"障害者介護給付費等不服審査会\",\"Kategori dukungan disabilitas, jenis layanan, keputusan pemberian, beban pengguna (障害者総合支援法)\"],[\"Keluhan layanan\",\"市町村\",\"Keluhan TAHAP PERTAMA sebagai penyelenggara\"],[\"Keluhan layanan\",\"介護サービス苦情処理委員会\",\"Di 国保連; keluhan terhadap penyedia layanan KAIGO\"],[\"Keluhan layanan\",\"運営適正化委員会\",\"Di 社協 PREFEKTUR; keluhan layanan KESEJAHTERAAN\"],[\"Keluhan layanan\",\"苦情解決責任者 (担当者)\",\"Ditempatkan di tiap TEMPAT LAYANAN\"]]},\"tip\":\"Kaigo: keputusan → 介護保険審査会; layanan → 国保連. Kesejahteraan umum → 運営適正化委員会.\"}], points: [\"★ 成年後見 = 民法・法務省・家庭裁判所. 日常生活自立支援 = 社会福祉法・厚労省・社協.\",\"★ 後見 (selalu tidak mampu) · 保佐 (sangat kurang) · 補助 (kurang, perlu persetujuan pengguna).\",\"★ Pemohon: pengguna, pasangan, kerabat s.d. derajat 4, jaksa, 市町村長.\",\"★ Tugas wali = 財産管理 + 身上監護; tanpa 介護行為. Pembelian harian tidak bisa dibatalkan.\",\"★ 任意後見: akta notaris → 法務局 → 任意後見監督人 dipilih.\",\"★ 利用支援事業: kaigo 任意, disabilitas 必須.\",\"★ 2024: 後見開始, 市区町村長 (23,9%), 司法書士 (29%) terbanyak; bukan kerabat 83%.\",\"★ 専門員 = rencana; 生活支援員 = pelaksana; 1.200 yen/kali.\",\"★ 審査請求 3 bulan. 国保連 = keluhan kaigo. 運営適正化委員会 = 社協 prefektur.\"], quiz: [{\"jp\":\"{日常生活自立支援事業|にちじょうせいかつじりつしえんじぎょう}について、{正|ただ}しいものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 pernyataan benar tentang program dukungan kemandirian hidup sehari-hari.\",\"answer\":4,\"opts\":[{\"jp\":\"{民法|みんぽう}に{基|もと}づく\",\"id\":\"Berdasarkan KUH Perdata\",\"reason\":\"Berdasarkan 社会福祉法.\"},{\"jp\":\"{家庭裁判所|かていさいばんしょ}に{申|もう}し{立|た}てる\",\"id\":\"Diajukan ke pengadilan keluarga\",\"reason\":\"Ke 社協 kota.\"},{\"jp\":\"{不動産|ふどうさん}の{売却|ばいきゃく}を{行|おこな}う\",\"id\":\"Menjual properti\",\"reason\":\"Itu perwalian.\"},{\"jp\":\"{生活支援員|せいかつしえんいん}が{支援計画|しえんけいかく}を{作成|さくせい}する\",\"id\":\"生活支援員 membuat rencana\",\"reason\":\"Dibuat 専門員.\"},{\"jp\":\"{本人|ほんにん}と{社会福祉協議会|しゃかいふくしきょうぎかい}の{契約|けいやく}による\",\"id\":\"Lewat kontrak pengguna & 社協\",\"reason\":\"Benar.\"}],\"explain\":\"社会福祉法 · 社協 · kontrak · 専門員 = rencana · 生活支援員 = pelaksana.\"},{\"jp\":\"{成年後見人|せいねんこうけんにん}の{職務|しょくむ}として{適切|てきせつ}でないものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 yang BUKAN tugas wali dewasa.\",\"answer\":2,\"opts\":[{\"jp\":\"{預貯金|よちょきん}の{管理|かんり}\",\"id\":\"Mengelola tabungan\",\"reason\":\"Tugas (財産管理).\"},{\"jp\":\"{介護|かいご}サービスの{契約|けいやく}\",\"id\":\"Kontrak layanan kaigo\",\"reason\":\"Tugas (身上監護).\"},{\"jp\":\"{入浴|にゅうよく}の{介助|かいじょ}\",\"id\":\"Membantu mandi\",\"reason\":\"Benar. 介護行為 tidak termasuk.\"},{\"jp\":\"{入院|にゅういん}の{契約|けいやく}\",\"id\":\"Kontrak rawat inap\",\"reason\":\"Tugas.\"},{\"jp\":\"{不動産|ふどうさん}の{売却|ばいきゃく}\",\"id\":\"Menjual properti\",\"reason\":\"Tugas.\"}],\"explain\":\"Tugas wali = tindakan hukum (財産管理 + 身上監護). Perawatan langsung tidak termasuk.\"},{\"jp\":\"2024{年|ねん}の{成年後見関係事件|せいねんこうけんかんけいじけん}で、{成年後見人等|せいねんこうけんにんとう}として{最|もっと}も{多|おお}いものを1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 wali dewasa terbanyak tahun 2024.\",\"answer\":1,\"opts\":[{\"jp\":\"{子|こ}\",\"id\":\"Anak\",\"reason\":\"9%.\"},{\"jp\":\"{司法書士|しほうしょし}\",\"id\":\"Juru tulis hukum\",\"reason\":\"Benar. 29%.\"},{\"jp\":\"{弁護士|べんごし}\",\"id\":\"Pengacara\",\"reason\":\"21%.\"},{\"jp\":\"{社会福祉士|しゃかいふくしし}\",\"id\":\"Pekerja sosial\",\"reason\":\"17%.\"},{\"jp\":\"{配偶者|はいぐうしゃ}\",\"id\":\"Pasangan\",\"reason\":\"Lebih sedikit.\"}],\"explain\":\"Wali bukan kerabat 83%; terbanyak 司法書士.\"}] },\n  'shakai-b5': { title: '虐待', titleId: 'Kekerasan: lansia, disabilitas, anak, DV (第1章 2節 ⑤)', terms: [\"d5_gyakutai\",\"d5_koreiho\",\"d5_shogaiho\",\"d5_jidoho\",\"d5_dvho\",\"d5_yogosha\",\"d5_juji\",\"d5_yokaigoshisetsu\",\"d5_shiyosha\",\"d5_shintai\",\"d5_shinri\",\"d5_seiteki\",\"d5_neglect\",\"d5_keizai\",\"d5_boryoku\",\"d5_bogen\",\"d5_kyozetsu\",\"d5_genshoku\",\"d5_hochi\",\"d5_tsuho\",\"d5_doryoku\",\"d5_tsukoku\",\"d5_juudai\",\"d5_shuhi\",\"d5_menseki\",\"d5_kaiko\",\"d5_todokede\",\"d5_juri\",\"d5_anzen\",\"d5_tachiiri\",\"d5_keisatsu\",\"d5_enjo\",\"d5_sochi\",\"d5_ichiji\",\"d5_boshicenter\",\"d5_kenricenter\",\"d5_rodokyoku\",\"d5_shakaishoheki\",\"d5_bunri\",\"d5_zokugara\",\"d5_kyodoseikatsu\",\"d5_jidosodan\",\"d5_shinken\",\"d5_taibatsu\",\"d5_shutto\",\"d5_rinken\",\"d5_sosaku\",\"d5_kyokajo\",\"d5_menkai\",\"d5_soshitsu\",\"d5_dv\",\"d5_haiguusha\",\"d5_jijitsukon\",\"d5_junyo\",\"d5_dvcenter\",\"d5_josei\",\"d5_joseijiritsu\",\"d5_hogomeirei\",\"d5_sekkin\",\"d5_taikyo\",\"d5_chisai\",\"d5_iryo\"], sections: [{\"tag\":\"★★ 重要度\",\"h\":\"{高齢者虐待防止法|こうれいしゃぎゃくたいぼうしほう}\",\"hid\":\"UU Pencegahan Kekerasan terhadap Lansia\",\"jp\":\"「{高齢者虐待|こうれいしゃぎゃくたい}の{防止|ぼうし}、{高齢者|こうれいしゃ}の{養護者|ようごしゃ}に{対|たい}する{支援等|しえんとう}に{関|かん}する{法律|ほうりつ}」です。5{種類|しゅるい}の{虐待|ぎゃくたい}が{定義|ていぎ}されています。\",\"id\":\"Lansia = 65 tahun ke atas. Penyandang disabilitas di bawah 65 yang tinggal di fasilitas perawatan (養介護施設) atau memakai layanan perawatan (養介護事業) DIANGGAP lansia untuk pasal kekerasan oleh staf.\\n\\nPelaku: ① 養護者 (pengasuh/keluarga) ② 養介護施設従事者等 (staf fasilitas/usaha perawatan).\\n・養介護施設: panti kesejahteraan lansia, panti berbayar, fasilitas asuransi kaigo, 地域包括支援センター, dll.\\n・養介護事業: usaha dukungan hidup di rumah, layanan di rumah, dll.\",\"table\":{\"head\":[\"Jenis\",\"Arti\"],\"rows\":[[\"身体的虐待\",\"Kekerasan yang menyebabkan atau BISA menyebabkan luka\"],[\"心理的虐待\",\"Kata-kata sangat kasar, sikap MENOLAK, dll. yang melukai batin\"],[\"性的虐待\",\"Melakukan atau MEMAKSA tindakan asusila\"],[\"介護等放棄 (ネグレクト)\",\"Sangat mengabaikan perawatan: mengurangi makan sampai lemah, membiarkan lama\"],[\"経済的虐待\",\"Menjual/memakai harta lansia secara tidak sah, mengambil keuntungan\"]]},\"list\":[{\"k\":\"{通報義務|つうほうぎむ} ①{養護者|ようごしゃ}による{虐待|ぎゃくたい}\",\"t\":\"Jika ada BAHAYA SERIUS bagi jiwa atau tubuh → WAJIB segera lapor ke 市町村.\"},{\"k\":\"{通報義務|つうほうぎむ} ②{施設従事者等|しせつじゅうじしゃとう}による{虐待|ぎゃくたい}\",\"t\":\"Staf yang menemukan lansia yang DIDUGA mengalami kekerasan oleh staf → WAJIB segera lapor ke 市町村 (tanpa melihat tingkat bahaya).\"},{\"k\":\"{免責|めんせき}\",\"t\":\"Melapor tidak melanggar kewajiban kerahasiaan (守秘義務). Staf tidak boleh dipecat atau dirugikan karena melapor.\"}],\"tip\":\"Perbedaan ① dan ② sering keluar: pengasuh = wajib hanya jika bahaya serius; staf = selalu wajib.\",\"fig\":[\"fig-d2-11.webp\"]},{\"tag\":\"★ 頻出\",\"h\":\"{高齢者虐待|こうれいしゃぎゃくたい}への{対応|たいおう}\",\"hid\":\"Alur penanganan kekerasan lansia\",\"jp\":\"{通報|つうほう}・{届出|とどけで}は{市町村|しちょうそん}が{受理|じゅり}します（{地域包括支援|ちいきほうかつしえん}センターへ{委託可|いたくか}）。\",\"id\":\"Alur:\\n1. Penemu → LAPOR (通報); korban sendiri → PEMBERITAHUAN (届出) ke 市町村 (konsultasi, bimbingan, saran; bisa diserahkan ke 地域包括支援センター).\\n2. Konfirmasi keselamatan & fakta.\\n3. Jika ada bahaya serius → 立入調査・質問 (pemeriksaan di tempat); kota bisa MEMINTA BANTUAN 警察署長.\\n4. Tindakan: 老人福祉法に基づく措置 (misalnya penempatan sementara di 特養) dan 市町村長 mengajukan 成年後見等開始の審判.\",\"tip\":\"Yang dimintai bantuan saat pemeriksaan = 警察署長. Yang mengajukan perwalian = 市町村長.\"},{\"tag\":\"★ 頻出\",\"h\":\"{高齢者虐待|こうれいしゃぎゃくたい}の{統計|とうけい}（{令和|れいわ}5{年度|ねんど}）\",\"hid\":\"Statistik kekerasan lansia 2023\",\"jp\":\"{厚生労働省|こうせいろうどうしょう}の{調査結果|ちょうさけっか}です。どちらも{身体的虐待|しんたいてきぎゃくたい}が{最|もっと}も{多|おお}いです。\",\"id\":\"Konsultasi/laporan terus naik sejak 2006. Oleh pengasuh: 40.386 laporan, 17.100 dinilai kekerasan. Oleh staf: 3.441 laporan, 1.123 dinilai kekerasan.\",\"table\":{\"head\":[\"Hal\",\"養護者 (pengasuh)\",\"施設従事者等 (staf)\"],\"rows\":[[\"Jenis\",\"Fisik 65% (TERBANYAK) · psikologis 38% · penelantaran 19% · ekonomi 16%\",\"Fisik 51% (TERBANYAK) · psikologis 24% · penelantaran 22%\"],[\"Jenis kelamin korban\",\"Wanita 76%\",\"Wanita 72%\"],[\"Usia korban terbanyak\",\"80–84 (26%)\",\"90–94 (22%), 85–89 (21%)\"],[\"Kondisi korban\",\"Bersertifikasi perlu perawatan 72%; 認知症自立度 II+ 74%\",\"–\"],[\"Pelaku\",\"Tinggal hanya dengan pelaku 53%; ANAK LAKI-LAKI 39% · suami 23% · anak perempuan 19% · istri 8%\",\"Fasilitas: 特養 31% · panti berbayar 28% · GH demensia 14% · 老健 10%\"],[\"Pelapor\",\"POLISI 34% · care manager 25% · keluarga 8% · korban 6%\",\"–\"],[\"Pemisahan\",\"Tidak dipisah 52% · dipisah 20%; cara: layanan kaigo 34%, rawat inap sementara 17%, 措置 16%\",\"–\"]]},\"tip\":\"Tiga angka paling sering: fisik terbanyak, pelaku 息子 39%, pelapor 警察 34%.\"},{\"tag\":\"★★ 重要度\",\"h\":\"{障害者虐待防止法|しょうがいしゃぎゃくたいぼうしほう}\",\"hid\":\"UU Pencegahan Kekerasan terhadap Penyandang Disabilitas\",\"jp\":\"{何人|なんぴと}も、{障害者|しょうがいしゃ}に{対|たい}し、{虐待|ぎゃくたい}をしてはならない。\",\"id\":\"Penyandang disabilitas = disabilitas fisik, intelektual, mental (termasuk perkembangan) dll., yang hidupnya terbatas terus-menerus karena disabilitas DAN hambatan sosial (社会的障壁).\\n\\nPelaku ada 3: ① 養護者 ② 障害者福祉施設従事者等 ③ 使用者 (PEMBERI KERJA).\\n5 jenis: fisik, psikologis, seksual, penelantaran, ekonomi.\",\"table\":{\"head\":[\"Pelaku\",\"Kewajiban lapor\",\"Tujuan\"],\"rows\":[[\"① 養護者\",\"\\\"Diduga\\\" mengalami → wajib segera lapor\",\"市町村\"],[\"② 施設従事者等\",\"\\\"Diduga\\\" mengalami → wajib segera lapor\",\"市町村\"],[\"③ 使用者\",\"\\\"Diduga\\\" mengalami → wajib segera lapor\",\"市町村 ATAU 都道府県\"]]},\"list\":[{\"k\":\"{市町村障害者虐待防止|しちょうそんしょうがいしゃぎゃくたいぼうし}センター\",\"t\":\"Fungsi dijalankan oleh bagian/fasilitas kota.\"},{\"k\":\"{都道府県障害者権利擁護|とどうふけんしょうがいしゃけんりようご}センター\",\"t\":\"Fungsi dijalankan oleh bagian/fasilitas prefektur.\"},{\"k\":\"{免責|めんせき}\",\"t\":\"Tidak melanggar kerahasiaan; staf dan pekerja tidak boleh dipecat/dirugikan karena melapor.\"},{\"k\":\"{対応|たいおう}\",\"t\":\"Kota: konfirmasi → pemeriksaan (bantuan 警察署長) → perlindungan sementara di fasilitas disabilitas, pengajuan perwalian.\\nLaporan kekerasan staf: kota → LAPOR ke prefektur.\\nLaporan kekerasan pemberi kerja: kota → BERI TAHU prefektur → gubernur lapor ke 都道府県労働局.\"}],\"tip\":\"Beda dengan lansia: disabilitas punya pelaku ke-3 (使用者), dan semua jenis pelaku \\\"wajib lapor\\\" jika diduga.\",\"fig\":[\"fig-d2-13.webp\"]},{\"tag\":\"★ 頻出\",\"h\":\"{障害者虐待|しょうがいしゃぎゃくたい}の{統計|とうけい}（{令和|れいわ}5{年度|ねんど}）\",\"hid\":\"Statistik kekerasan disabilitas 2023\",\"jp\":\"{養護者|ようごしゃ}9,972{件|けん}、{施設従事者等|しせつじゅうじしゃとう}5,618{件|けん}、{使用者|しようしゃ}675{件|けん}の{相談|そうだん}・{通報|つうほう}がありました。\",\"id\":\"Laporan terus naik sejak 2012. Dinilai kekerasan: pengasuh 2.283, staf 1.194.\",\"table\":{\"head\":[\"Hal\",\"養護者\",\"施設従事者等\"],\"rows\":[[\"Jenis\",\"Fisik 68% · psikologis 32%\",\"Fisik 52% · psikologis 48%\"],[\"Jenis kelamin\",\"Wanita 64%\",\"PRIA 67%\"],[\"Jenis disabilitas\",\"Intelektual 1.044 · mental 1.015 · fisik 384\",\"INTELEKTUAL 1.751 · mental 446 · fisik 444\"],[\"Pelaku\",\"Tinggal bersama 85%; IBU 25% · ayah 24% · suami 16%\",\"Fasilitas: 共同生活援助 (GH) 28% · 障害者支援施設 20% · 生活介護 13%\"],[\"Pelapor\",\"POLISI 53% · korban 11% · staf 11% · 相談支援専門員 11%\",\"–\"],[\"Pemisahan\",\"Dipisah 34% · tidak 47%; cara: layanan disabilitas 45%\",\"–\"]]},\"list\":[{\"k\":\"{使用者|しようしゃ}による{虐待|ぎゃくたい}\",\"t\":\"Pelapor terbanyak: KORBAN SENDIRI (41%), lalu staf fasilitas 12%, keluarga 12%.\"}],\"tip\":\"Perbedaan dengan lansia: pelaku pengasuh terbanyak IBU (bukan anak laki-laki), korban staf mayoritas PRIA.\"},{\"tag\":\"★★ 重要度\",\"h\":\"{児童虐待|じどうぎゃくたい}\",\"hid\":\"Kekerasan terhadap anak\",\"jp\":\"{児童相談所|じどうそうだんじょ}の{児童虐待相談|じどうぎゃくたいそうだん}の{対応件数|たいおうけんすう}は{令和|れいわ}5{年度|ねんど}225,509{件|けん}です。{心理的虐待|しんりてきぎゃくたい}が60%で{最|もっと}も{多|おお}いです。\",\"id\":\"Kasus: 225.509 (2023), naik tajam sejak 1990. Jenis: PSIKOLOGIS 60% · fisik 23% · penelantaran 16% · seksual (sedikit). Jalur laporan: polisi 52% · tetangga 10% · keluarga 9% · sekolah 7%.\",\"table\":{\"head\":[\"Aturan\",\"Isi\"],\"rows\":[[\"Larangan\",\"SIAPA PUN tidak boleh menganiaya anak\"],[\"Deteksi dini\",\"Lembaga/orang yang pekerjaannya terkait kesejahteraan anak harus BERUSAHA mendeteksi dini\"],[\"Menghormati anak\",\"Pemegang hak asuh harus menghormati kepribadian anak saat mendidik; DILARANG hukuman fisik\"],[\"Kewajiban lapor\",\"Menemukan anak yang DIDUGA mengalami kekerasan → segera 通告 ke 市町村, 福祉事務所 prefektur, atau 児童相談所\"],[\"出頭要求等\",\"Gubernur meminta wali datang MEMBAWA anak untuk diperiksa\"],[\"立入調査等\",\"Gubernur menyuruh 児童委員/petugas masuk ke rumah anak\"],[\"臨検・捜索等\",\"Jika wali menolak tanpa alasan sah: dengan 許可状 dari HAKIM, masuk paksa dan mencari anak\"],[\"援助要請\",\"Kepala 児童相談所 bisa meminta bantuan 警察署長\"],[\"面会等の制限\",\"Setelah penempatan/perlindungan sementara: membatasi pertemuan dan komunikasi wali dengan anak\"]]},\"tip\":\"Anak: istilahnya 通告 (bukan 通報). Jenis terbanyak psikologis. Hanya anak yang punya 臨検・捜索.\",\"fig\":[\"fig-d2-14.webp\"]},{\"tag\":\"★ 頻出\",\"h\":\"DV（ドメスティック・バイオレンス）\",\"hid\":\"Kekerasan dalam rumah tangga (pasangan)\",\"jp\":\"{配偶者暴力相談支援|はいぐうしゃぼうりょくそうだんしえん}センターの{相談件数|そうだんけんすう}は2023{年度|ねんど}{約|やく}12{万|まん}7{千件|せんけん}です（{来所|らいしょ}{約|やく}30%、{電話|でんわ}{約|やく}66%）。\",\"id\":\"Konsultasi ±127 ribu (2023): datang langsung ±30%, telepon ±66%. Tempat konsultasi: 男女共同参画センター 27% · 女性相談支援センター 25% · 福祉事務所・保健所 20%. Pelaku: pasangan resmi 79% · mantan 14% · pacar 4%. Pelapor wanita 97%.\",\"table\":{\"head\":[\"Hal\",\"Isi\"],\"rows\":[[\"配偶者からの暴力\",\"Kekerasan FISIK, atau ucapan/perilaku setara yang merugikan jiwa-raga\"],[\"配偶者\",\"Termasuk yang BELUM mencatatkan nikah tapi hidup seperti suami-istri\"],[\"離婚\",\"Termasuk yang berpisah secara nyata tanpa pencatatan\"],[\"準用\",\"UU ini juga berlaku untuk PACAR yang tinggal bersama (生活の本拠を共にする)\"],[\"配偶者暴力相談支援センター\",\"PREFEKTUR wajib menjalankan fungsinya (di 女性相談支援センター dll.); KOTA berusaha\"],[\"女性自立支援施設\",\"Prefektur bisa melindungi korban di sini\"],[\"通報\",\"Menemukan korban kekerasan FISIK → BERUSAHA melapor ke センター atau POLISI\"]]},\"tip\":\"DV hanya kewajiban BERUSAHA (努力義務) dan hanya untuk kekerasan fisik.\",\"fig\":[\"fig-d2-15.webp\"]},{\"tag\":\"★★ 重要度\",\"h\":\"4つの{法律|ほうりつ}の{比較|ひかく}\",\"hid\":\"Perbandingan 4 UU perlindungan\",\"jp\":\"{虐待|ぎゃくたい}などを{受|う}けている{方|かた}を{守|まも}る{法律|ほうりつ}の{全体像|ぜんたいぞう}を{整理|せいり}しましょう。\",\"id\":\"Tabel paling penting di bab ini. Geser ke samping untuk melihat semua kolom.\",\"table\":{\"head\":[\"Hal\",\"高齢者虐待防止法\",\"障害者虐待防止法\",\"児童虐待防止法\",\"配偶者暴力防止法\"],\"rows\":[[\"Berlaku\",\"H18 (2006)\",\"H24 (2012)\",\"H12 (2000)\",\"H13 (2001)\"],[\"Sasaran\",\"65+\",\"Fisik, intelektual, mental (termasuk perkembangan)\",\"Anak <18 yang diasuh wali\",\"Korban kekerasan PASANGAN (termasuk nikah siri, tinggal bersama)\"],[\"Jenis\",\"5 jenis\",\"5 jenis\",\"4 jenis (TANPA ekonomi)\",\"Kekerasan fisik / ucapan setara\"],[\"Penemu\",\"Pengasuh + bahaya serius → wajib; lainnya → berusaha\",\"Diduga → wajib\",\"Diduga → 通告 wajib\",\"Kekerasan FISIK saja → BERUSAHA\"],[\"Profesional\",\"Berusaha deteksi dini; staf yang tahu kekerasan staf → wajib\",\"Berusaha deteksi dini; kekerasan sta ius\",\"reason\":\"Itu untuk pengasuh.\"},{\"jp\":\"{都道府県|とどうふけん}に{通報|つうほう}する\",\"id\":\"Lapor ke prefektur\",\"reason\":\"Ke 市町村.\"},{\"jp\":\"{通報|つうほう}は{努力義務|どりょくぎむ}である\",\"id\":\"Hanya berusaha\",\"reason\":\"Wajib.\"},{\"jp\":\"{速|すみ}やかに{市町村|しちょうそん}に{通報|つうほう}しなければならない\",\"id\":\"Wajib segera lapor ke kota\",\"reason\":\"Benar.\"},{\"jp\":\"{施設長|しせつちょう}の{許可|きょか}が{必要|ひつよう}\",\"id\":\"Perlu izin kepala fasilitas\",\"reason\":\"Tidak perlu.\"}],\"explain\":\"Staf: selalu wajib lapor ke 市町村. Pengasuh: wajib hanya jika bahaya serius.\"},{\"jp\":\"{児童虐待防止法|じどうぎゃくたいぼうしほう}に{規定|きてい}がない{虐待|ぎゃくたい}の{種類|しゅるい}を1つ{選|えら}びなさい。\",\"id\":\"Pilih 1 jenis kekerasan yang TIDAK ada di UU kekerasan anak.\",\"answer\":4,\"opts\":[{\"jp\":\"{身体的虐待|しんたいてきぎゃくたい}\",\"id\":\"Fisik\",\"reason\":\"Ada.\"},{\"jp\":\"{心理的虐待|しんりてきぎゃくたい}\",\"id\":\"Psikologis\",\"reason\":\"Ada.\"},{\"jp\":\"{性的虐待|せいてきぎゃくたい}\",\"id\":\"Seksual\",\"reason\":\"Ada.\"},{\"jp\":\"ネグレクト\",\"id\":\"Penelantaran\",\"reason\":\"Ada.\"},{\"jp\":\"{経済的虐待|けいざいてきぎゃくたい}\",\"id\":\"Ekonomi\",\"reason\":\"Benar. Tidak ada.\"}],\"explain\":\"Anak: 4 jenis (tanpa ekonomi). Lansia & disabilitas: 5 jenis.\"},{\"jp\":\"{配偶者暴力防止法|はいぐうしゃぼうりょくぼうしほう}（DV{防止法|ぼうしほう}）で、{保護命令|ほごめいれい}を{出|だ}すのはどこか。1つ{選|えら}びなさい。\",\"id\":\"Siapa yang mengeluarkan perintah perlindungan dalam UU DV? Pilih 1.\",\"answer\":0,\"opts\":[{\"jp\":\"{地方裁判所|ちほうさいばんしょ}\",\"id\":\"Pengadilan distrik\",\"reason\":\"Benar.\"},{\"jp\":\"{家庭裁判所|かていさいばんしょ}\",\"id\":\"Pengadilan keluarga\",\"reason\":\"Bukan.\"},{\"jp\":\"{警察署長|けいさつしょちょう}\",\"id\":\"Kepala polisi\",\"reason\":\"Membantu mencegah kerugian.\"},{\"jp\":\"{市町村長|しちょうそんちょう}\",\"id\":\"Wali kota\",\"reason\":\"Bukan.\"},{\"jp\":\"{女性相談支援|じょせいそうだんしえん}センター\",\"id\":\"Pusat konsultasi wanita\",\"reason\":\"Perlindungan sementara.\"}],\"explain\":\"DV: 保護命令 (接近禁止命令, 退去等命令) dari 地方裁判所.\"}] },\n  'shakai-b1': { title: '個人・家族', titleId: 'Individu & keluarga (第1章 1節 ①)', terms: [\"c1_jinkodotai\",\"c1_jinkopyramid\",\"c1_heikin |しいんべつしぼうりつ}の{推移|すいい}\",\"hid\":\"Perubahan penyebab kematian\",\"jp\":\"1950（{昭和|しょうわ}25）{年|ねん}まで{結核|けっかく}が1{位|い}、1980（{昭和|しょうわ}55）{年|ねん}まで{脳血管疾患|のうけっかんしっかん}が1{位|い}、1981（{昭和|しょうわ}56）{年|ねん}から{悪性新生物|あくせいしんせいぶつ}が1{位|い}です。\",\"id\":\"Urutan penyebab kematian nomor 1: TBC (s.d. 1950) → stroke (s.d. 1980) → kanker (sejak 1981 sampai sekarang). 老衰 meningkat tajam belakangan ini.\",\"tip\":\"Hafalkan tahun 1981: kanker menjadi penyebab kematian nomor 1.\",\"fig\":[\"fig-d1-4b.webp\"]},{\"tag\":\"★ 頻出\",\"h\":\"ライフスタイルの{変化|へんか}と{生活|せいかつ}\",\"hid\":\"Perubahan gaya hidup\",\"jp\":\"ライフステージ、ライフサイクル、ライフコースの{違|ちが}いをおさえましょう。\",\"id\":\"Tiga istilah ini mirip tapi berbeda. Perhatikan kata kuncinya.\",\"list\":[{\"k\":\"ライフステージ\",\"t\":\"Kehidupan dibagi per tahap perkembangan: 乳幼児期 → 児童期 → 青年期 → 成人期 → 老年期.\"},{\"k\":\"ライフサイクル\",\"t\":\"Proses mencapai tugas perkembangan khas di tiap tahap; menganalisis hidup per life stage (dari lahir sampai mati).\"},{\"k\":\"ライフコース\",\"t\":\"Bukan teori perkembangan; individu MEMILIH beberapa jalur hidup dan merancang hidupnya. Berpusat pada INDIVIDU (beda dengan life stage yang dilihat per usia/jenis kelamin).\"}],\"tip\":\"Kata kunci: ステージ = tahap · サイクル = tugas perkembangan · コース = pilihan individu.\"},{\"tag\":\"★ 頻出\",\"h\":\"{社会的役割|しゃかいてきやくわり}\",\"hid\":\"Peran sosial\",\"jp\":\"{社会的役割|しゃかいてきやくわり}とは、{社会的状況|しゃかいてきじょうきょう}のなかで{示|しめ}される{一定|いってい}の{規則性|きそくせい}をもった{行為|こうい}です。\",\"id\":\"Perilaku yang punya keteraturan tertentu dalam situasi sosial.\",\"list\":[{\"k\":\"{役割取得|やくわりしゅとく}\",\"t\":\"Mengenali peran orang lain, lalu membentuk DIRI (自我) dalam hubungannya.\"},{\"k\":\"{役割形成|やくわりけいせい}\",\"t\":\"Melampaui batas peran yang ada dan mengembangkan perilaku BARU.\"},{\"k\":\"{役割葛藤|やくわりかっとう}\",\"t\":\"Merasa tegang karena KONFLIK antara beberapa peran yang dimiliki (misalnya ibu vs pekerja).\"},{\"k\":\"{役割距離|やくわりきょり}\",\"t\":\"Berperilaku MENYIMPANG dari peran yang diharapkan pada posisi tertentu.\"}],\"tip\":\"Sering keluar sebagai soal definisi. 葛藤 = konflik/ketegangan batin.\"},{\"h\":\"{生活領域|せいかつりょういき}とワーク・ライフ・バランス\",\"hid\":\"3 ranah kehidupan\",\"jp\":\"{個人|こじん}の{日常生活|にちじょうせいかつ}は、{基本的欲求|きほんてきよっきゅう}を{基礎|きそ}として「{基礎生活|きそせいかつ}」「{社会生活|しゃかいせいかつ}」「{余暇生活|よかせいかつ}」の3{領域|りょういき}で{成|な}り{立|た}っています。\",\"id\":\"Kehidupan sehari-hari terdiri dari 3 ranah.\",\"list\":[{\"k\":\"{基礎生活|きそせいかつ}\",\"t\":\"Minimal untuk hidup: makan, buang air, tidur.\"},{\"k\":\"{社会生活|しゃかいせいかつ}\",\"t\":\"Hubungan dengan orang lain/organisasi: kerja, belajar, pekerjaan rumah.\"},{\"k\":\"{余暇生活|よかせいかつ}\",\"t\":\"Kegembiraan dan kesegaran hidup: hobi.\"},{\"k\":\"ワーク・ライフ・バランス\",\"t\":\"Menjaga keseimbangan kerja dan kehidupan pribadi (仕事と生活の調和).\"}],\"tip\":\"Pekerjaan rumah (家事) masuk 社会生活, bukan 基礎生活.\"},{\"tag\":\"★ 頻出\",\"h\":\"ジェンダー\",\"hid\":\"Gender\",\"jp\":\"ジェンダーとは、{生物学的|せいぶつがくてき}な{性別|せいべつ}に{対|たい}して、{社会的|しゃかいてき}・{文化的|ぶんかてき}な{役割|やくわり}としての{男女|だんじょ}の{性差|せいさ}のことです。\",\"id\":\"Perbedaan laki-laki dan perempuan sebagai peran SOSIAL-BUDAYA, bukan biologis.\",\"list\":[{\"k\":\"ジェンダー・バイアス\",\"t\":\"Pandangan tetap (prasangka) tentang peran pria/wanita, misalnya menganggap wajar pria bekerja tetap dan wanita tidak bekerja.\"},{\"k\":\"ジェンダー・ギャップ{指数|しすう}\",\"t\":\"Dirilis World Economic Forum; 0 = tidak setara, 1 = setara penuh. Tahun 2024: Jepang 0,663, peringkat 118 dari 146 negara.\"},{\"k\":\"{女性|じょせい}の{労働力率|ろうどうりょくりつ}\",\"t\":\"Turun saat usia menikah/melahirkan, naik lagi setelah anak besar → membentuk \\\"M字カーブ\\\".\"}],\"tip\":\"M字カーブ dan peringkat 118 sering ditanyakan.\"},{\"tag\":\"★ 頻出\",\"h\":\"{親族|しんぞく}と{親等|しんとう}\",\"hid\":\"Kerabat & derajat kekerabatan\",\"jp\":\"{親等|しんとう}は、{親族間|しんぞくかん}の{世数|せすう}を{数|かぞ}えます。{親子|おやこ}が1{親等|しんとう}です。{父母|ふぼ}・{祖父母|そふぼ}・{子|こ}・{孫|まご}のように{縦|たて}につながる{血族|けつぞく}を「{直系血族|ちょっけいけつぞく}」、{共通|きょうつう}の{祖先|そせん}から{分|わ}かれた{親族|しんぞく}を「{傍系親族|ぼうけいしんぞく}」といいます。\",\"id\":\"Derajat dihitung dari jumlah generasi. Untuk kerabat samping: naik ke leluhur bersama, lalu jumlahkan generasinya.\",\"table\":{\"head\":[\"Hubungan\",\"親等\
