plugins { id 'com.android.application' }
android {
    namespace 'com.pahamkaigo.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.pahamkaigo.app'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            storeFile file('pahamkaigo.keystore')
            storePassword 'pahamkaigo2026'
            keyAlias 'pahamkaigo'
            keyPassword 'pahamkaigo2026'
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
