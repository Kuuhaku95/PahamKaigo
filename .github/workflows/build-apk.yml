name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', 'android-admin/**', '.github/workflows/build-apk.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Ikon aplikasi
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Rilis
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PahamKaigo.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk PahamKaigo.apk --title "PahamKaigo (Android)" --notes "Aplikasi Android PahamKaigo. Isi aplikasi otomatis terbarui dari internet."
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Ikon aplikasi
        run: |
          mkdir -p android-admin/app/src/main/res/mipmap-xxxhdpi
          cp icon-192.png android-admin/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
      - name: Build
        run: |
          set -o pipefail
          gradle -p android-admin assembleRelease --no-daemon 2>&1 | tee /tmp/b.log || { grep -iE "error|wrong|cause|failed|\.java:" /tmp/b.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Rilis
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android-admin/app/build/outputs/apk/release/app-release.apk PahamKaigoAdmin.apk
          gh release delete apk-admin -y --cleanup-tag || true
          gh release create apk-admin PahamKaigoAdmin.apk --title "PahamKaigo Admin (Android)" --notes "Aplikasi admin PahamKaigo untuk mengelola akun peserta."
